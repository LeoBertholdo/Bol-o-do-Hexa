    const initial=suffix?suffix[0].toUpperCase():"";
    return initial?`${label} ${initial}.`:label;
  });
}
function chartNiceTicks(minVal,maxVal,targetCount){
  const range=Math.max(1,maxVal-minVal);
  const rough=range/Math.max(1,targetCount-1);
  const mag=Math.pow(10,Math.floor(Math.log10(rough)));
  const norm=rough/mag;
  let step;
  if(norm<1.5) step=1*mag;
  else if(norm<3) step=2*mag;
  else if(norm<7) step=5*mag;
  else step=10*mag;
  step=Math.max(1,Math.round(step));
  const start=Math.floor(minVal/step)*step;
  const end=Math.ceil(maxVal/step)*step;
  const ticks=[];
  for(let v=start;v<=end+1e-9;v+=step){
    if(v>=minVal-1e-9&&v<=maxVal+1e-9) ticks.push(Math.round(v));
  }
  if(!ticks.length) ticks.push(Math.round(minVal),Math.round(maxVal));
  return Array.from(new Set(ticks));
}
function chartIntegerTicks(minVal,maxVal,maxTicks){
  maxTicks=Math.max(4,maxTicks||12);
  const range=Math.max(1,maxVal-minVal);
  const candidates=[1,2,5,10,20,25,50,100,200,500];
  let step=candidates[candidates.length-1];
  for(const s of candidates){
    if(Math.floor(range/s)+1<=maxTicks){ step=s; break; }
  }
  const start=Math.floor(minVal/step)*step;
  const end=Math.ceil(maxVal/step)*step;
  const ticks=[];
  for(let v=start;v<=end+1e-9;v+=step){
    if(v>=minVal-1e-9&&v<=maxVal+1e-9) ticks.push(Math.round(v));
  }
  if(!ticks.length) ticks.push(Math.round(minVal),Math.round(maxVal));
  return Array.from(new Set(ticks));
}
const CHART_MONTH_NAMES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function chartFormatDateKey(key){
  if(!key) return "?";
  const parts=String(key).split("-");
  if(parts.length<3) return String(key);
  const d=parseInt(parts[2],10);
  const m=parseInt(parts[1],10);
  if(!Number.isFinite(d)||!Number.isFinite(m)) return String(key);
  const mn=CHART_MONTH_NAMES[m-1]||"?";
  return `${String(d).padStart(2,"0")}/${mn}`;
}
function chartDateKeyFromIso(iso){
  if(!iso) return null;
  const d=new Date(iso);
  if(isNaN(d.getTime())) return null;
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
// Escolhe ticks do eixo X a partir de índices candidatos (posições rotuladas),
// mantendo sempre o primeiro e o último.
function chartAxisIndexesFromCandidates(candidates,maxLabels){
  if(!candidates.length) return [];
  if(candidates.length<=maxLabels) return candidates.slice();
  const stride=Math.ceil(candidates.length/maxLabels);
  const out=[];
  for(let i=0;i<candidates.length;i+=stride) out.push(candidates[i]);
  if(out[out.length-1]!==candidates[candidates.length-1]) out.push(candidates[candidates.length-1]);
  return out;
}
function chartAxisIndexes(count,maxLabels){
  if(count<=0) return [];
  if(count===1) return [0];
  if(count<=maxLabels) return Array.from({length:count},(_,i)=>i);
  const stride=Math.ceil((count-1)/(maxLabels-1));
  const out=[];
  for(let i=0;i<count;i+=stride) out.push(i);
  if(out[out.length-1]!==count-1) out.push(count-1);
  return out;
}
function chartEndpointGroupLayout(items,lineHeight,groupGap,topBound,bottomBound,maxChars){
  if(!items.length) return [];
  const byValue=new Map();
  items.forEach(item=>{
    if(!byValue.has(item.value)) byValue.set(item.value,{value:item.value,trueY:item.y,members:[]});
    byValue.get(item.value).members.push(item);
  });
  const groups=Array.from(byValue.values()).sort((a,b)=>a.trueY-b.trueY);
  groups.forEach(group=>{
    const valueLen=` · ${group.value}`.length;
    const lines=[];
    let line=[],lineLen=0;
    group.members.forEach((member,i)=>{
      const tokenLen=member.name.length+(i===group.members.length-1?valueLen:2);
      if(line.length&&lineLen+tokenLen>maxChars){lines.push(line);line=[];lineLen=0;}
      line.push(member);
      lineLen+=tokenLen;
    });
    if(line.length) lines.push(line);
    group.lines=lines;
    group.height=(lines.length-1)*lineHeight;
    group.y=group.trueY-group.height/2;
  });
  for(let i=1;i<groups.length;i++){
    const minY=groups[i-1].y+groups[i-1].height+groupGap;
    if(groups[i].y<minY) groups[i].y=minY;
  }
  const last=groups[groups.length-1];
  if(last.y+last.height>bottomBound){
    let overflow=last.y+last.height-bottomBound;
    for(let i=groups.length-1;i>=0;i--){
      groups[i].y-=overflow;
      if(i===0) break;
      const gap=groups[i].y-(groups[i-1].y+groups[i-1].height);
      if(gap<groupGap) overflow=Math.max(0,groupGap-gap);
      else break;
    }
  }
  if(groups[0].y<topBound){
    let shift=topBound-groups[0].y;
    for(let i=0;i<groups.length;i++){
      groups[i].y+=shift;
      if(i===groups.length-1) break;
      const gap=groups[i+1].y-(groups[i].y+groups[i].height);
      if(gap<groupGap) shift=Math.max(0,groupGap-gap);
      else break;
    }
  }
  return groups;
}
function chartEndpointLabelsSvg(items,opts){
  const groups=chartEndpointGroupLayout(items,opts.lineHeight,opts.groupGap,opts.topBound,opts.bottomBound,opts.maxChars);
  return groups.map(group=>{
    const centerY=group.y+group.height/2;
    const connector=Math.abs(centerY-group.trueY)>2
      ?`<path d="M ${(opts.baseX+5).toFixed(2)} ${group.trueY.toFixed(2)} L ${(opts.baseX+10).toFixed(2)} ${centerY.toFixed(2)}" fill="none" stroke="${group.members[0].color}" stroke-width="1" opacity=".45"></path>`
      :"";
    const multi=group.members.length>1;
    let memberCount=0;
    const linesSvg=group.lines.map((line,li)=>{
      const y=group.y+li*opts.lineHeight;
      const isLastLine=li===group.lines.length-1;
      const spans=line.map(member=>{
        memberCount++;
        const sep=memberCount<group.members.length?`<tspan fill="#94a3b8" font-weight="800">, </tspan>`:"";
        // Nome clicável/hover quando o item traz o índice do participante
        // (gráfico do ranking); o do laboratório da API fica estático.
        const focusAttrs=member.i!=null?` class="chart-endpoint-name${member.focused?" is-focused":""}" data-series="${member.i}" onmouseenter="hoverRankingSeries(this,${member.i},true)" onmouseleave="hoverRankingSeries(this,${member.i},false)" onclick="focusRankingSeries(${member.i},event)"`:"";
        return `<tspan fill="${member.color}"${focusAttrs}>${esc(member.name)}</tspan>${sep}`;
      }).join("");
      const valueSpan=isLastLine?`<tspan fill="${multi?"#41516d":group.members[0].color}"> · ${group.value}</tspan>`:"";
      return `<text x="${(opts.baseX+13).toFixed(2)}" y="${(y+opts.dy).toFixed(2)}" font-size="${opts.fontSize}" font-weight="900">${spans}${valueSpan}</text>`;
    }).join("");
    return `<g class="chart-endpoint-label">${connector}${linesSvg}</g>`;
  }).join("");
}
function apiTestRankingTimeline(rows){
  const fixtures=apiTestFixturesBeforeCopa()
    .filter(fixture=>apiTestCanScoreFixture(fixture)&&apiTestFixtureHasAnyPrediction(fixture))
    .sort(compareApiTestFixtures);
  const dateMap=new Map();
  fixtures.forEach(fx=>{
    const key=chartDateKeyFromIso(fx.dateIso)||"";
    if(!key) return;
    if(!dateMap.has(key)) dateMap.set(key,[]);
    dateMap.get(key).push(fx);
  });
  const dateKeys=Array.from(dateMap.keys()).sort();
  const oneDay=86400000;
  const totals={};
  const series=rows.map((p,idx)=>{
    totals[p.i]=0;
    return {i:p.i,name:p.name,color:RANKING_SERIES_COLORS[idx%RANKING_SERIES_COLORS.length],values:[0]};
  });
  const positions=[];
  let liveCount=0,finalCount=0;
  if(dateKeys.length){
    const earliestMs=parseDateKey(dateKeys[0]).getTime();
    positions.push({ms:earliestMs-oneDay,label:"Início",state:"start"});
    dateKeys.forEach(k=>{
      const fxs=dateMap.get(k);
      let hasLive=false;
      fxs.forEach(fx=>{
        const isLive=!apiTestIsFinal(fx)&&apiTestIsActiveFixture(fx);
        if(isLive){liveCount++;hasLive=true;}
        else finalCount++;
      });
      positions.push({ms:parseDateKey(k).getTime(),label:chartFormatDateKey(k),state:hasLive?"live":"final",dateKey:k});
    });
  }else{
    positions.push({ms:Date.now(),label:"Início",state:"start"});
  }
  dateKeys.forEach(k=>{
    const fxs=dateMap.get(k);
    series.forEach(line=>{
      let dayGain=0;
      fxs.forEach(fixture=>{
        const prediction=apiTestPrediction(line.i,fixture.id);
        const info=apiTestScoreInfo(prediction,fixture);
        dayGain+=info?info.value:0;
      });
      totals[line.i]+=dayGain;
      line.values.push(totals[line.i]);
    });
  });
  const labels=positions.map(p=>p.label);
  const states=positions.map(p=>p.state);
  let xRel=positions.map(()=>0);
  if(positions.length>1){
    const startMs=positions[0].ms;
    const endMs=positions[positions.length-1].ms;
    const span=Math.max(oneDay,endMs-startMs);
    xRel=positions.map(p=>(p.ms-startMs)/span);
  }
  const allValues=series.flatMap(line=>line.values);
  const maxVal=Math.max(3,...allValues);
  const minVal=Math.min(0,...allValues);
  return {states,labels,xRel,series,maxVal,minVal,liveCount,finalCount,fixtureCount:fixtures.length,dateCount:dateKeys.length};
}

  el.dataset.val=String(to);
  if(!dur||from===to||filmeReduced()){el.textContent=to;return;}
  const t0=performance.now(); if(el._raf)cancelAnimationFrame(el._raf);
  const ease=p=>1-Math.pow(1-p,3);
  const step=now=>{const p=Math.min(1,(now-t0)/dur);el.textContent=Math.round(from+(to-from)*ease(p));if(p<1)el._raf=requestAnimationFrame(step);};
  el._raf=requestAnimationFrame(step);
}
function filmeAvailable(){return isOnlineMode()&&isAdmin();}
function filmeFrames(){
  const rows=ranking();
  const tl=rankingTimeline(rows);
  const count=tl.series.length?tl.series[0].values.length:0;
  const frames=[];
  let prevPos={},prevPts={};
  rows.forEach((r,idx)=>{prevPos[r.i]=idx;prevPts[r.i]=0;});
  for(let k=0;k<count;k++){
    const entries=tl.series.map(s=>({i:s.i,name:s.name,color:s.color,pts:s.values[k]}));
    // Desempate: pontos e, persistindo, quem já estava na frente segue na frente
    // (estabilidade visual; o desempate oficial por cravadas fica pro ranking).
    entries.sort((a,b)=>b.pts-a.pts||prevPos[a.i]-prevPos[b.i]||a.name.localeCompare(b.name));
    const pos={};
    entries.forEach((e,idx)=>{
      pos[e.i]=idx;
      e.pos=idx;
      e.delta=e.pts-(prevPts[e.i]||0);
      e.moved=idx-(prevPos[e.i]!=null?prevPos[e.i]:idx);
    });
    frames.push({entries,state:tl.states[k],event:tl.events[k]});
    prevPos=pos;
    prevPts={};
    entries.forEach(e=>{prevPts[e.i]=e.pts;});
  }
  return {frames,maxVal:Math.max(3,tl.maxVal),minVal:Math.min(0,tl.minVal),series:tl.series,states:tl.states};
}
// Geometria do gráfico do filme (compartilhada entre o desenho e o cursor).
const FILME_CHART={W:760,H:240,padX:42,padR:110,padY:12,padB:22};
function filmeChartY(data,v){
  const {H,padY,padB}=FILME_CHART;
  const uh=H-padY-padB;
  const range=Math.max(1,data.maxVal-data.minVal);
  return padY+uh-uh*((v-data.minVal)/range);
}
function filmeChartX(data,idx){
  const n=data.frames.length;
  return FILME_CHART.padX+(FILME_CHART.W-FILME_CHART.padX-FILME_CHART.padR)*(n>1?idx/(n-1):0);
}
// Desenha o gráfico de evolução completo uma única vez; a animação só move a
// janela de recorte (clip) e o cursor, revelando as linhas da esquerda pra direita.
function filmeChartSvg(data){
  const {W,H,padX,padR,padY,padB}=FILME_CHART;
  const uw=W-padX-padR,uh=H-padY-padB;
  const range=Math.max(1,data.maxVal-data.minVal);
  const xFor=i=>filmeChartX(data,i);
  const yFor=v=>padY+uh-uh*((v-data.minVal)/range);
  const ticks=chartIntegerTicks(data.minVal,data.maxVal,8);
  const grid=ticks.map(t=>`<g><line x1="${padX}" x2="${W-padR}" y1="${yFor(t).toFixed(1)}" y2="${yFor(t).toFixed(1)}" stroke="rgba(15,23,42,.08)"></line><text x="${padX-8}" y="${yFor(t).toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="11" fill="rgba(15,23,42,.55)">${t}</text></g>`).join("");
  const lines=data.series.map(s=>{
    const seg=rankingLinePathSegmentedFlex(s.values,data.states,xFor,yFor);
    return `${seg.solid?`<path d="${seg.solid}" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"></path><path d="${seg.solid}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".97"></path>`:""}
      ${seg.dashed?`<path class="filme-line-live" d="${seg.dashed}" fill="none" stroke="${s.color}" stroke-width="2" stroke-dasharray="7 6" stroke-linecap="round"></path>`:""}`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Evolução da pontuação até o lance atual">
    <defs><clipPath id="filmeChartClip"><rect id="filmeClipRect" x="0" y="0" width="${padX}" height="${H}"></rect></clipPath></defs>
    ${grid}
    <g clip-path="url(#filmeChartClip)">${lines}</g>
    <g id="filmeChartLabels"></g>
    <rect id="filmeCursorRect" x="${(padX-1).toFixed(1)}" y="${padY}" width="2" height="${uh}" rx="1" fill="rgba(0,39,118,.45)"></rect>
  </svg>`;
}
function filmeCaptionHtml(frame){
  if(frame.state==="start") return `<span>Início da Copa — todo mundo com 0 ponto</span>`;
  if(frame.state==="podio") return `<span>Pódio oficial somado</span>`;
  const ev=frame.event;
  if(!ev) return "";
  const f1=TEAM_FLAGS[ev.game.t1]||"",f2=TEAM_FLAGS[ev.game.t2]||"";
  const liveTag=frame.state==="live"?`<span class="filme-caption-live">ao vivo · parcial</span>`:"";
  return `<span>${f1} ${esc(ev.game.t1)} <strong>${ev.res.s1} x ${ev.res.s2}</strong> ${esc(ev.game.t2)} ${f2}
    <span class="filme-caption-date">${ev.game.date?formatGameDate(ev.game.date):""}</span></span>${liveTag}`;
}
function renderFilme(){

        oninput="filmeSeek(+this.value)" aria-label="Posição no histórico">

function filmeApplyFrame(data,idx,animate=true){
  const frame=data.frames[idx];
  if(!frame) return;
  filmeFrameIdx=idx;
  const rowH=30;
  // Durante o play o movimento dura o intervalo entre lances (fica contínuo em
  // qualquer velocidade, sem transição cortada no meio); num seek avulso usa um
  // passo curto fixo. O cursor do gráfico varre linear, como uma agulha.
  const stepMs=FILME_SPEED_MS[filmeSpeed]||900;
  const rm=filmeReduced();
  const moveMs=(!animate||rm)?0:filmePlaying?Math.round(stepMs*0.92):420;
  const sweepMs=(!animate||rm)?0:filmePlaying?stepMs:420;
  // Duração do fluxo ambiente reescrita por frame conforme a velocidade, pra um
  // clique em 4x retemporizar o brilho na hora, sem reiniciar nenhum timer.
  const card=document.getElementById("filmeCard");
  if(card) card.style.setProperty("--filme-flow-dur",(filmeSpeed>=4?"1s":filmeSpeed>=2?"1.25s":"1.5s"));
  frame.entries.forEach(e=>{
    const row=document.getElementById(`filmeRow-${e.i}`);
    if(!row) return;
    // Posição via propriedade `translate` (transição = deslize). O pop de
    // ultrapassagem anima `scale` na barra (independente), sem cortar o deslize.
    row.style.transition=moveMs?`translate ${moveMs}ms ${FILME_EASE}`:"none";
    row.style.translate=`0 ${e.pos*rowH}px`;
    const bar=document.getElementById(`filmeBar-${e.i}`);
    if(bar){
      bar.style.transition=moveMs?`width ${moveMs}ms ${FILME_EASE}`:"none";
      bar.style.width=`${Math.max(0.5,Math.max(0,e.pts)/data.maxVal*100)}%`;
    }
    if(animate&&!rm&&e.moved<0&&bar){
      row.classList.remove("filme-overtake");void row.offsetWidth;row.classList.add("filme-overtake");
      bar.addEventListener("animationend",()=>row.classList.remove("filme-overtake"),{once:true});
    }
    const posEl=document.getElementById(`filmePos-${e.i}`);
    if(posEl) posEl.textContent=`${e.pos+1}º`;
    const ptsEl=document.getElementById(`filmePts-${e.i}`);
    if(ptsEl) filmeRollNumber(ptsEl,e.pts,animate?moveMs:0);
    const deltaEl=document.getElementById(`filmeDelta-${e.i}`);
    if(deltaEl){
      deltaEl.textContent=e.delta?`${e.delta>0?"+":""}${e.delta}`:"";
      deltaEl.className=`filme-delta ${e.delta>0?"pos":e.delta<0?"neg":""}`;
      if(animate&&!rm&&e.delta){void deltaEl.offsetWidth;deltaEl.classList.add("show");}
    }
    const trendEl=document.getElementById(`filmeTrend-${e.i}`);
    if(trendEl){
      trendEl.textContent=e.moved<0?"▲":e.moved>0?"▼":"";
      trendEl.className=`filme-trend ${e.moved<0?"up":e.moved>0?"down":""}`;
      if(animate&&!rm&&e.moved){void trendEl.offsetWidth;trendEl.classList.add("show");}
    }
    // Fluxo ambiente em todas as barras (vivas mesmo paradas)
    row.classList.toggle("is-flowing",true);
  });
  const chartX=filmeChartX(data,idx);
  const clipRect=document.getElementById("filmeClipRect");
  const cursorRect=document.getElementById("filmeCursorRect");
  // Cursor anda no compositor via translateX (sem brigar atributo x vs CSS);
  // o clip continua revelando por width, com fallback de atributo no seek.
  const baseCursorX=FILME_CHART.padX-1;
  if(cursorRect){
    cursorRect.style.transition=sweepMs?`transform ${sweepMs}ms linear`:"none";
    cursorRect.style.transform=`translateX(${(chartX-1-baseCursorX).toFixed(1)}px)`;
  }
  if(clipRect){
    if(sweepMs){clipRect.style.transition=`width ${sweepMs}ms linear`;clipRect.style.width=`${chartX.toFixed(1)}px`;}
    else{clipRect.style.transition="none";clipRect.setAttribute("width",chartX.toFixed(1));clipRect.style.width=`${chartX.toFixed(1)}px`;}
  }
  const labelsEl=document.getElementById("filmeChartLabels");
  if(labelsEl){
    const uniq=chartUniqueLabels(data.series.map(s=>s.name));
    const items=data.series.map((s,si)=>({color:s.color,name:uniq[si],value:s.values[idx],y:filmeChartY(data,s.values[idx])}));
    labelsEl.innerHTML=chartEndpointLabelsSvg(items,{
      baseX:chartX,lineHeight:13,groupGap:14,
      topBound:FILME_CHART.padY+2,bottomBound:FILME_CHART.H-FILME_CHART.padB-2,
      maxChars:12,fontSize:11,dy:4
    });
  }
  const cap=document.getElementById("filmeCaption");
  if(cap) cap.innerHTML=filmeCaptionHtml(frame);
  const slider=document.getElementById("filmeSlider");
  if(slider&&+slider.value!==idx) slider.value=idx;
  const prog=document.getElementById("filmeProgress");
  if(prog) prog.textContent=`lance ${idx+1} de ${data.frames.length}`;
}
function filmeStop(){
  filmePlaying=false;
  if(filmeTimer){clearTimeout(filmeTimer);filmeTimer=null;}
  document.getElementById("filmeStage")?.classList.remove("is-playing");
  document.querySelector("#filmeCard .filme-chart")?.classList.remove("playing");
  const btn=document.getElementById("filmePlayBtn");
  if(btn) btn.textContent="▶ Assistir";
}
function filmeTogglePlay(){
  if(filmePlaying){filmeStop();return;}
  const data=filmeFrames();
  if(data.frames.length<2) return;
  if(filmeFrameIdx==null||filmeFrameIdx>=data.frames.length-1){
    filmeApplyFrame(data,0,false);
  }
  filmePlaying=true;
  document.getElementById("filmeStage")?.classList.add("is-playing");
  document.querySelector("#filmeCard .filme-chart")?.classList.add("playing");
  const btn=document.getElementById("filmePlayBtn");
  if(btn) btn.textContent="⏸ Pausar";
  const tick=()=>{
    if(!filmePlaying||activeTab!=="filme"){filmeStop();return;}
    if(filmeFrameIdx>=data.frames.length-1){filmeStop();return;}
    filmeApplyFrame(data,filmeFrameIdx+1,true);
    filmeTimer=setTimeout(tick,FILME_SPEED_MS[filmeSpeed]||900);
  };
  filmeTimer=setTimeout(tick,FILME_SPEED_MS[filmeSpeed]||900);
}
function filmeSetSpeed(s){
  filmeSpeed=FILME_SPEED_MS[s]?s:1;
  document.querySelectorAll(".filme-speed button").forEach(b=>{
    b.classList.toggle("active",b.textContent===`${filmeSpeed}x`);
  });
}
function filmeSeek(idx){
  filmeStop();
  filmeApplyFrame(filmeFrames(),idx,true);
}

function cinemaBuildData(){
  const rows=ranking();
  const tl=rankingTimeline(rows);
  const count=tl.series.length?tl.series[0].values.length:0;
  // Standings por lance, com o mesmo desempate estável do Histórico:
  // pontos e, persistindo, quem já estava na frente segue na frente.
  let prevPos={};
  rows.forEach((r,idx)=>{prevPos[r.i]=idx;});
  const frames=[];
  for(let k=0;k<count;k++){
    const entries=tl.series.map((s,si)=>({si,i:s.i,name:s.name,pts:s.values[k]}));
    entries.sort((a,b)=>b.pts-a.pts||prevPos[a.i]-prevPos[b.i]||a.name.localeCompare(b.name));
    const rank=new Array(tl.series.length);
    const pos={};
    entries.forEach((e,idx)=>{rank[e.si]=idx;pos[e.i]=idx;});
    frames.push({values:tl.series.map(s=>s.values[k]),rank,state:tl.states[k],caption:cinemaCaption(tl,k)});
    prevPos=pos;
  }
  // Maior salto num lance só (pra carta de estatística).
  const jump={name:null,delta:0,caption:""};
  tl.series.forEach(s=>{
    for(let k=1;k<s.values.length;k++){
      const d=s.values[k]-s.values[k-1];
      if(d>jump.delta){jump.delta=d;jump.name=s.name;jump.caption=cinemaCaption(tl,k).text;}
    }
  });
  const brl=v=>{try{return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}).format(v);}catch(e){return `R$ ${v}`;}};
  const byCrav=rows.slice().sort((a,b)=>b.crav-a.crav);
  const byInv=rows.slice().sort((a,b)=>b.inv-a.inv);
  const leader=rows[0]||null;
  const podium=rows.slice(0,3).map((r,idx)=>({name:r.name,pts:r.pts,crav:r.crav,prize:brl(prize(idx+1))}));
  const stats={
    resolved:tl.resolvedCount,liveGames:tl.liveGameCount,lances:Math.max(0,count-1),
    participants:tl.series.length,
    leader:leader?{name:leader.name,pts:leader.pts}:null,
    crav:byCrav[0]&&byCrav[0].crav>0?{name:byCrav[0].name,n:byCrav[0].crav}:null,
    inv:byInv[0]&&byInv[0].inv>0?{name:byInv[0].name,n:byInv[0].inv}:null,
    jump:jump.name?jump:null,
    leaderPrize:leader?brl(prize(1)):null
  };
  // Momentos do grupo no WhatsApp, garimpados do export do chat (janela
  // 11/06→18/07, 7.636 msgs; recontagem de 2026-07-19 — o export ainda não
  // tem a final). Cada card entra na corrida quando o cursor cruza a data.
  const WHATS_CARDS=[
    {on:"2026-06-11",icon:"🏁",title:"A Copa começou",stat:"7.636 msgs",sub:"38 dias de resenha sem freio"},
    {on:"2026-06-13",icon:"😏",title:"Nasce o “lá ele”",stat:"Luizin",sub:"o primeiro de 18"},
    {on:"2026-06-16",icon:"🥶",title:"Nasce a zika",stat:"Otávin → Barreto",sub:"“parabéns pela cravada” antes do apito"},
    {on:"2026-06-22",icon:"📢",title:"O dia do caos",stat:"440 msgs",sub:"458 K de risada · 28 palavrões"},
    {on:"2026-06-24",icon:"⚡",title:"Chuva de zika",stat:"20 num dia",sub:"congratulações zikadas em série"},
    {on:"2026-06-27",icon:"🦉",title:"Corujão: Barretin",stat:"135 msgs",sub:"entre meia-noite e seis da manhã"},
    {on:"2026-06-29",icon:"🃏",title:"Rei da figurinha: Chemito",stat:"45",sub:"nenhuma palavra necessária"},
    {on:"2026-07-05",icon:"🤬",title:"Boca de lixo: Otávin",stat:"94 palavrões",sub:"o dia da eliminação ajudou"},
    {on:"2026-07-17",icon:"😏",title:"Lá ele: Luizin",stat:"7 de 18",sub:"“LÁ ELE 1000 VEZES”"}
  ];
  const dayKeys=[];
  for(let k=0;k<count;k++){

    dayKeys.push(ev&&ev.game&&ev.game.date?String(ev.game.date).slice(0,10):(k>0?dayKeys[k-1]:""));
  }
  const whats=[];
  WHATS_CARDS.forEach(c=>{
    const k=dayKeys.findIndex(d=>d&&d>=c.on);

  // Rankings do grupo (cenas próprias antes do pódio) — mesmos números do chat.

    frames,steps,
    maxVal:Math.max(3,tl.maxVal),minVal:Math.min(0,tl.minVal),
    stats,podium,whats,chatBoards,durations,durationInFrames
  };

  const SOFT="rgba(233,244,255,.78)";
  const clamp01=v=>Math.max(0,Math.min(1,v));
  const lin=(f,a,b,c,d)=>interpolate(f,[a,b],[c,d],{extrapolateLeft:"clamp",extrapolateRight:"clamp"});
  const sceneFade=(f,dur)=>lin(f,0,12,0,1)*lin(f,dur-12,dur-2,1,0);

  const Bg=()=>h(AbsoluteFill,{style:{
    background:`radial-gradient(1100px 760px at 18% -8%, rgba(0,132,61,.38), transparent 60%),
      radial-gradient(900px 640px at 108% 108%, rgba(255,223,0,.15), transparent 55%),
      linear-gradient(160deg,#071c4d 0%,#002776 68%,#04122f 100%)`
  }});
  const Watermark=()=>h("div",{style:{position:"absolute",bottom:16,left:26,fontSize:14,letterSpacing:4,fontWeight:700,color:"rgba(255,255,255,.4)",fontFamily:FONT}},"BOLÃO DO HEXA · CINEMA");

  const Kicker=({children,style})=>h("div",{style:Object.assign({fontSize:20,letterSpacing:8,fontWeight:700,color:YELLOW,textTransform:"uppercase"},style)},children);

  // Cena 1: abertura
  const Intro=({data,dur})=>{
    const f=useCurrentFrame();
    const {fps}=useVideoConfig();
    const titleS=spring({frame:f-6,fps,config:{damping:13,stiffness:110,mass:.7}});
    const chips=[
      `${data.stats.resolved} jogos computados`,
      `${data.stats.lances} lances`,
      `${data.stats.participants} participantes`
    ];
    return h(AbsoluteFill,{style:{justifyContent:"center",alignItems:"center",fontFamily:FONT,opacity:sceneFade(f,dur)}},
      h(Kicker,{style:{fontSize:V?15:20,letterSpacing:V?5:8,opacity:lin(f,0,14,0,1),transform:`translateY(${lin(f,0,14,18,0)}px)`}},"Bolão do Hexa · Copa 2026"),
      h("div",{style:{fontSize:V?46:64,fontWeight:900,color:"#fff",lineHeight:1.08,margin:"20px 0 12px",textAlign:"center",maxWidth:W-2*MX,transform:`scale(${.72+.28*titleS})`,opacity:Math.min(1,titleS*1.3),textShadow:"0 20px 60px rgba(0,0,0,.5)"}},"SAUDADES DO QUE A GENTE NÃO VIVEU"),
      h("div",{style:{fontSize:V?18:24,color:SOFT,opacity:lin(f,20,34,0,1),textAlign:"center",maxWidth:W-2*MX}},"38 dias, 7.636 mensagens e 86 zikas depois"),
      h("div",{style:{display:"flex",flexWrap:"wrap",justifyContent:"center",maxWidth:W-2*MX,gap:V?10:16,marginTop:V?34:48}},
        chips.map((c,i)=>{
          const s=spring({frame:f-32-i*7,fps,config:{damping:14,stiffness:130}});
          return h("div",{key:i,style:{padding:V?"9px 18px":"12px 24px",borderRadius:999,border:"1px solid rgba(255,255,255,.28)",background:"rgba(255,255,255,.08)",color:"#fff",fontSize:V?16:21,fontWeight:600,opacity:Math.min(1,s*1.2),transform:`translateY(${(1-s)*26}px)`}},c);
        })
      )
    );
  };

  // Cena 2: corrida de barras (bar chart race contínuo entre lances)
  const Race=({data,dur})=>{
    const f=useCurrentFrame();
    const n=data.series.length;
    const steps=data.steps;
    const kFloat=steps<=0?0:lin(f,20,dur-40,0,steps);
    // Centro da janela de suavização SEM clamp à direita: na segurada final a
    // janela continua andando e o ranking assenta no resultado exato.
    const kc=steps<=0?0:interpolate(f,[20,dur-40],[0,steps],{extrapolateLeft:"clamp"});
    const k0=Math.min(steps,Math.floor(kFloat));
    const k1=Math.min(steps,k0+1);
    const t=clamp01(kFloat-k0);
    // smootherstep (C²): velocidade e aceleração zeram na troca de lance —
    // barras crescem e trocam de posição sem tranco.
    const smooth5=u=>u*u*u*(u*(u*6-15)+10);
    const te=smooth5(t);
    const fr0=data.frames[k0],fr1=data.frames[k1];
    const fpl=steps>0?(dur-60)/steps:dur; // quadros de vídeo por lance
    const sampleAt=(arr,si,kf)=>{
      const a=Math.min(steps,Math.max(0,Math.floor(kf)));
      const b=Math.min(steps,a+1);
      return data.frames[a][arr][si]+(data.frames[b][arr][si]-data.frames[a][arr][si])*smooth5(clamp01(kf-a));
    };
    // Subidas/descidas: numa Copa cheia cada lance dura 2-4 quadros e a
    // ultrapassagem viraria um pulo seco. A posição usa média ponderada numa
    // janela de ~14 quadros, então a troca desliza igual em qualquer densidade.
    const halfK=Math.max(0,(14/fpl-1)/2);
    const rankSm=si=>halfK<=0?sampleAt("rank",si,kFloat):
      (sampleAt("rank",si,kc-halfK)+4*sampleAt("rank",si,kc-halfK/2)+6*sampleAt("rank",si,kc)+4*sampleAt("rank",si,kc+halfK/2)+sampleAt("rank",si,kc+halfK))/16;
    const wAct=Math.max(.6,7/fpl);
    const range=Math.max(1,data.maxVal-data.minVal);
    // No retrato as barras ocupam a metade de cima; a de baixo é dos cards.
    const top=V?140:176;
    const rowsBottom=V?606:HGT-64;
    const rowH=Math.min(60,(rowsBottom-top)/n);
    const area=V?{x:186,w:W-186-84}:{x:318,w:W-318-158};
    const xFor=v=>area.x+area.w*((v-data.minVal)/range);
    const x0=xFor(0);
    // Legenda: em Copa cheia trocar a cada lance vira pisca-pisca ilegível —
    // mostra 1 jogo a cada ~24 quadros, com crossfade curto na troca.
    const capEvery=Math.max(1,Math.ceil(24/fpl));
    const capPos=steps>0?kFloat/capEvery:0;
    const capA=data.frames[Math.min(steps,Math.floor(capPos)*capEvery)].caption;
    const capB=data.frames[Math.min(steps,(Math.floor(capPos)+1)*capEvery)].caption;
    const cu=capPos-Math.floor(capPos);
    const atEnd=kFloat>=steps;
    const cap=atEnd?data.frames[steps].caption:(cu<.5?capA:capB);
    const capSwap=!atEnd&&capA.text!==capB.text;
    const capOp=capSwap?(cu<.5?lin(cu,.38,.5,1,0):lin(cu,.5,.62,0,1)):1;
    const capDy=capSwap?(cu<.5?lin(cu,.38,.5,0,-8):lin(cu,.5,.62,8,0)):0;
    // Feed do WhatsApp: os momentos do grupo entram em ordem cronológica
    // quando a corrida cruza a data de cada um. O card novo chega no slot de
    // cima, empurra os anteriores pra baixo e o mais velho sai por baixo.
    // Tudo determinístico por frame (posição = quantos cards chegaram depois).
    // Na paisagem a coluna mora no vão à direita e ainda cede quando uma barra
    // longa se aproxima; no retrato vive na metade de baixo, sem conflito.
    const cardW=V?W-2*MX:332,cardLeft=V?MX:W-64-cardW;
    const slotTops=V?[668,792,916,1040]:[196,308,420,532],slotH=V?108:96;
    const tipNear=(y1,y2)=>{
      let m=0;
      data.series.forEach((s,si)=>{
        const yy=top+rankSm(si)*rowH;
        if(yy+rowH>y1&&yy<y2)
          m=Math.max(m,xFor(fr0.values[si]+(fr1.values[si]-fr0.values[si])*te));
      });
      return m;
    };
    const whats=data.whats||[];
    const kToF=k=>steps>0?20+(dur-60)*(k/steps):20; // inverso do kFloat
    const SHIFT=14; // quadros da animação de empurrar a pilha
    const starts=[];let prevStart=-1e9;
    whats.forEach(c=>{const s=Math.max(kToF(c.k),prevStart+40);starts.push(s);prevStart=s;});
    const maxSlots=slotTops.length;
    const slotGapY=slotTops.length>1?slotTops[1]-slotTops[0]:112;
    const factCards=[];
    whats.forEach((c,i)=>{
      const s=starts[i];
      if(f<s) return;
      // Quantos cards chegaram depois deste (fração anima o empurrão).
      let slotFloat=0;
      for(let j=i+1;j<whats.length;j++){
        if(f>=starts[j]+SHIFT) slotFloat+=1;
        else if(f>=starts[j]) slotFloat+=smooth5((f-starts[j])/SHIFT);
      }
      if(slotFloat>maxSlots) return; // já saiu da pilha faz tempo
      const enter=lin(f,s,s+12,0,1);
      const exit=lin(slotFloat,maxSlots-1,maxSlots,1,0); // some ao ser empurrado pra fora
      const y=slotTops[0]+slotFloat*slotGapY;
      const op=(V?1:lin(tipNear(y-8,y+slotH+8),cardLeft-180,cardLeft-90,1,0))*enter*exit;
      if(op>.01) factCards.push({fact:c,top:y,op,dy:(1-enter)*10});
    });
    const medals=["🥇","🥈","🥉"];
    return h(AbsoluteFill,{style:{fontFamily:FONT,opacity:sceneFade(f,dur)}},
      h("div",{style:{position:"absolute",top:V?32:44,left:MX,right:MX}},
        h(Kicker,{style:{fontSize:V?13:16,letterSpacing:V?4:6}},"A corrida do ranking"),
        h("div",{style:{opacity:capOp,transform:`translateY(${capDy}px)`}},
          h("div",{style:{display:"flex",alignItems:"baseline",gap:V?10:18,marginTop:V?6:10}},
            h("div",{style:{fontSize:V?24:34,fontWeight:800,color:"#fff",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:V?W-2*MX:900}},cap.text||""),
            cap.tag?h("div",{style:{fontSize:V?12:15,fontWeight:800,color:"#ff6b64",letterSpacing:2,whiteSpace:"nowrap"}},cap.tag):null
          ),
          h("div",{style:{fontSize:V?13:17,color:SOFT,marginTop:4}},cap.date||" ")
        )
      ),
      data.series.map((s,si)=>{
        const v=fr0.values[si]+(fr1.values[si]-fr0.values[si])*te;
        const r=rankSm(si);
        // Brilho contínuo proporcional ao ritmo de pontuação na janela recente
        // (nada de piscar por lance: ~3 pts na janela = brilho máximo).
        const act=clamp01((sampleAt("values",si,kc+wAct)-sampleAt("values",si,kc-wAct))/3);
        const y=top+r*rowH;
        const xv=xFor(v);
        const left=Math.min(x0,xv),wpx=Math.max(3,Math.abs(xv-x0));
        const curRank=Math.round(r);
        const isLeader=curRank===0;
        return h("div",{key:si,style:{position:"absolute",left:0,top:y,width:W,height:rowH,display:"flex",alignItems:"center"}},
          h("div",{style:{position:"absolute",left:V?14:64,width:V?36:44,textAlign:"center",fontSize:isLeader?(V?21:26):(V?16:20),fontWeight:800,color:curRank<3?YELLOW:"rgba(255,255,255,.65)"}},curRank<3?medals[curRank]:String(curRank+1)),
          h("div",{style:{position:"absolute",left:V?52:114,width:V?126:190,textAlign:"right",fontSize:V?17:22,fontWeight:isLeader?800:600,color:isLeader?"#fff":SOFT,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},s.name),
          h("div",{style:{position:"absolute",left,top:(rowH-Math.max(14,rowH-22))/2,width:wpx,height:Math.max(14,rowH-22),borderRadius:9,background:`linear-gradient(90deg,${s.color},${s.color}cc)`,boxShadow:[isLeader?`0 0 26px ${s.color}88`:null,act>.02?`0 0 ${22*act}px ${s.color}aa`:null].filter(Boolean).join(", ")||"none"}}),
          h("div",{style:{position:"absolute",left:Math.min(Math.max(xv,x0)+(V?10:14),W-(V?66:120)),fontSize:V?17:22,fontWeight:800,fontVariantNumeric:"tabular-nums",color:"#fff",transform:`scale(${1+.25*act})`,transformOrigin:"left center",textShadow:act>.02?`0 0 ${14*act}px rgba(255,223,0,${(.85*act).toFixed(2)})`:"none"}},String(Math.round(v)))
        );
      }),
      factCards.length?h("div",{style:{position:"absolute",left:cardLeft,top:slotTops[0]-30,width:cardW,fontSize:12,letterSpacing:3,fontWeight:800,color:YELLOW,textTransform:"uppercase",opacity:Math.max(...factCards.map(c=>c.op))}},"Enquanto isso, no grupo"):null,
      factCards.map(c=>h("div",{key:c.fact.on+c.fact.title,style:{position:"absolute",left:cardLeft,top:c.top,width:cardW,boxSizing:"border-box",padding:V?"14px 20px":"12px 16px",borderRadius:14,background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.14)",opacity:c.op,transform:`translateY(${c.dy}px)`}},
        h("div",{style:{display:"flex",alignItems:"center",gap:V?14:11}},
          h("div",{style:{fontSize:V?30:24,lineHeight:1.1,flex:"none"}},c.fact.icon),
          h("div",{style:{minWidth:0,flex:1}},
            h("div",{style:{fontSize:V?12:10.5,letterSpacing:2,fontWeight:800,color:YELLOW,textTransform:"uppercase",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},c.fact.title),
            h("div",{style:{fontSize:V?22:18,fontWeight:800,color:"#fff",marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},c.fact.stat),
            c.fact.sub?h("div",{style:{fontSize:V?13:11.5,color:SOFT,marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},c.fact.sub):null
          )
        )
      )),
      h("div",{style:{position:"absolute",left:MX,right:MX,bottom:34,height:6,borderRadius:999,background:"rgba(255,255,255,.14)"}},
        h("div",{style:{width:`${steps?kFloat/steps*100:0}%`,height:"100%",borderRadius:999,background:`linear-gradient(90deg,${GREEN},${YELLOW})`}})
      ),
      h("div",{style:{position:"absolute",right:MX,bottom:52,fontSize:V?13:15,color:SOFT,fontVariantNumeric:"tabular-nums"}},`lance ${Math.min(steps,Math.round(kFloat))}/${steps}`)
    );
  };

  // Cena 3: gráfico de evolução se desenhando da esquerda pra direita
  const Chart=({data,dur})=>{
    const f=useCurrentFrame();
    const {fps}=useVideoConfig();
    const count=data.frames.length;
    // Retrato: rótulos de nome continuam à direita, só que mais juntos.
    const pad=V?{l:52,r:168,t:150,b:150}:{l:84,r:250,t:150,b:80};
    const uw=W-pad.l-pad.r,uh=HGT-pad.t-pad.b;
    const range=Math.max(1,data.maxVal-data.minVal);
    const X=i=>pad.l+uw*(count>1?i/(count-1):0);
    const Y=v=>pad.t+uh-uh*((v-data.minVal)/range);
    const reveal=interpolate(f,[12,dur-80],[0,1],{extrapolateLeft:"clamp",extrapolateRight:"clamp",easing:Easing.inOut(Easing.cubic)});
    const clipW=pad.l+uw*reveal+4;
    const tickStep=Math.max(1,Math.round(range/5));
    const ticks=[];
    for(let v=Math.ceil(data.minVal/tickStep)*tickStep;v<=data.maxVal;v+=tickStep) ticks.push(v);
    // Rótulos finais sem sobreposição (empurra 26px quando colide).
    const labels=data.series.map((s,si)=>({name:s.name,color:s.color,v:data.frames[count-1].values[si],y:Y(data.frames[count-1].values[si])}))
      .sort((a,b)=>a.y-b.y);
    const labGap=V?22:26;
    for(let i=1;i<labels.length;i++) if(labels[i].y<labels[i-1].y+labGap) labels[i].y=labels[i-1].y+labGap;
    // A cadeia de empurrões pode passar do fundo do quadro (ex.: todo mundo
    // empatado perto do mínimo). Prende o último e comprime a pilha de volta.
    if(labels.length){
      const labMaxY=HGT-16;
      if(labels[labels.length-1].y>labMaxY) labels[labels.length-1].y=labMaxY;
      for(let i=labels.length-2;i>=0;i--) if(labels[i].y>labels[i+1].y-labGap) labels[i].y=labels[i+1].y-labGap;
    }
    const labelS=spring({frame:f-(dur-76),fps,config:{damping:15,stiffness:120}});
    return h(AbsoluteFill,{style:{fontFamily:FONT,opacity:sceneFade(f,dur)}},
      h("div",{style:{position:"absolute",top:V?32:44,left:MX,right:MX}},
        h(Kicker,{style:{fontSize:V?13:16,letterSpacing:V?4:6}},"A evolução"),
        h("div",{style:{fontSize:V?21:34,fontWeight:800,color:"#fff",marginTop:V?6:10}},"Ponto a ponto, do apito inicial até agora")
      ),
      h("svg",{width:W,height:HGT,viewBox:`0 0 ${W} ${HGT}`,style:{position:"absolute",inset:0}},
        h("defs",null,h("clipPath",{id:"cinemaChartClip"},h("rect",{x:0,y:0,width:clipW,height:HGT}))),
        ticks.map((v,i)=>h("g",{key:i},
          h("line",{x1:pad.l,x2:W-pad.r,y1:Y(v),y2:Y(v),stroke:"rgba(255,255,255,.12)"}),
          h("text",{x:pad.l-12,y:Y(v),textAnchor:"end",dominantBaseline:"middle",fontSize:V?13:15,fill:SOFT},String(v))
        )),
        h("g",{clipPath:"url(#cinemaChartClip)"},
          data.series.map((s,si)=>h("polyline",{key:si,
            points:data.frames.map((fr,k)=>`${X(k).toFixed(1)},${Y(fr.values[si]).toFixed(1)}`).join(" "),
            fill:"none",stroke:s.color,strokeWidth:3.5,strokeLinecap:"round",strokeLinejoin:"round",
            style:{filter:`drop-shadow(0 0 8px ${s.color}55)`}
          }))
        ),
        reveal<1?h("line",{x1:clipW,x2:clipW,y1:pad.t-8,y2:HGT-pad.b+8,stroke:YELLOW,strokeWidth:2,opacity:.8}):null,
        labels.map((l,i)=>h("g",{key:i,opacity:Math.min(1,labelS*1.2),transform:`translate(${(1-labelS)*24},0)`},
          h("circle",{cx:W-pad.r+(V?10:16),cy:l.y,r:V?5:6,fill:l.color}),
          h("text",{x:W-pad.r+(V?22:30),y:l.y,dominantBaseline:"middle",fontSize:V?15:18,fontWeight:700,fill:"#fff"},`${l.name} · ${l.v}`)
        ))
      )
    );
  };

  // Cena 4: cartas de estatística
  const Stats=({data,dur})=>{
    const f=useCurrentFrame();
    const {fps}=useVideoConfig();
    const st=data.stats;
    const cards=[
      st.leader?{icon:"👑",label:"Líder",value:st.leader.name,sub:`${st.leader.pts} pts`}:null,
      st.crav?{icon:"🎯",label:"Rei da cravada",value:st.crav.name,sub:`${st.crav.n} placares exatos`}:null,
      st.jump?{icon:"🚀",label:"Maior salto",value:st.jump.name,sub:`+${st.jump.delta} pts em ${st.jump.caption}`}:null,
      st.inv?{icon:"🙃",label:"Mais invertidas",value:st.inv.name,sub:`${st.inv.n} placares invertidos`}:null,
      {icon:"⚽",label:"Copa até aqui",value:`${st.resolved} jogos`,sub:`${st.lances} lances registrados${st.liveGames?` · ${st.liveGames} ao vivo`:""}`},
      st.leaderPrize?{icon:"💰",label:"Prêmio do líder",value:st.leaderPrize,sub:"se a Copa acabasse agora"}:null
    ].filter(Boolean);
    return h(AbsoluteFill,{style:{fontFamily:FONT,opacity:sceneFade(f,dur)}},
      h("div",{style:{position:"absolute",top:V?32:44,left:MX}},
        h(Kicker,{style:{fontSize:V?13:16,letterSpacing:V?4:6}},"Os números"),
        h("div",{style:{fontSize:V?24:34,fontWeight:800,color:"#fff",marginTop:V?6:10}},"Estatísticas do bolão")
      ),
      h("div",{style:Object.assign({position:"absolute",top:V?126:160,left:MX,right:MX,display:"flex",flexWrap:"wrap",gap:V?14:22,justifyContent:"center"},V?{bottom:56,alignContent:"center"}:null)},
        cards.map((c,i)=>{
          const s=spring({frame:f-14-i*7,fps,config:{damping:14,stiffness:120}});
          // Retrato: cartas em coluna única, mais baixas, com ícone ao lado.
          return h("div",{key:i,style:{width:V?"100%":356,minHeight:V?0:196,boxSizing:"border-box",borderRadius:20,padding:V?"16px 20px":"24px 26px",background:"rgba(255,255,255,.07)",border:"1px solid rgba(255,255,255,.18)",opacity:Math.min(1,s*1.2),transform:`translateY(${(1-s)*40}px) scale(${.92+.08*s})`,display:V?"flex":"block",alignItems:"center",gap:V?16:0}},
            h("div",{style:{fontSize:V?32:38,flex:"none"}},c.icon),
            h("div",{style:V?{minWidth:0}:null},
              h("div",{style:{fontSize:V?12:15,letterSpacing:3,fontWeight:800,color:YELLOW,textTransform:"uppercase",margin:V?"0 0 3px":"10px 0 6px"}},c.label),
              h("div",{style:{fontSize:V?22:30,fontWeight:800,color:"#fff",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},c.value),
              h("div",{style:{fontSize:V?14:16,color:SOFT,marginTop:V?3:6,lineHeight:1.35}},c.sub)
            )
          );
        })
      )
    );
  };

  // Cenas do WhatsApp: ranking completo de uma categoria do grupo (Altruísta,
  // Zika). Barras horizontais com spring por linha; boards "twin" ganham uma
  // segunda barra (foi zicado) e um punch line no rodapé.
  const Board=({board,dur})=>{
    const f=useCurrentFrame();
    const {fps}=useVideoConfig();
    const rows=board.rows||[];
    const twin=!!board.twin;
    const maxV=Math.max(1,...rows.map(r=>Math.max(r[1],r[2]||0)));
    const topY=V?216:196;
    const botY=board.punch?(V?HGT-190:HGT-130):(V?HGT-110:HGT-70);
    const rowH=rows.length?Math.min(V?120:60,(botY-topY)/rows.length):0;
    const nameW=V?128:150;
    const x0=(V?MX:W/2-330)+nameW+14;
    const barMax=(V?W-MX:W/2+330)-x0-64;
    const barH1=twin?(V?18:14):(V?24:20),barH2=V?12:9;
    return h(AbsoluteFill,{style:{fontFamily:FONT,opacity:sceneFade(f,dur)}},
      h("div",{style:{position:"absolute",top:V?40:44,left:0,width:"100%",textAlign:"center"}},
        h(Kicker,{style:{fontSize:V?13:16,letterSpacing:V?4:6,opacity:lin(f,0,12,0,1)}},board.kicker),
        h("div",{style:{fontSize:V?32:40,fontWeight:900,color:"#fff",marginTop:8,opacity:lin(f,4,16,0,1)}},board.title),
        h("div",{style:{fontSize:V?14:17,color:SOFT,marginTop:6,opacity:lin(f,8,20,0,1)}},
          board.sub,
          twin?h("span",null," — ",
            h("span",{style:{color:YELLOW,fontWeight:700}},"■ "+board.twin[0]),
            "  ",
            h("span",{style:{color:"#ff6b64",fontWeight:700}},"■ "+board.twin[1])
          ):null
        )
      ),
      rows.map((r,i)=>{

function cinemaLoadModules(){

    cinemaLoadPromise=Promise.all([
      import("react"),import("react-dom/client"),import("remotion"),import("@remotion/player")
    ]).then(([React,ReactDOMClient,Remotion,PlayerMod])=>{
      cinemaModules={React,ReactDOMClient,Remotion,PlayerMod,Comp:null};
      return cinemaModules;
    }).catch(err=>{cinemaLoadPromise=null;throw err;});
  }
  return cinemaLoadPromise;
}

  if(!mods.comps[orient]) mods.comps[orient]=cinemaMakeComposition(mods.React,mods.Remotion,orient);
  return mods.comps[orient];

function cinemaDims(orient){return orient==="v"?{w:720,h:1280}:{w:1280,h:720};}

async function cinemaEnsurePlayer(){
  let mods;
  try{
    mods=await cinemaLoadModules();
  }catch(err){
    console.error("Cinema: falha ao carregar Remotion",err);
    const mount=document.getElementById("cinemaMount");
    if(mount) mount.innerHTML=`<div class="cinema-loading cinema-error"><span>Não deu pra carregar o Remotion pelo CDN. Confere a conexão e tenta de novo.</span><button class="action-btn" onclick="cinemaRetry()">Tentar de novo</button></div>`;
    return;
  }
  if(activeTab!=="cinema"||!cinemaAvailable()) return; // saiu da aba enquanto baixava
  const mount=document.getElementById("cinemaMount");
  if(!mount) return;
  const data=cinemaBuildData();
  if(data.steps<1){
    cinemaTeardownRootOnly();
    mount.innerHTML=`<div class="cinema-loading"><span>🎬 Ainda não tem lance registrado.<br>Assim que sair placar, o filme estreia aqui.</span></div>`;
    return;
  }
  // Recarregar dados (realtime etc.) só re-renderiza se algo mudou, pra não
  // resetar a reprodução à toa.
  const last=data.frames[data.frames.length-1];
  const sig=JSON.stringify([data.frames.length,last.values,data.stats.liveGames,cinemaOrient]);
  if(cinemaRoot&&sig===cinemaDataSig) return;
  cinemaDataSig=sig;
  if(!cinemaRoot){
    mount.innerHTML="";
    cinemaRoot=mods.ReactDOMClient.createRoot(mount);
  }
  cinemaRoot.render(cinemaPlayerElement(mods,data));
}
function cinemaTeardownRootOnly(){

}

function cinemaDownloadCancel(){if(cinemaDlAbort) cinemaDlAbort.aborted=true;}

// timers a 1 disparo/minuto (intensive throttling) e a exportação viraria
// lesma. postMessage de MessageChannel não sofre throttle.
function cinemaNextTick(){
  return new Promise(r=>{
    const ch=new MessageChannel();
    ch.port1.onmessage=()=>{ch.port1.close();r();};
    ch.port2.postMessage(0);
  });
}
// Exporta o trailer em MP4 (H.264) direto no navegador: renderiza quadro a
// quadro via <Thumbnail> do Remotion, rasteriza o DOM (modern-screenshot —
// html-to-image trava no decode de SVG+foreignObject no Chrome) e codifica
// com WebCodecs + mp4-muxer. Sem backend — GitHub Pages segue estático.
// maxFrames serve pra QA (render curto via console).
async function cinemaDownloadVideo(maxFrames){
  if(cinemaDlAbort) return; // já tem exportação rolando
  // Arma o guard e trava o botão ANTES de qualquer await — dois cliques
  // rápidos não podem abrir duas exportações.
  const abort={aborted:false};
  cinemaDlAbort=abort;
  const btn=document.getElementById("cinemaDlBtn");
  if(btn) btn.disabled=true;
  const bail=msg=>{cinemaDlStatus(msg);cinemaDlAbort=null;if(btn) btn.disabled=false;};
  if(!window.VideoEncoder||typeof VideoFrame==="undefined"){
    bail(`<span>Esse navegador não exporta vídeo (sem WebCodecs). Usa Chrome, Edge ou Safari 17+.</span>`);
    return;
  }
  const FPS=30;
  // Captura a orientação AGORA: o toggle segue clicável durante a exportação
  // (só troca o preview) e não pode mudar dimensões, componente nem filename.
  const orient=cinemaOrient;
  const dims=cinemaDims(orient);
  const CW=dims.w,CH=dims.h;
  let mods,data,mux,shot,flushSync;
  try{
    mods=await cinemaLoadModules();
    data=cinemaBuildData();
    if(data.steps<1){bail("<span>Ainda não tem lance registrado pra virar filme.</span>");return;}
    const extra=await Promise.all([import("mp4-muxer"),import("modern-screenshot"),import("react-dom")]);
    mux=extra[0];shot=extra[1];flushSync=extra[2].flushSync;
  }catch(err){
    console.error("Cinema: falha ao preparar exportação",err);
    bail("<span>Não deu pra carregar os módulos de exportação pelo CDN. Tenta de novo.</span>");
    return;
  }
  // H.264: tenta High → Main → Baseline; o primeiro que o navegador aceitar.
  let cfg=null;
  for(const codec of ["avc1.640028","avc1.4d0028","avc1.42E01F"]){
    const c={codec,width:CW,height:CH,bitrate:8_000_000,framerate:FPS};
    try{if((await VideoEncoder.isConfigSupported(c)).supported){cfg=c;break;}}catch(e){}
  }
  if(!cfg){bail("<span>Esse navegador não codifica H.264. Usa Chrome ou Edge.</span>");return;}
  const total=Math.min(data.durationInFrames,maxFrames||data.durationInFrames);
  try{if(mods.playerRef&&mods.playerRef.current) mods.playerRef.current.pause();}catch(e){}
  // Palco oculto onde cada quadro é montado estaticamente.
  const stage=document.createElement("div");
  stage.style.cssText=`position:fixed;left:-10000px;top:0;width:${CW}px;height:${CH}px;pointer-events:none;background:#04122f;`;
  document.body.appendChild(stage);
  const {React,ReactDOMClient,PlayerMod}=mods;
  const Comp=cinemaCompForOrient(mods,orient);
  const root=ReactDOMClient.createRoot(stage);
  const muxer=new mux.Muxer({target:new mux.ArrayBufferTarget(),video:{codec:"avc",width:CW,height:CH},fastStart:"in-memory"});
  let encErr=null;
  const encoder=new VideoEncoder({
    output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),
    error:e=>{encErr=e;abort.aborted=true;}
  });
  encoder.configure(cfg);
  const t0=performance.now();
  try{
    for(let f=0;f<total;f++){
      if(abort.aborted) throw new Error("cancelado");
      flushSync(()=>root.render(React.createElement(PlayerMod.Thumbnail,{
        component:Comp,inputProps:{data},frameToDisplay:f,
        durationInFrames:data.durationInFrames,fps:FPS,
        compositionWidth:CW,compositionHeight:CH,
        style:{width:CW,height:CH}
      })));
      const canvas=await shot.domToCanvas(stage,{width:CW,height:CH,scale:1,font:false,backgroundColor:"#04122f"});
      const vf=new VideoFrame(canvas,{timestamp:Math.round(f*1e6/FPS),duration:Math.round(1e6/FPS)});
      // encode() lança se o encoder morreu no meio do await acima — o frame
      // fecha de qualquer jeito, senão fica segurando mídia até o GC.
      try{encoder.encode(vf,{keyFrame:f%(FPS*5)===0});}finally{vf.close();}
      // Não deixa a fila do encoder inchar nem a aba congelar.
      while(encoder.encodeQueueSize>6&&!abort.aborted) await cinemaNextTick();
      if(f%10===0||f===total-1){
        const pct=Math.round((f+1)/total*100);
        const eta=f>10?Math.round((performance.now()-t0)/(f+1)*(total-f-1)/1000):null;
        cinemaDlStatus(`<span>Renderizando ${pct}%${eta!=null?` · ~${eta>=60?`${Math.ceil(eta/60)} min`:`${eta}s`}`:""}</span><span class="bar"><span style="width:${pct}%"></span></span><button class="action-btn secondary" onclick="cinemaDownloadCancel()">Cancelar</button>`);
        // cinemaNextTick, não rAF nem setTimeout: em aba oculta o rAF nunca
        // dispara e o setTimeout é clampado a 1/min pelo Chrome.
        await cinemaNextTick();
      }
    }
    // Some com o botão Cancelar antes do flush: cancelar aqui não teria efeito.
    cinemaDlStatus("<span>Finalizando o arquivo…</span>");
    await encoder.flush();
    muxer.finalize();
    const blob=new Blob([muxer.target.buffer],{type:"video/mp4"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`bolao-filme-${orient==="v"?"stories":"widescreen"}.mp4`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),30000);
    cinemaDlStatus(`<span>✅ MP4 pronto (${(blob.size/1e6).toFixed(1)} MB, ${CW}×${CH}). Já dá pra soltar no grupo.</span>`);
  }catch(err){
    if(encErr) console.error("Cinema: erro do encoder",encErr);
    if(String(err&&err.message)==="cancelado"&&!encErr){
      cinemaDlStatus("<span>Exportação cancelada.</span>");
    }else{
      console.error("Cinema: exportação falhou",err);
      cinemaDlStatus("<span>Exportação falhou no meio do caminho. Abre o console e me chama.</span>");
    }
  }finally{
    cinemaDlAbort=null;
    // Reobtém pelo id: se o shell foi recriado (troca de aba), o `btn`
    // capturado é um nó órfão e o botão real ficaria travado.
    const liveBtn=document.getElementById("cinemaDlBtn")||btn;
    if(liveBtn) liveBtn.disabled=false;
    try{encoder.close();}catch(e){}
    try{root.unmount();}catch(e){}
    stage.remove();
  }
}

    // Exportação em curso (ou recém-terminada) sobrevive à troca de aba:

function goTab(t){
  if(t==="api-test") t="home";
  // Pódio foi integrado à página de Palpites como um estágio adicional
  if(t==="podio"){palStage="podio";t="palpites";}
  // Chaveamento do mata-mata vive na página de Palpites, estágio "ko"
  if(t==="chaveamento"){palStage="ko";t="palpites";}
  // No Brasileirão os palpites moram na aba Jogos — não há aba Palpites separada.
  if(isBrasileirao()&&t==="palpites") t="jogos";
  if(t==="filme"&&!filmeAvailable()) t="home";
  if(t==="cinema"&&!cinemaAvailable()) t="home";
  const tabs=["home","ranking","grupos","jogos","palpites","config","filme","cinema"];
  if(!tabs.includes(t)) t="home";
  document.querySelectorAll(".tab").forEach(el=>el.classList.remove("active"));
  const nav=document.getElementById("nav");
  if(nav) nav.querySelectorAll("button").forEach(el=>el.classList.remove("active"));
  document.getElementById(`tab-${t}`).classList.add("active");
  const activeNavButton=nav&&nav.querySelector('[data-tab="'+t+'"]');
  if(activeNavButton) activeNavButton.classList.add("active");
  // Cada nova entrada na Tabela V2 começa na classificação ao vivo. Re​renders
  // de polling/Re​altime preservam a escolha enquanto a pessoa permanece na aba.
  if(isBrasileirao()&&t==="grupos"&&activeTab!=="grupos") brTabelaV2Mode="oficial";
  activeTab=t;
  render(t);
  // Toda aba abre no topo ao trocar de página: sem isso, a posição de rolagem
  // da aba anterior "vaza" pra nova (a página rola no window e o display:none/
  // block das .tab não zera o scroll). A única exceção é Jogos, que logo abaixo
  // pula pro dia atual via copaAutoScrollToCurrent quando ele está mais embaixo.
  window.scrollTo(0,0);
  if(t==="jogos") copaAutoScrollToCurrent();
  syncApiTestClockTimer();
  syncApiTestRealtimeSubscription();
}

function applyCompChrome(){
  const br=isBrasileirao();
  document.body.classList.toggle("br-mode",br);
  document.documentElement.classList.toggle("br-mode",br);
  const themeColor=document.getElementById("themeColor");
  if(themeColor) themeColor.content=br?"#070d09":"#f8fbf1";
  const hero=document.querySelector(".hero");
  if(hero){
    hero.classList.toggle("is-brasileirao",br);
    if(br) hero.classList.remove("is-brazil-eliminated","is-brazil-norway-victory","is-brazil-japan-victory");
  }
  const kicker=document.querySelector("header .brand-kicker");
  const h1=document.querySelector("header h1");
  if(kicker) kicker.textContent=br?"Returno 2026":"Em busca do hexa";
  if(h1) h1.textContent=br?"Bolão do Brasileirão":"Bolão da Copa 2026";
  const nav=document.getElementById("nav");
  if(nav){
    const byTab=tab=>nav.querySelector('[data-tab="'+tab+'"]');
    const gruposBtn=byTab("grupos");
    if(gruposBtn) gruposBtn.textContent=br?"Tabela":"Grupos";
    // No returno, os quatro destinos principais acompanham a jornada real:
    // consultar jogos, conferir o ranking e então abrir a classificação.
    const order=br
      ? ["home","jogos","ranking","grupos","palpites","config","filme","cinema"]
      : ["home","ranking","grupos","jogos","palpites","config","filme","cinema"];
    order.forEach(tab=>{ const button=byTab(tab); if(button) nav.appendChild(button); });
    // Palpites já está dentro de Jogos; Config fica visível para acesso direto.
    const palpitesBtn=byTab("palpites"); if(palpitesBtn) palpitesBtn.hidden=br;
    const configBtn=byTab("config"); if(configBtn) configBtn.hidden=false;
  }
  if(br){
    const f=document.getElementById("navFilmeBtn"); if(f) f.hidden=true;
    const c=document.getElementById("navCinemaBtn"); if(c) c.hidden=true;
  }
  document.querySelectorAll(".comp-toggle button").forEach(b=>{
    b.classList.toggle("active",b.dataset.comp===ACTIVE_COMP);
  });
}

  if(BR_TEAM_ALIASES[compact]) return BR_TEAM_ALIASES[compact];
  const cleaned=raw.replace(/\b(SAF|SAD|FBC|FC|EC|SC|AC|CR|SE|SA|PA|SP|PR|MG|RJ|BA|RS|CE)\b\.?/gi,"").replace(/\s*[-/]\s*(PA|SP|PR|MG|RJ|BA|RS|CE)\b/gi,"").replace(/\s+/g," ").trim();

  if(cc.includes("chapecoense")) return "Chapecoense";
  if(cc.includes("corinthians")) return "Corinthians";

   trava no banco já é pelo horário do jogo, não pela rodada). Ela é exibida junto da
   rodada do returno que estiver rolando na data (slot), com etiqueta "adiado". A
   Tabela também conta os adiados: eles não estão na base BR_BASE (que só tem os
   jogos encerrados antes da rodada 19), então somam por cima sem duplicar. */
function brBolaoFixtures(){ return S_BR.fixtures.filter(f=>f.round==null||f.round>=BR_FIRST_ROUND||f.late); }
function brLateFixtures(){ return S_BR.fixtures.filter(f=>f.late); }
function brTagLateFixtures(fixtures){
  const returno=fixtures.filter(f=>f.round!=null&&f.round>=BR_FIRST_ROUND&&f.ts);
  const startTs=returno.length?Math.min(...returno.map(f=>f.ts)):null;
  const roundStart={};
  returno.forEach(f=>{ if(roundStart[f.round]==null||f.ts<roundStart[f.round]) roundStart[f.round]=f.ts; });
  const rounds=Object.keys(roundStart).map(Number).sort((a,b)=>a-b);
  fixtures.forEach(f=>{
    f.late=Boolean(startTs!=null&&f.round!=null&&f.round<BR_FIRST_ROUND&&f.ts&&f.ts>=startTs);
    if(!f.late){ f.slot=f.round; return; }
    let slot=BR_FIRST_ROUND;
    rounds.forEach(r=>{ if(roundStart[r]<=f.ts) slot=r; });
    f.slot=slot;
  });
}
function brFixtureScore(fx){
  const res=S_BR.results[fx.id];
  if(res&&res.s1!=null) return {s1:res.s1,s2:res.s2,final:true,live:false};
  const lv=fx.live;
  if(lv&&lv.goals_home!=null&&lv.goals_away!=null){
    const status=String(lv.status_short||"").trim().toUpperCase();
    if(BR_FINAL_STATUSES.has(status)) return {s1:lv.goals_home,s2:lv.goals_away,final:true,live:false};
    if(BR_LIVE_STATUSES.has(status)) return {s1:lv.goals_home,s2:lv.goals_away,final:false,live:true,elapsed:lv.elapsed};
  }
  const historical=brHistoricalResultFor(fx);
  if(historical) return {s1:historical.s1,s2:historical.s2,final:true,live:false};
  return null;
}

async function brLoadRemote(opts={}){
  if(!remoteClient||!remoteSession){ brSetStatus("warn","Entre no bolão para ver o Brasileirão."); return; }
  const [mapRows,liveRows,predRows,resRows,favoriteRow]=await Promise.all([
    remoteClient.from("api_fixture_map").select("game_id,api_fixture_id,kickoff_utc,home_team,away_team,round_label").eq("tournament",BR_TOURNAMENT).order("kickoff_utc",{ascending:true}),
    remoteClient.from("live_scores").select("game_id,status_short,elapsed,goals_home,goals_away,is_locked_by_admin,last_synced_at"),
    remoteClient.from("brasileirao_predictions").select("participant_index,game_id,s1,s2"),
    remoteClient.from("results").select("game_id,s1,s2"),
    remoteClient.from(BR_FAVORITE_TABLE).select("team_key").eq("user_id",remoteSession.user.id).eq("competition",BR_TOURNAMENT).maybeSingle()
  ]);
  // A classificação ao vivo continua disponível mesmo se apenas a consulta de
  // palpites falhar. Nesse caso, a V2 desabilita a projeção sem bloquear a tabela.
  const failed=[mapRows,liveRows,resRows].find(r=>r&&r.error);
  if(failed){ brSetStatus("err",remoteErrorText(failed.error)); if(!opts.skipRender) render(activeTab); return; }
  brProjectionError=predRows&&predRows.error?remoteErrorText(predRows.error):null;
  const remoteFavorite=brIsSupportedFavoriteTeam(favoriteRow?.data?.team_key)?favoriteRow.data.team_key:"";
  brFavoriteTeam=remoteFavorite||brReadLocalFavoriteTeam();
  if(remoteFavorite) brWriteLocalFavoriteTeam(remoteFavorite);
  const liveBy=Object.fromEntries((liveRows.data||[]).map(r=>[r.game_id,r]));
  S_BR.fixtures=(mapRows.data||[]).map(row=>{
    const p=brDateParts(row.kickoff_utc);
    return {id:row.game_id,t1:brCanonicalTeam(row.home_team),t2:brCanonicalTeam(row.away_team),utc:row.kickoff_utc,date:p.date,time:p.time,dshort:p.short,dateKey:p.key,ts:p.ts,roundLabel:row.round_label||"",round:brRoundNum(row.round_label),live:liveBy[row.game_id]||null};
  }).sort((a,b)=>(a.ts-b.ts)||String(a.id).localeCompare(b.id));
  brTagLateFixtures(S_BR.fixtures);
  if(!brProjectionError) S_BR.palpites=Object.fromEntries((predRows.data||[]).map(r=>[brPredKey(r.participant_index,r.game_id),{s1:r.s1,s2:r.s2}]));
  S_BR.results=Object.fromEntries((resRows.data||[]).map(r=>[r.game_id,{s1:r.s1,s2:r.s2}]));
  applyBrLiveRows(liveRows.data||[]);
  S_BR.loaded=true;
  const n=brBolaoFixtures().length, lateN=brLateFixtures().length;
  brSetStatus(n?(brProjectionError?"warn":"ok"):"warn", n?(n+" jogos valendo no bolão"+(lateN?" ("+(n-lateN)+" do returno + "+lateN+(lateN>1?" adiados":" adiado")+" de rodadas passadas).":" (rodadas "+BR_FIRST_ROUND+"–38).")+(brProjectionError?" A projeção está temporariamente indisponível.":"")):(isAdmin()?"Nenhum jogo mapeado. Use “Mapear temporada 2026”.":"Nenhum jogo mapeado ainda."));
  if(!opts.skipRender) render(activeTab);
}
function brEnsureLoaded(){
  if(S_BR.loaded||brLoading) return;
  if(!remoteClient||!remoteSession) return;
  brLoading=true;
  brLoadRemote().finally(()=>{brLoading=false;});
}

let brJogosRound=null, brPalRound=null;
function brRoundsIndex(fixtures){
  const byRound={};
  fixtures.forEach(f=>{ const r=(f.slot!=null?f.slot:f.round)||0; (byRound[r]=byRound[r]||[]).push(f); });
  return {byRound,rounds:Object.keys(byRound).map(Number).sort((a,b)=>a-b)};
}
function brRoundState(games){
  let done=0,live=0;
  games.forEach(f=>{ const s=brFixtureScore(f); if(s&&s.final) done++; else if(s&&s.live) live++; });
  return {total:games.length,done,live};
}
function brDefaultRound(rounds,byRound){
  const withLive=rounds.find(r=>brRoundState(byRound[r]).live>0);
  if(withLive!=null) return withLive;
  const open=rounds.find(r=>{ const st=brRoundState(byRound[r]); return st.done<st.total; });
  return open!=null?open:rounds[rounds.length-1];
}
function brChipsHTML(rounds,byRound,active,setter){
  return '<div class="brx-rounds">'+rounds.map(r=>{
    const st=brRoundState(byRound[r]);
    const cls='brx-chip'+(r===active?' active':(st.total&&st.done>=st.total?' done':''))+(st.live?' live':'');
    return '<button type="button" class="'+cls+'" title="Rodada '+r+'" onclick="'+setter+'('+r+')">'+r+'</button>';
  }).join("")+'</div>';
}
function brScrollChips(el){
  const wrap=el.querySelector(".brx-rounds"), act=wrap&&wrap.querySelector(".brx-chip.active");
  if(wrap&&act) wrap.scrollLeft=Math.max(0,act.offsetLeft-wrap.clientWidth/2+act.offsetWidth/2);
}

function brCountdownTxt(ms){
  const mins=Math.max(1,Math.round(ms/60000));
  if(mins<60) return "em "+mins+" min";
  const h=Math.floor(mins/60);
  if(h<48){ const m=mins%60; return "em "+h+"h"+(m?String(m).padStart(2,"0"):""); }
  return null;
}

let brHomeRound=null,brHomeDayKey=null;
function brHomeRoundDayKeys(games){
  const seen=new Set(),keys=[];
  games.forEach(f=>{
    const key=f.dateKey||f.date||"a-definir";
    if(!seen.has(key)){ seen.add(key); keys.push(key); }
  });
  return keys;
}
function brHomeDayWindow(games,now){
  const byKey={};
  games.forEach(f=>{
    const key=f.dateKey||f.date||"a-definir";
    if(!byKey[key]) byKey[key]={key,date:f.date||"Data a definir",games:[]};
    byKey[key].games.push(f);
  });
  const days=Object.values(byKey);
  if(!days.length) return {day:null,games:[],prevKey:null,nextKey:null,title:"Jogos da rodada",meta:"",canReset:false};
  const todayKey=new Intl.DateTimeFormat("en-CA",{year:"numeric",month:"2-digit",day:"2-digit",timeZone:BR_TZ}).format(new Date(now));
  const live=days.find(d=>d.games.some(f=>{ const score=brFixtureScore(f); return score&&score.live; }));
  const today=days.find(d=>d.key===todayKey);
  const next=days.find(d=>d.games.some(f=>{
    const score=brFixtureScore(f);
    return (!score||score.live)&&(!f.ts||f.ts>=now);
  }));
  const pending=days.find(d=>d.games.some(f=>{ const score=brFixtureScore(f); return !score||score.live; }));
  const fallback=live||today||next||pending||days[days.length-1];
  const day=days.find(d=>d.key===brHomeDayKey)||fallback;
  const index=days.indexOf(day);
  // A Home exibe um par de dias consecutivos. A navegação desloca a janela um
  // dia de cada vez, para que o usuário mantenha contexto entre as rodadas.
  const visibleDays=days.slice(index,index+2);
  const visibleGames=visibleDays.flatMap(d=>d.games);
  const state=brRoundState(visibleGames);
  const isToday=day.key===todayKey;
  const isLive=state.live>0;
  const isPast=day.key<todayKey;
  const title=isLive?"Ao vivo agora":isToday?"Jogos de hoje":isPast?"Resultados":"Próximos jogos";
  const dateLabel=visibleDays.map(d=>d.date).join(" — ");
  const meta=isLive?state.live+(state.live===1?" ao vivo":" ao vivo")+" · "+state.done+"/"+state.total+" encerrados":visibleDays.length+" dias · "+visibleGames.length+(visibleGames.length===1?" jogo":" jogos");
  return {day,days:visibleDays,games:visibleGames,state,title,dateLabel,meta,prevKey:days[index-1]?.key||null,nextKey:days[index+1]?.key||null,canReset:brHomeDayKey!=null&&day.key!==fallback.key};
}
function brHomeMoveDay(dir){
  const fixtures=brBolaoFixtures();
  const {rounds,byRound}=brRoundsIndex(fixtures);
  const defaultRound=brDefaultRound(rounds,byRound);
  const focusRound=brHomeRound!=null&&byRound[brHomeRound]?brHomeRound:defaultRound;
  const win=brHomeDayWindow(byRound[focusRound]||[],Date.now());
  const target=dir<0?win.prevKey:win.nextKey;
  if(target){
    brHomeRound=focusRound;
    brHomeDayKey=target;
    renderBrHome();
    return;
  }
  const targetRound=rounds[rounds.indexOf(focusRound)+dir];
  if(targetRound==null) return;
  const keys=brHomeRoundDayKeys(byRound[targetRound]||[]);
  brHomeRound=targetRound;
  brHomeDayKey=dir<0?keys[keys.length-1]||null:keys[0]||null;
  renderBrHome();
}

function brHomeFullWeekdayLabel(label){

  return (map[key]||m[1])+m[2];
}

/* ---- Pontuação (reusa o motor 3/1/0/−2 da Copa: scoreDetails) ---- */
function brScoringResult(fx){ const s=brFixtureScore(fx); return s?{s1:s.s1,s2:s.s2}:null; }
function brPlayerStats(pi){
  let pts=0,crav=0,corr=0,inv=0,err=0,played=0;
  brBolaoFixtures().forEach(fx=>{
    const res=brScoringResult(fx); if(!res) return;
    const pal=S_BR.palpites[brPredKey(pi,fx.id)];
    const d=scoreDetails(pal,res); if(!d) return;
    played++; pts+=d.pts;
    if(d.exact) crav++; else if(d.base===1) corr++; else if(d.base===-2) inv++; else err++;
  });
  return {pts,crav,corr,inv,err,played};
}
function brRanking(){
  return (S.participants||[]).map((name,i)=>({name,i,...brPlayerStats(i)})).sort((a,b)=>{
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(b.crav!==a.crav) return b.crav-a.crav;
    if(a.inv!==b.inv) return a.inv-b.inv;
    return String(a.name).localeCompare(String(b.name),"pt-BR");
  });
}
function brPtsCls(d){ return d.exact?'hit':d.base===1?'ok':d.base===-2?'inv':'zero'; }
function brPtsBadge(d){
  const cls=brPtsCls(d);
  const lbl=d.exact?'+3':d.base===1?'+1':d.base===-2?'−2':'0';
  return '<span class="brx-pts '+cls+'">'+lbl+'</span>';
}

/* ---- Tabela (classificação do Brasileirão) ----
   Parte da classificação REAL de antes da rodada 19 (BR_BASE, congelada) e soma
   por cima os jogos do bolão (brBolaoFixtures: returno + adiados remarcados):
   resultado real quando existe (oficial fecha, ao vivo entra como parcial) e,
   na projeção, o palpite do próprio usuário nos jogos ainda sem placar. Não
   espera preencher tudo: cada palpite entra na conta na hora; jogo sem placar e
   sem palpite fica só com a base até alguém palpitar nele. */
let brTabelaMode=null;
function brTableRows(withPalpites){
  const pi=myParticipantIndex();
  const teams={};
  const T=n=>{
    if(!teams[n]){
      const b=BR_BASE[n];
      teams[n]=b?{name:n,pts:b[0],j:b[1],v:b[2],e:b[3],d:b[4],gp:b[5],gc:b[6],sg:0,proj:0,live:false,liveInfo:null,form:[]}
               :{name:n,pts:0,j:0,v:0,e:0,d:0,gp:0,gc:0,sg:0,proj:0,live:false,liveInfo:null,form:[]};
    }
    return teams[n];
  };
  Object.keys(BR_BASE).forEach(T);
  brBolaoFixtures().forEach(fx=>{
    if(!fx.t1||!fx.t2) return;
    const home=T(fx.t1), away=T(fx.t2);
    const sc=brFixtureScore(fx);
    let s1,s2,kind;
    if(sc){ s1=sc.s1; s2=sc.s2; kind=sc.live?"live":"real"; }
    else if(withPalpites&&pi!=null){
      const p=S_BR.palpites[brPredKey(pi,fx.id)];
      if(!p||p.s1==null||p.s2==null) return;
      s1=+p.s1; s2=+p.s2; kind="proj";
    } else return;
    if(kind==="live"){
      home.live=true; away.live=true;
      home.liveInfo={score:s1+"–"+s2,elapsed:sc.elapsed};
      away.liveInfo={score:s2+"–"+s1,elapsed:sc.elapsed};
    }
    if(kind==="proj"){ home.proj++; away.proj++; }
    home.j++; away.j++; home.gp+=s1; home.gc+=s2; away.gp+=s2; away.gc+=s1;
    if(s1>s2){ home.v++; away.d++; home.pts+=3; }
    else if(s2>s1){ away.v++; home.d++; away.pts+=3; }
    else{ home.e++; away.e++; home.pts++; away.pts++; }
    const tip=fx.t1+" "+s1+"×"+s2+" "+fx.t2+(kind==="proj"?" · seu palpite":kind==="live"?" · ao vivo":"");
    home.form.push({r:s1>s2?"v":s1<s2?"d":"e",kind,tip});
    away.form.push({r:s2>s1?"v":s2<s1?"d":"e",kind,tip});
  });
  const rows=Object.values(teams);
  rows.forEach(t=>{ t.sg=t.gp-t.gc; t.form=t.form.slice(-5); });
  rows.sort((a,b)=>b.pts-a.pts||b.v-a.v||b.sg-a.sg||b.gp-a.gp||String(a.name).localeCompare(String(b.name),"pt-BR"));
  return rows;
}

  const offPos={}; official.forEach((t,i)=>{ offPos[t.name]=i+1; });

    const sg=t.sg>0?'<span class="brx-sgn up">+'+t.sg+'</span>':t.sg<0?'<span class="brx-sgn down">−'+Math.abs(t.sg)+'</span>':'0';
    return '<tr class="brx-tr'+zone+'" style="--i:'+i+'">'+

    '</tr>';
  }).join("");
  const head='<tr><th title="posição">#</th><th>Clube</th><th title="pontos">P</th><th title="jogos">J</th><th title="vitórias">V</th><th title="empates">E</th><th title="derrotas">D</th><th title="gols pró">GP</th><th title="gols contra">GC</th><th title="saldo de gols">SG</th><th>Últimos</th></tr>';
  el.innerHTML='<div class="panel"><div class="card">'+
    '<div class="brx-sec"><span class="brx-sec-title">Tabela do Brasileirão</span><span class="brx-sec-meta">'+(liveN?'<span class="live">'+liveN+' ao vivo</span> · ':'')+'1º turno + '+counted+' de '+fixtures.length+' do returno</span></div>'+
    (pi!=null?'<div class="brx-tbl-cta">'+seg+cta+'</div>':'')+
    '<p class="brx-tbl-note">'+note+'</p>'+
    '<div class="brx-tbl-wrap"><table class="brx-tbl"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
    '<div class="brx-legend" style="margin-top:12px">'+
      '<span class="brx-legend-item"><span class="brx-dot v"></span>vitória</span>'+
      '<span class="brx-legend-item"><span class="brx-dot e"></span>empate</span>'+

/* ---- Tabela V2 (prévia admin) -----------------------------------------------
   A versão atual continua intacta para participantes. A V2 abre sempre na
   classificação ao vivo e usa um único botão para alternar a projeção. */
let brTabelaV2Mode="oficial";
function brTabelaV2UpdatedLabel(){
  if(!brLastUpdatedAt) return "agora";
  try{
    return "às "+new Intl.DateTimeFormat("pt-BR",{hour:"2-digit",minute:"2-digit",hourCycle:"h23",timeZone:BR_TZ}).format(brLastUpdatedAt);
  }catch(e){ return "agora"; }
}
function brTableLogoDecorative(team){
  const src=BR_TEAM_LOGOS[team];
  const special=team==="Athletico-PR"?' brx-logo-athletico':'';
  return src
    ? '<img class="brx-logo'+special+'" src="'+esc(src)+'" alt="" aria-hidden="true">'
    : '<span class="brx-logo-ph" aria-hidden="true">'+esc(String(team||"?").slice(0,3).toUpperCase())+'</span>';
}
function brTabelaV2Movement(delta){
  if(delta>0) return '<span class="brv2-move up" title="Subiu '+delta+(delta===1?' posição':' posições')+'"><span aria-hidden="true">↑'+delta+'</span><span class="brv2-sr">Subiu '+delta+(delta===1?' posição':' posições')+'</span></span>';
  if(delta<0){ const n=Math.abs(delta); return '<span class="brv2-move down" title="Caiu '+n+(n===1?' posição':' posições')+'"><span aria-hidden="true">↓'+n+'</span><span class="brv2-sr">Caiu '+n+(n===1?' posição':' posições')+'</span></span>'; }
  return '<span class="brv2-move same" title="Sem mudança"><span aria-hidden="true">·</span><span class="brv2-sr">Sem mudança de posição</span></span>';
}
function brTabelaV2Form(form){
  if(!form.length) return '<span class="brv2-form" role="img" aria-label="Sem jogos do returno na conta"><span class="brv2-form-dot" aria-hidden="true"></span></span>';
  const names={v:"vitória",e:"empate",d:"derrota"};
  const aria=form.map(f=>names[f.r]+(f.kind==="proj"?" projetada":f.kind==="live"?" ao vivo":"")).join(", ");
  return '<span class="brv2-form" role="img" aria-label="Forma no returno: '+esc(aria)+'">'+form.map(f=>
    '<span class="brv2-form-dot '+f.r+(f.kind==="proj"?' projected':f.kind==="live"?' live':'')+'" title="'+esc(f.tip)+'" aria-hidden="true"></span>'
  ).join('')+'</span>';
}
function brTabelaV2Zone(pos,total){
  const relegationStart=Math.max(5,total-3);
  if(pos<=4) return {className:"zone-lib-group",label:"zona da fase de grupos da Libertadores"};
  if(pos===5) return {className:"zone-lib-pre",label:"zona da fase preliminar da Libertadores"};
  if(pos<=11) return {className:"zone-sula",label:"faixa-base da Copa Sul-Americana"};
  if(pos>=relegationStart) return {className:"zone-relegation",label:"zona de rebaixamento"};
  return {className:"",label:""};
}
