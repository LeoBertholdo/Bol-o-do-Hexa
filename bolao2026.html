<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta id="themeColor" name="theme-color" content="#f8fbf1">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  /* Evita o flash branco ao reabrir o Brasileirão salvo no aparelho. */
  try{
    if(localStorage.getItem("bolaoActiveComp")==="brasileirao"){
      document.documentElement.classList.add("br-mode");
      document.getElementById("themeColor").setAttribute("content","#070d09");
    }
  }catch(e){}
</script>
<title>Bolão da Copa 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:clip;background:#f8fbf1}
html.br-mode{background:#070d09;color-scheme:dark}
:root{
  --green:#00843d;
  --green-2:#005f2f;
  --yellow:#ffdf00;
  --blue:#002776;
  --blue-2:#071c4d;
  --sky:#e9f4ff;
  --bg:#f6f8ee;
  --surface:#fffdf4;
  --surface-2:#ffffff;
  --border:#dce5d8;
  --text:#172033;
  --muted:#697589;
  --gold:#f5c542;
  --silver:#b9c3cf;
  --bronze:#c98747;
  --red:#d83a34;
  --shadow:0 18px 50px rgba(0,39,118,.12);
}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
  color:var(--text);
  overflow-x:clip;
  background:
    linear-gradient(135deg,rgba(0,132,61,.1) 0 16%,transparent 16% 100%),
    linear-gradient(180deg,#f8fbf1 0%,#eef5ff 52%,#f7f9f1 100%);
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.22;
  background-image:
    linear-gradient(30deg, rgba(0,39,118,.08) 12%, transparent 12.5%, transparent 87%, rgba(0,39,118,.08) 87.5%, rgba(0,39,118,.08)),
    linear-gradient(150deg, rgba(0,39,118,.08) 12%, transparent 12.5%, transparent 87%, rgba(0,39,118,.08) 87.5%, rgba(0,39,118,.08));
  background-size:72px 72px;
}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled,input:disabled,select:disabled{cursor:not-allowed;opacity:.58}
input:disabled,select:disabled{background:#f4f7f5;color:#8792a3}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(255,223,0,.72);outline-offset:2px}

/* ACCOUNT MENU */
.account-menu{position:relative;display:flex;align-items:center;gap:8px;z-index:2}
.account-buttons{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn-auth{
  border:1px solid rgba(255,255,255,.38);
  background:rgba(255,255,255,.12);
  color:#fff;
  padding:10px 13px;
  border-radius:8px;
  font-size:.78rem;
  font-weight:950;
  white-space:nowrap;
}
.btn-auth.primary{background:var(--yellow);border-color:var(--yellow);color:var(--blue);box-shadow:0 8px 22px rgba(0,0,0,.14)}
.btn-auth.user{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.account-panel{
  position:absolute;
  top:calc(100% + 10px);
  right:0;
  width:min(360px,calc(100vw - 28px));
  display:none;
  color:var(--text);
  background:rgba(255,253,244,.98);
  border:1px solid rgba(220,229,216,.96);
  border-radius:8px;
  padding:14px;
  box-shadow:0 22px 56px rgba(0,39,118,.28);
}
.account-panel.open{display:block}
.account-panel:before{
  content:"";
  position:absolute;
  right:24px;
  top:-8px;
  width:14px;
  height:14px;
  transform:rotate(45deg);
  background:rgba(255,253,244,.98);
  border-left:1px solid rgba(220,229,216,.96);
  border-top:1px solid rgba(220,229,216,.96);
}
.account-panel .card{margin:0;box-shadow:none;border-color:rgba(220,229,216,.95)}
.account-panel .login-grid{grid-template-columns:1fr;margin-top:10px}
.account-panel .txt-inp,.account-panel .txt-select{text-align:left;height:42px}
.account-panel .action-btn{min-width:130px}

/* HEADER */
.hero{
  position:relative;
  overflow:visible;
  z-index:10;
  /* Com viewport-fit=cover, preserva o espaço da barra de status sem deixar
     uma faixa branca acima do cabeçalho no iPhone. */
  padding-top:env(safe-area-inset-top);
  color:#fff;
  background:
    linear-gradient(90deg,rgba(0,39,118,.88) 0%,rgba(0,76,45,.68) 34%,rgba(0,0,0,.22) 68%,rgba(0,0,0,.42) 100%),
    url("assets/header-hexa-2026.png") center 52%/cover no-repeat,
    linear-gradient(128deg,#004c2d 0%,#002776 58%,#071c4d 100%);
  border-bottom:1px solid rgba(255,255,255,.2);
  box-shadow:0 16px 46px rgba(0,39,118,.28);
}
.hero.is-brazil-japan-victory{
  background:
    linear-gradient(90deg,rgba(0,39,118,.92) 0%,rgba(0,76,45,.72) 34%,rgba(0,0,0,.08) 70%,rgba(0,0,0,.32) 100%),
    url("assets/header-brasil-venceu-japao-2026.png") center center/cover no-repeat,
    linear-gradient(128deg,#004c2d 0%,#002776 58%,#071c4d 100%);
  box-shadow:0 16px 46px rgba(0,76,45,.32);
}
.hero.is-brazil-norway-victory{
  background:
    linear-gradient(90deg,rgba(0,39,118,.92) 0%,rgba(0,76,45,.72) 34%,rgba(0,0,0,.08) 70%,rgba(0,0,0,.32) 100%),
    url("assets/header-brasil-venceu-noruega-2026.png") center center/cover no-repeat,
    linear-gradient(128deg,#004c2d 0%,#002776 58%,#071c4d 100%);
  box-shadow:0 16px 46px rgba(0,76,45,.32);
}
.hero.is-brazil-eliminated{
  background:
    linear-gradient(90deg,rgba(2,8,23,.94) 0%,rgba(3,12,30,.78) 40%,rgba(0,0,0,.12) 72%,rgba(0,0,0,.34) 100%),
    url("assets/header-brasil-eliminado-2026.png") center center/cover no-repeat,
    linear-gradient(128deg,#050914 0%,#07162d 58%,#02050c 100%);
  box-shadow:0 16px 46px rgba(2,8,23,.4);
}
.hero.is-brasileirao{
  background:
    linear-gradient(90deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,.04) 56%,rgba(0,0,0,.14) 100%),
    url("assets/header-brasileirao-2026.png") center center/cover no-repeat,
    linear-gradient(128deg,#02050c 0%,#062d1d 52%,#120f06 100%);
  box-shadow:0 16px 46px rgba(3,48,30,.34);
}
.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.04) 46%,rgba(0,0,0,.24));
  opacity:.72;
  z-index:0;
  pointer-events:none;
}
header{
  position:relative;
  z-index:1;
  max-width:1120px;
  margin:0 auto;
  padding:22px 16px 18px;
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
}
.brand-kicker{font-size:.7rem;text-transform:uppercase;letter-spacing:1.4px;font-weight:900;color:var(--yellow);margin-bottom:4px}
h1{font-size:clamp(1.58rem,4.35vw,2.8rem);line-height:1;font-weight:950;letter-spacing:0}
.sub{font-size:.84rem;opacity:.9;margin-top:7px}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn-save{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.34);padding:10px 12px;border-radius:8px;font-weight:950;font-size:.78rem;box-shadow:none}
.btn-save:hover{background:rgba(255,255,255,.18)}
.comp-toggle{display:inline-flex;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.30);border-radius:999px;padding:3px;gap:2px}
.comp-toggle button{border:none;background:transparent;color:#fff;font-weight:900;font-size:.72rem;letter-spacing:.3px;padding:6px 13px;border-radius:999px;cursor:pointer;line-height:1;transition:background .15s,color .15s}
.comp-toggle button:hover{background:rgba(255,255,255,.14)}
.comp-toggle button.active{background:var(--yellow);color:var(--blue)}
.comp-toggle button.active:hover{background:var(--yellow)}
/* ==== Brasileirão (modo paralelo) — tema escuro "estádio à noite" ====
   Tudo escopado em body.br-mode (ligado em applyCompChrome) ou em classes .brx-*
   usadas só pelas telas do módulo BR, então a Copa nunca herda nada daqui. */
body.br-mode{
  color:#e9f1ec;
  background:
    radial-gradient(1100px 540px at 85% -12%,rgba(0,132,61,.30),transparent 62%),
    radial-gradient(900px 480px at -12% 30%,rgba(255,215,94,.06),transparent 55%),
    linear-gradient(180deg,#0a130e 0%,#070d09 55%,#050807 100%);
}
body.br-mode:before{
  opacity:.55;
  background-image:repeating-linear-gradient(90deg,transparent 0 84px,rgba(255,255,255,.02) 84px 168px);
  background-size:auto;
}
.hero.is-brasileirao header{padding-top:13px;padding-bottom:12px}
.hero.is-brasileirao h1{font-size:clamp(1.42rem,3vw,2.05rem)}
.hero.is-brasileirao .brand-kicker{font-size:.6rem;margin-bottom:3px}
.hero.is-brasileirao .btn-save,.hero.is-brasileirao .btn-auth{padding:8px 10px}
.hero.is-brasileirao .comp-toggle button{padding:5px 11px}
body.br-mode nav{padding-top:5px;padding-bottom:5px;background:rgba(8,13,10,.88);border-bottom:1px solid rgba(255,255,255,.07)}
body.br-mode nav button{padding:8px 10px;color:#7e9488;font-size:.76rem}
body.br-mode .tab{padding-top:12px}
body.br-mode nav button:hover{color:#cfe2d6}
body.br-mode nav button.active{color:#ffd75e;background:rgba(255,215,94,.09);border-color:rgba(255,215,94,.22);box-shadow:none}
body.br-mode .tab.active{animation:brxFadeIn .28s ease}
@keyframes brxFadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
body.br-mode .tab .panel{background:rgba(255,255,255,.02);border-color:rgba(255,255,255,.06);box-shadow:none}
body.br-mode .tab .card{background:linear-gradient(180deg,#111c15,#0c1410);border-color:rgba(255,255,255,.08);box-shadow:0 16px 44px rgba(0,0,0,.42)}
body.br-mode .tab .card-title{color:#ffd75e}
body.br-mode .tab .microcopy{color:#8ba295}
body.br-mode .tab .microcopy strong{color:#dcebe2}
body.br-mode .tab .action-btn{background:#009247;box-shadow:0 10px 26px rgba(0,146,71,.22)}
body.br-mode .tab .action-btn:hover{background:#00a851}
body.br-mode .tab .action-btn.secondary{background:rgba(255,255,255,.06);color:#dcebe2;border:1px solid rgba(255,255,255,.15);box-shadow:none}
body.br-mode .tab .action-btn.secondary:hover{background:rgba(255,255,255,.11)}
/* status e telas de estado */
.brx-status{display:inline-flex;align-items:center;gap:7px;font-size:.72rem;font-weight:900;padding:8px 13px;border-radius:999px;border:1px solid transparent}
.brx-status.ok{background:rgba(74,224,142,.08);border-color:rgba(74,224,142,.28);color:#4ae08e}
.brx-status.warn{background:rgba(255,215,94,.08);border-color:rgba(255,215,94,.3);color:#ffd75e}
.brx-status.err{background:rgba(255,122,112,.1);border-color:rgba(255,122,112,.32);color:#ff8b82}
.brx-state{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:30px 16px}
.brx-state-ico{font-size:2rem;line-height:1}
.brx-state h3{font-weight:950;font-size:1.05rem;color:#fff}
.brx-state p{font-size:.8rem;color:#8ba295;max-width:440px;line-height:1.55}
.brx-spinner{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:#ffd75e;animation:cinemaSpin .9s linear infinite}
/* cabeçalho de seção dentro dos cards */
.brx-sec{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
.brx-sec-title{font-size:.7rem;text-transform:uppercase;letter-spacing:1.1px;color:#ffd75e;font-weight:950}
.brx-sec-meta{font-size:.62rem;color:#71877b;font-weight:900;letter-spacing:.4px;text-transform:uppercase}
.brx-sec-meta .live{color:#4ae08e}
.brx-rnav{display:flex;align-items:center;gap:8px}
.brx-round-title{min-width:104px;text-align:center;font-weight:950;font-size:1.02rem;color:#fff}
.brx-arrow{width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#dcebe2;font-weight:950;font-size:1rem;display:flex;align-items:center;justify-content:center;line-height:1}
.brx-arrow:hover:not(:disabled){background:rgba(255,255,255,.11)}
.brx-arrow:disabled{opacity:.3}
/* chips de rodada */
.brx-rounds{display:flex;gap:6px;overflow-x:auto;padding:2px;scrollbar-width:none}
.brx-rounds::-webkit-scrollbar{display:none}
.brx-chip{position:relative;flex:0 0 auto;min-width:46px;padding:9px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#9fb3a7;font-weight:950;font-size:.78rem;line-height:1;text-align:center;transition:background .15s,color .15s,border-color .15s}
.brx-chip:hover{background:rgba(255,255,255,.09);color:#dcebe2}
.brx-chip.done{color:#75897d;background:rgba(255,255,255,.02)}
.brx-chip.active{background:linear-gradient(120deg,#ffd75e,#f0b53a);border-color:#ffd75e;color:#241a00}
.brx-chip.live:after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:#4ae08e;animation:brxPulse 1.2s ease-in-out infinite}
@keyframes brxPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
/* partidas */
.brx-games{display:grid;gap:10px}
@media(min-width:920px){.brx-games{grid-template-columns:1fr 1fr}}
.brx-home-games-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 14px}
.brx-home-games-copy{min-width:0}
.brx-home-day-title{display:block;margin-top:5px;color:#fff;font-size:1.14rem;font-weight:950;line-height:1.05}
.brx-home-day-meta{display:block;margin-top:5px;color:#8ba295;font-size:.61rem;font-weight:900;letter-spacing:.45px;text-transform:uppercase}
.brx-home-day-meta .live{color:#4ae08e}
.brx-home-nav{display:inline-flex;align-items:center;gap:5px;padding:4px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.04);flex:0 0 auto}
.brx-home-arrow,.brx-home-reset{display:grid;place-items:center;width:30px;height:30px;padding:0;border:0;border-radius:7px;background:transparent;color:#dcebe2;font-size:1.2rem;font-weight:950;line-height:1;cursor:pointer;transition:background .15s,color .15s}
.brx-home-reset{color:#ffd75e;font-size:.9rem}
.brx-home-arrow:hover:not(:disabled),.brx-home-reset:hover{background:rgba(255,255,255,.1);color:#fff}
.brx-home-arrow:disabled{opacity:.28;cursor:not-allowed}
.brx-home-games-list .brx-games{grid-template-columns:1fr}
.brx-home-days{display:grid;gap:14px}
.brx-home-day-block+.brx-home-day-block{padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.brx-home-day-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;padding:0 0 8px;border-bottom:1px solid rgba(255,255,255,.08)}
.brx-home-day-label{display:inline-flex;align-items:center;gap:7px;color:#fff;font-size:.78rem;font-weight:950;letter-spacing:.65px;text-transform:uppercase}
.brx-home-day-label:before{content:"";width:6px;height:6px;border-radius:50%;background:#ffd75e;box-shadow:0 0 12px rgba(255,215,94,.32)}
.brx-home-day-status{padding:4px 8px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(255,255,255,.04);color:#8ba295;font-size:.54rem;font-weight:950;letter-spacing:.45px;text-transform:uppercase;white-space:nowrap}
.brx-home-day-status.live{color:#4ae08e}
.brx-match{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:13px 14px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));transition:border-color .18s,transform .18s,box-shadow .18s}
.brx-match:hover{border-color:rgba(74,224,142,.3);transform:translateY(-1px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.brx-match.live{border-color:rgba(74,224,142,.42);box-shadow:0 0 0 1px rgba(74,224,142,.16),0 14px 34px rgba(0,0,0,.4)}
.brx-team{display:flex;align-items:center;gap:9px;min-width:0}
.brx-team.home{justify-content:flex-end;text-align:right}
.brx-team-name{font-weight:850;font-size:.84rem;color:#dcebe2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brx-team.win .brx-team-name{color:#fff;font-weight:950}
.brx-team.lose .brx-team-name{color:#75897d}
.brx-crest{display:grid;place-items:center;width:30px;height:30px;flex:0 0 auto;line-height:0}
.brx-logo{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.brx-logo-ph{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.08);color:#93a89d;font-size:.56rem;font-weight:900;line-height:1}
.brx-mid{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:84px}
.brx-score{display:flex;align-items:center;gap:7px;font-weight:950;font-size:1.22rem;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.brx-score span{color:#5d7267;font-weight:700;font-size:.9rem}
.brx-score.live{color:#4ae08e}
.brx-tag{font-size:.6rem;font-weight:950;letter-spacing:.8px;text-transform:uppercase;color:#71877b}
.brx-tag.live{display:inline-flex;align-items:center;gap:5px;color:#4ae08e}
.brx-tag.live:before{content:"";width:6px;height:6px;border-radius:50%;background:#4ae08e;animation:brxPulse 1.2s ease-in-out infinite}
.brx-tag.late{color:#e0b34a;white-space:nowrap}
.brx-when{display:flex;flex-direction:column;align-items:center;line-height:1.35}
.brx-when.compact{justify-content:center}
.brx-when-date{font-size:.6rem;font-weight:900;letter-spacing:.4px;text-transform:uppercase;color:#71877b;white-space:nowrap}
.brx-when-time{font-size:1.05rem;font-weight:950;color:#ffd75e}
.brx-when.compact .brx-when-time{font-size:1.02rem}
/* home / hero */
.brx-hero{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:20px;margin-bottom:14px;background:radial-gradient(720px 300px at 88% -30%,rgba(0,168,81,.32),transparent 62%),linear-gradient(180deg,#101c14,#0b1410)}
.brx-hero:before{content:"";position:absolute;top:-70px;right:-70px;width:230px;height:230px;border-radius:50%;border:1.5px solid rgba(255,255,255,.06);pointer-events:none}
.brx-hero:after{content:"";position:absolute;top:-40px;right:-40px;width:150px;height:150px;border-radius:50%;border:1.5px solid rgba(255,255,255,.05);pointer-events:none}
.brx-hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(250px,.85fr);gap:18px;align-items:center}
.brx-hero-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(198px,.78fr);gap:16px;align-items:center;min-width:0}
.brx-hero-copy{min-width:0}
.brx-kicker{font-size:.62rem;letter-spacing:1.7px;font-weight:950;text-transform:uppercase;color:#ffd75e}
.brx-hero h2{font-size:clamp(1.45rem,3.6vw,2.05rem);font-weight:950;color:#fff;margin:7px 0 3px;line-height:1.05}
.brx-hero-focus{min-height:0;display:flex;flex-direction:column;justify-content:center;gap:9px;padding:6px 0 6px 16px;border-left:1px solid rgba(255,255,255,.13)}
.brx-hero-focus.live{border-left-color:rgba(74,224,142,.54)}
.brx-focus-heading{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brx-focus-label{display:flex;align-items:center;gap:6px;color:#9db3a6;font-size:.57rem;font-weight:950;letter-spacing:.75px;text-transform:uppercase}
.brx-hero-focus.live .brx-focus-label{color:#4ae08e}
.brx-focus-label.live:before{content:"";width:6px;height:6px;border-radius:50%;background:#4ae08e;animation:brxPulse 1.2s ease-in-out infinite}
.brx-focus-date{color:#71877b;font-size:.56rem;font-weight:900;letter-spacing:.35px;text-transform:uppercase;white-space:nowrap}
.brx-focus-games{display:grid;gap:6px}
.brx-focus-game{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;color:#eaf4ed;font-size:.66rem;font-weight:900;line-height:1.18}
.brx-focus-team{display:flex;align-items:center;gap:5px;min-width:0}
.brx-focus-team.home{justify-content:flex-end;text-align:right}
.brx-focus-team-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brx-focus-team .brx-crest{width:23px;height:23px}
.brx-focus-game strong{color:#ffd75e;font-size:.84rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.brx-hero-focus.live .brx-focus-game strong{color:#4ae08e}
.brx-focus-more{color:#71877b;font-size:.56rem;font-weight:900;letter-spacing:.3px}
.brx-favorite{gap:8px;min-width:0}
.brx-favorite-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brx-favorite .brx-focus-label{color:#ffd75e}
.brx-favorite-change{padding:2px 0;border:0;background:none;color:#8ba295;font-size:.54rem;font-weight:950;letter-spacing:.25px;text-transform:uppercase;cursor:pointer}
.brx-favorite-change:hover{text-decoration:underline;text-underline-offset:3px}
.brx-favorite-club{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;min-width:0;padding:0;border:0;background:none;color:#fff;text-align:left;cursor:pointer}
.brx-favorite-club .brx-crest{width:34px;height:34px}
.brx-favorite-club-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
.brx-favorite-club-copy strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.82rem;font-weight:950;line-height:1.1}
.brx-favorite-club-copy span{color:#8ba295;font-size:.52rem;font-weight:900;letter-spacing:.4px;text-transform:uppercase}
.brx-favorite-position{display:flex;flex-direction:column;align-items:flex-end;gap:1px;line-height:1}
.brx-favorite-position strong{color:#fff;font-size:1.02rem;font-weight:950;font-variant-numeric:tabular-nums}
.brx-favorite-position span{color:#8ba295;font-size:.43rem;font-weight:950;letter-spacing:.38px;text-transform:uppercase;white-space:nowrap}
.brx-favorite-games{display:grid;gap:5px;padding-top:7px;border-top:1px solid rgba(255,255,255,.1)}
.brx-favorite-game{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:7px;min-width:0}
.brx-favorite-game-copy{display:flex;align-items:center;gap:5px;min-width:0;color:#cfe0d6;font-size:.59rem;font-weight:850}
.brx-favorite-game-copy .brx-crest{width:19px;height:19px}
.brx-favorite-game-copy span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brx-favorite-game-meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;white-space:nowrap;color:#dcebe2;font-size:.5rem;font-weight:950;letter-spacing:.18px;text-transform:uppercase}
.brx-favorite-game-meta strong{display:contents}
.brx-favorite-venue{display:inline-flex;align-items:center;justify-content:center;min-width:32px;min-height:15px;padding:1px 5px;border-radius:999px;font-size:.45rem;font-weight:950;line-height:1;letter-spacing:.35px}
.brx-favorite-venue.home{border:1px solid rgba(74,224,142,.34);background:rgba(74,224,142,.12);color:#4ae08e}
.brx-favorite-venue.away{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.065);color:#dcebe2}
.brx-favorite-date{color:#cfe0d6}
.brx-favorite-game-meta small{color:#71877b;font-size:.43rem;font-weight:900;font-variant-numeric:tabular-nums}
.brx-favorite-game-meta.live strong{color:#4ae08e;font-size:.65rem;font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
.brx-favorite-game-meta.live small{color:#4ae08e;text-transform:uppercase}
.brx-favorite-form{display:flex;align-items:center;gap:5px;margin-left:0;align-self:flex-start}
.brx-favorite-form-label{color:#71877b;font-size:.48rem;font-weight:900;letter-spacing:.35px;text-transform:uppercase}
.brx-favorite-form-dots{display:flex;gap:3px}
.brx-favorite-form-dots i{display:block;width:6px;height:6px;border-radius:50%;background:#526359}
.brx-favorite-form-dots i.v{background:#4ae08e}.brx-favorite-form-dots i.e{background:#aab9b0}.brx-favorite-form-dots i.d{background:#ff7a70}
.brx-favorite-empty{align-items:flex-start;padding-right:4px}
.brx-favorite-empty p{max-width:205px;color:#8ba295;font-size:.65rem;font-weight:750;line-height:1.4}
.brx-favorite-empty .brx-btn{padding:8px 11px;font-size:.65rem}
.brx-hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.brx-btn{border:none;border-radius:10px;padding:10px 14px;font-weight:950;font-size:.76rem;cursor:pointer;transition:filter .15s,background .15s}
.brx-btn.gold{background:linear-gradient(120deg,#ffd75e,#f0b53a);color:#241a00;box-shadow:0 10px 26px rgba(255,215,94,.18)}
.brx-btn.gold:hover{filter:brightness(1.06)}
.brx-btn.ghost{background:rgba(255,255,255,.07);color:#dcebe2;border:1px solid rgba(255,255,255,.16)}
.brx-btn.ghost:hover{background:rgba(255,255,255,.12)}
.brx-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.brx-stat{border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.045);border-radius:10px;padding:12px}
.brx-stat.wide{grid-column:1/-1}
.brx-stat strong{display:block;font-size:1.4rem;font-weight:950;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.brx-stat strong em{font-style:normal;font-size:.82rem;color:#71877b;font-weight:900}
.brx-stat span{display:block;margin-top:6px;font-size:.6rem;text-transform:uppercase;letter-spacing:.6px;color:#8ba295;font-weight:900}
/* progresso */
.brx-progress{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;min-width:80px}
.brx-progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#00a851,#4ae08e)}
.brx-progress-row{display:flex;align-items:center;gap:12px;margin-top:9px}
/* palpites */
.brx-pal .brx-mid{min-width:126px;gap:6px}
.brx-pal-when{font-size:.58rem;font-weight:900;letter-spacing:.4px;color:#71877b;text-transform:uppercase;white-space:nowrap}
.brx-guess{display:flex;align-items:center;gap:7px}
.brx-guess>span{color:#5d7267;font-weight:800}
.br-inp{width:46px;height:42px;text-align:center;font-weight:950;font-size:1.05rem;color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:0;background:rgba(255,255,255,.055);-moz-appearance:textfield}
.br-inp::-webkit-outer-spin-button,.br-inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.br-inp:focus{outline:none;border-color:#4ae08e;box-shadow:0 0 0 3px rgba(74,224,142,.16);background:rgba(74,224,142,.06)}
.br-saved{display:inline-flex;align-items:center;justify-content:center;min-width:18px;font-weight:950;font-size:1rem;line-height:1}
.br-saved.ok{color:#4ae08e;animation:brxPop .3s ease}
.br-saved.wait{color:#8ba295}
.br-saved.err{color:#ff8b82}
@keyframes brxPop{0%{transform:scale(.4)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.brx-locked{background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.005))}
.brx-locked-line{display:flex;flex-direction:column;align-items:center;line-height:1.25}
.brx-your{font-size:.6rem;font-weight:900;color:#71877b;text-transform:uppercase;white-space:nowrap}
.brx-real{font-weight:950;font-size:1.08rem;color:#fff;font-variant-numeric:tabular-nums}
.brx-pts{display:inline-block;font-size:.6rem;font-weight:950;padding:3px 8px;border-radius:999px;line-height:1}
.brx-pts.hit{background:linear-gradient(120deg,#ffd75e,#f0b53a);color:#241a00}
.brx-pts.ok{background:rgba(74,224,142,.14);color:#4ae08e;border:1px solid rgba(74,224,142,.3)}
.brx-pts.inv{background:rgba(255,122,112,.14);color:#ff8b82;border:1px solid rgba(255,122,112,.3)}
.brx-pts.zero{background:rgba(255,255,255,.07);color:#93a89d;border:1px solid rgba(255,255,255,.1)}
.brx-match.result.brx-pal .brx-team{align-self:start;margin-top:0}
.brx-match.result.brx-pal.has-round .brx-team{margin-top:17px}
.brx-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.brx-legend-item{display:inline-flex;align-items:center;gap:7px;font-size:.74rem;color:#9db3a6;font-weight:800}
/* palpite inline na aba Jogos */
.brx-mid-pal{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:2px;width:100%}
/* pontos como chip DENTRO do pill "ver todos" — contorno único, nada de badge
   espiando por trás (o fundo translúcido do pill deixava a curva dele vazar) */
.brx-open-pill .brx-pts{margin:-3px -7px -3px 0;padding:4px 8px;min-width:26px;text-align:center;box-sizing:border-box;border:none;font-size:.58rem}
.brx-open-pill .brx-pts.ok{background:rgba(74,224,142,.22)}
.brx-open-pill .brx-pts.inv{background:rgba(255,122,112,.22)}
.brx-open-pill .brx-pts.zero{background:rgba(255,255,255,.13);color:#c2d2c8}
.brx-pill-guess{border:1px solid rgba(255,215,94,.32);background:rgba(255,215,94,.1);color:#ffd75e;font-weight:950;font-size:.66rem;letter-spacing:.4px;text-transform:uppercase;padding:6px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.brx-pill-guess:hover{background:rgba(255,215,94,.18)}
.brx-pill-guess.filled{display:inline-flex;align-items:center;gap:6px;border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#9db3a6;text-transform:none;letter-spacing:0;font-weight:800}
.brx-pill-guess.filled b{color:#ffd75e;font-weight:950;font-variant-numeric:tabular-nums}
.brx-pill-guess.filled:hover{border-color:rgba(255,215,94,.38);color:#dcebe2}
.brx-pencil{display:inline-flex;align-items:center;opacity:.55;transition:opacity .15s}
.brx-pill-guess:hover .brx-pencil{opacity:1}
.brx-guess-edit{display:none;align-items:center;justify-content:center;gap:8px}
.brx-match.editing .brx-guess-edit{display:flex}
.brx-match.editing .brx-pill-guess{display:none}
.brx-guess-box{display:inline-flex;align-items:center;gap:2px;padding:3px;border:1px solid rgba(255,255,255,.13);border-radius:12px;background:rgba(255,255,255,.04);transition:border-color .15s,box-shadow .15s}
.brx-guess-box:focus-within{border-color:rgba(255,215,94,.55);box-shadow:0 0 0 3px rgba(255,215,94,.1)}
.brx-guess-box>span{color:#5d7267;font-weight:800;font-size:.85rem;padding:0 2px}
.brx-guess-box .br-inp{width:36px;height:32px;border:none;border-radius:9px;background:transparent;font-size:.98rem}
.brx-guess-box .br-inp::placeholder{color:#4d6156;font-weight:900}
.brx-guess-box .br-inp:focus{border:none;box-shadow:none;background:rgba(255,215,94,.08)}
/* neutro enquanto o palpite está incompleto — verde é reservado pro "pronto pra confirmar" (.ready),
   senão o ✓ em repouso parece "já salvo" */
.brx-guess-ok{width:32px;height:32px;margin-left:4px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#8ba295;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,border-color .15s,color .15s;flex:0 0 auto}
.brx-guess-ok:hover{background:rgba(255,255,255,.11)}
.brx-guess-ok.ready{border-color:rgba(74,224,142,.28);background:rgba(74,224,142,.09);color:#4ae08e}
.brx-guess-ok.ready:hover{background:rgba(74,224,142,.2);border-color:rgba(74,224,142,.5)}
/* o estado de save ("…"/"✓"/"!") mora DENTRO do botão ✓: quando tem texto, ele
   substitui o ícone — sem layout shift e sem dois checks lado a lado */
.brx-guess-ok .br-saved{min-width:0;font-size:.88rem;line-height:1}
.brx-guess-ok .br-saved:not(:empty)+svg{display:none}
.brx-guess-ok:has(.br-saved.err){border-color:rgba(255,122,112,.5);background:rgba(255,122,112,.12)}
.brx-open-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);color:#c8d9ce;font-weight:900;font-size:.62rem;letter-spacing:.2px;padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.brx-open-pill:hover{background:rgba(255,255,255,.1);color:#fff}
.brx-open-pill b{color:#fff;font-weight:950}
.brx-open-pill.scored.hit{border-color:rgba(255,215,94,.46);background:rgba(255,215,94,.15);color:#ffe391}
.brx-open-pill.scored.ok{border-color:rgba(74,224,142,.42);background:rgba(74,224,142,.12);color:#88ecb5}
.brx-open-pill.scored.inv{border-color:rgba(255,122,112,.44);background:rgba(255,122,112,.13);color:#ffada6}
.brx-open-pill.scored.zero{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.075);color:#b6c6bd}
.brx-open-pill.scored b{color:inherit}
/* popup "todos os palpites" (overlay escuro, clone do chart-modal) */
.brx-modal{position:fixed;inset:0;z-index:1300;display:none;align-items:center;justify-content:center;padding:16px}
.brx-modal.open{display:flex}
.brx-modal-backdrop{position:absolute;inset:0;background:rgba(4,8,6,.72);backdrop-filter:blur(3px)}
.brx-modal-frame{position:relative;width:100%;max-width:452px;max-height:90vh;overflow:auto;background:linear-gradient(180deg,#111c15,#0b1210);border:1px solid rgba(255,255,255,.1);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);padding:20px 16px 18px;animation:brxPopIn .22s ease}
@keyframes brxPopIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.brx-modal-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#cfe2d6;font-size:1.15rem;font-weight:900;cursor:pointer;display:grid;place-items:center;z-index:3}
.brx-modal-close:hover{background:rgba(255,255,255,.12);color:#fff}
body.brx-modal-open{overflow:hidden}
/* popup do clube (clicar no time na Tabela, na V2 ou nos cards de jogo). Camada
   própria ABAIXO do #brModal: o "ver todos" de um jogo travado abre por cima.
   --club = cor de destaque do clube clicado (BR_TEAM_COLORS). */
.brx-team-modal{z-index:1290}
.brx-team-frame{max-width:496px;overflow:auto;border-color:color-mix(in srgb,var(--club,#ffd75e) 30%,rgba(255,255,255,.1));background:radial-gradient(640px 250px at 50% -80px,color-mix(in srgb,var(--club,#ffd75e) 17%,transparent),transparent 72%),linear-gradient(180deg,#111c15,#0b1210)}
/* O Internacional ganha um vermelho limpo, fiel à identidade do clube. */
.brx-team-frame.brx-team-theme-internacional{border-color:rgba(255,73,91,.7);background:radial-gradient(640px 250px at 50% -80px,rgba(231,31,50,.32),transparent 72%),linear-gradient(180deg,#241215,#0b1010)}
.brx-tp-head{display:flex;align-items:center;gap:12px;margin:2px 40px 16px 2px}
.brx-tp-logo{width:56px;height:56px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 8px 20px rgba(0,0,0,.55))}
.brx-tp-id{min-width:0}
.brx-tp-name{font-size:1.34rem;font-weight:950;color:#fff;line-height:1.12;margin-top:2px}
.brx-tp-form{display:flex;align-items:center;gap:8px;margin-top:7px}
.brx-tp-form>span:last-child{font-size:.55rem;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:#71877b}
.brx-tp-inline-stats{display:flex;align-items:center;gap:9px;margin-left:auto;min-width:0}
.brx-tp-inline-stat{display:flex;flex-direction:column;gap:2px;padding-left:9px;border-left:1px solid rgba(255,255,255,.12);min-width:0}
.brx-tp-inline-stat strong{font-size:.92rem;font-weight:950;line-height:1;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.brx-tp-inline-stat strong.accent{color:var(--club,#ffd75e)}
.brx-tp-inline-stat span{font-size:.46rem;font-weight:900;letter-spacing:.45px;text-transform:uppercase;color:#8ba295;white-space:nowrap}
.brx-tp-games{display:grid;gap:10px}
.brx-tp-picker-btn{display:grid;place-items:center;width:32px;height:34px;padding:0;border:1px solid rgba(255,255,255,.13);border-radius:9px;background:rgba(255,255,255,.05);color:#dcebe2;font-size:1.18rem;font-weight:950;line-height:1;cursor:pointer;transition:background .15s,color .15s}
.brx-tp-picker-btn:hover:not(:disabled){background:rgba(255,255,255,.12);color:#fff}
.brx-tp-picker-btn:disabled{opacity:.3;cursor:not-allowed}
.brx-tp-carousel-shell{min-width:0}
.brx-tp-carousel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
.brx-tp-carousel-nav{display:inline-flex;align-items:center;gap:4px;padding:3px;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:rgba(255,255,255,.04)}
.brx-tp-carousel-nav .brx-tp-picker-btn{width:27px;height:27px;border:0;border-radius:6px;background:transparent;font-size:1rem}
.brx-tp-sequence{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 0 10px;padding:1px 1px 4px;touch-action:pan-x pan-y}
.brx-tp-sequence::-webkit-scrollbar{display:none}
.brx-tp-seq-btn{flex:0 0 auto;display:flex;align-items:center;gap:6px;max-width:126px;min-height:30px;padding:4px 7px;border:1px solid rgba(255,255,255,.1);border-radius:9px;background:rgba(255,255,255,.04);color:#dcebe2;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.brx-tp-seq-btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18);color:#fff}
.brx-tp-seq-btn.active{border-color:color-mix(in srgb,var(--club,#ffd75e) 54%,rgba(255,255,255,.16));background:color-mix(in srgb,var(--club,#ffd75e) 14%,rgba(255,255,255,.045));color:#fff}
.brx-tp-seq-btn.current:not(.active){border-color:rgba(255,215,94,.24)}
.brx-tp-seq-btn.live:not(.active){border-color:rgba(74,224,142,.24)}
.brx-tp-seq-btn .brx-crest{width:19px;height:19px;flex:0 0 auto}
.brx-tp-seq-name{min-width:0;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.62rem;font-weight:950;line-height:1}
.brx-tp-venue{display:grid;place-items:center;flex:0 0 auto;width:17px;height:17px;border-radius:6px;font-size:.46rem;font-weight:950;line-height:1;text-transform:uppercase}
.brx-tp-venue.home{border:1px solid rgba(74,224,142,.34);background:rgba(74,224,142,.13);color:#4ae08e}
.brx-tp-venue.away{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#b9cbc0}
.brx-tp-seq-btn.active .brx-tp-venue.home{background:rgba(74,224,142,.2)}
.brx-tp-seq-btn.active .brx-tp-venue.away{background:rgba(255,255,255,.12);color:#eef6f1}
.brx-tp-carousel{display:flex;gap:0;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;touch-action:pan-x pan-y}
.brx-tp-carousel::-webkit-scrollbar{display:none}
.brx-tp-slide{flex:0 0 100%;width:100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always}
.brx-tp-slide-head{display:flex;align-items:center;gap:8px;margin:0 1px 9px;color:#eef6f1;min-width:0}
.brx-tp-slide-head .brx-crest{width:25px;height:25px}
.brx-tp-slide-head strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.78rem;font-weight:950}
.brx-tp-slide-state{margin-left:auto;padding:4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#8ba295;font-size:.5rem;font-weight:950;letter-spacing:.45px;text-transform:uppercase;white-space:nowrap}
.brx-tp-slide-state.live{border-color:rgba(74,224,142,.3);background:rgba(74,224,142,.1);color:#4ae08e}
.brx-tp-slide-state.current{border-color:rgba(255,215,94,.3);background:rgba(255,215,94,.1);color:#ffd75e}
.brx-tp-slide-games{display:grid;gap:10px}
.brx-tp-slot{display:grid;min-height:0}
.brx-tp-leg{margin:0 2px 5px;color:#71877b;font-size:.5rem;font-weight:950;letter-spacing:.65px;text-transform:uppercase}
.brx-tp-next .brx-match{border-color:color-mix(in srgb,var(--club,#ffd75e) 42%,rgba(255,255,255,.08));box-shadow:0 0 0 1px color-mix(in srgb,var(--club,#ffd75e) 16%,transparent)}
/* :not(.live): sem ele este seletor (0,3,0) ganharia do .brx-match.live e o hover
   trocaria a borda verde de jogo rolando pela cor do clube */
.brx-team-frame .brx-match:not(.live):hover{border-color:color-mix(in srgb,var(--club,#ffd75e) 45%,rgba(255,255,255,.1))}
.brx-rmini{font-size:.55rem;font-weight:950;letter-spacing:.8px;text-transform:uppercase;color:#71877b}
.brx-favorite-picker-frame{max-width:620px;background:radial-gradient(700px 260px at 50% -110px,rgba(255,215,94,.15),transparent 68%),linear-gradient(180deg,#111c15,#0b1210)}
.brx-favorite-picker-head{margin:1px 42px 17px 2px}
.brx-favorite-picker-kicker{color:#ffd75e;font-size:.56rem;font-weight:950;letter-spacing:1.3px;text-transform:uppercase}
.brx-favorite-picker-head h3{margin:4px 0 5px;color:#fff;font-size:1.25rem;font-weight:950;line-height:1.12}
.brx-favorite-picker-head p{color:#8ba295;font-size:.68rem;font-weight:750;line-height:1.4}
.brx-favorite-picker-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.brx-favorite-option{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:96px;padding:11px 7px;border:1px solid rgba(255,255,255,.09);border-radius:11px;background:rgba(255,255,255,.035);color:#dcebe2;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.brx-favorite-option:hover{transform:translateY(-1px);border-color:rgba(255,215,94,.34);background:rgba(255,215,94,.07)}
.brx-favorite-option.selected{border-color:rgba(255,215,94,.52);background:rgba(255,215,94,.1);color:#fff}
.brx-favorite-option .brx-crest{width:38px;height:38px}
.brx-favorite-option span:last-child{font-size:.61rem;font-weight:900;line-height:1.18;text-align:center}
.brx-favorite-option .brx-favorite-check{position:absolute;top:7px;right:7px;display:grid;place-items:center;width:17px;height:17px;border-radius:50%;background:#ffd75e;color:#251b00;font-size:.65rem;font-weight:950}
/* nos cards do popup, o clube clicado fica em evidência (sem atropelar o cinza de derrota) */
.brx-team.tpfocus:not(.lose) .brx-team-name{color:#fff}
/* clube clicável: cursor + sublinhado no hover + foco visível pra teclado */
.brx-team-click,.brx-club-btn{cursor:pointer}
.brx-team-click:hover .brx-team-name{color:#fff}
.brx-team-click:hover .brx-team-name,.brx-club-btn:hover .brx-club-name,.brx-club-btn:hover .brv2-club-name{text-decoration:underline dotted;text-underline-offset:3px;text-decoration-thickness:1px}
.brx-team-click:focus-visible,.brx-club-btn:focus-visible{outline:3px solid rgba(255,223,0,.72);outline-offset:2px;border-radius:9px}
.brx-pop-round{text-align:center;font-size:.6rem;font-weight:950;letter-spacing:.9px;text-transform:uppercase;color:#71877b;margin:0 0 12px}
.brx-pop-head{display:flex;align-items:center;justify-content:center;gap:8px}
.brx-pop-name{flex:1;min-width:0;font-weight:900;font-size:.84rem;color:#dcebe2;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brx-pop-name.home{text-align:right}
.brx-pop-esc{flex:0 0 auto;display:inline-flex}
.brx-pop-esc .brx-logo,.brx-pop-esc .brx-logo-ph{width:34px;height:34px}
.brx-pop-score{min-width:52px;text-align:center;font-weight:950;font-size:1.42rem;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.brx-pop-score.live{color:#4ae08e}
.brx-pop-score .x{color:#5d7267;font-weight:700;font-size:1rem;margin:0 2px}
.brx-pop-status{text-align:center;font-size:.6rem;font-weight:950;letter-spacing:.7px;text-transform:uppercase;color:#71877b;margin:9px 0 2px}
.brx-pop-status.live{color:#4ae08e;display:flex;align-items:center;justify-content:center;gap:6px}
.brx-pop-status.live:before{content:"";width:6px;height:6px;border-radius:50%;background:#4ae08e;animation:brxPulse 1.2s ease-in-out infinite}
.brx-pop-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:14px}
.brx-pop-col{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px 5px 12px;min-height:84px}
.brx-pop-col.win{background:rgba(74,224,142,.07);border-color:rgba(74,224,142,.26)}
.brx-pop-cap{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:.62rem;font-weight:950;color:#c8d9ce;margin-bottom:10px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.brx-pop-col.win .brx-pop-cap{color:#4ae08e}
.brx-pop-cap .n{font-size:.6rem;font-weight:900;letter-spacing:.4px;text-transform:uppercase;color:#71877b}
.brx-pop-col.win .brx-pop-cap .n{color:#4ae08e}
.brx-pop-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 5px}
.brx-pchip{display:flex;flex-direction:column;align-items:center;gap:3px;width:56px}
/* a bolinha das iniciais carrega a cor dos pontos (mesma semântica do ranking) */
.brx-pav{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:950;background:rgba(255,255,255,.1);color:#cfe2d6;flex:0 0 auto}
.brx-pav.hit{background:linear-gradient(135deg,#ffd75e,#f0b53a);color:#241a00}
.brx-pav.ok{background:rgba(74,224,142,.16);color:#4ae08e;border:1px solid rgba(74,224,142,.4)}
.brx-pav.inv{background:rgba(255,122,112,.16);color:#ff8b82;border:1px solid rgba(255,122,112,.4)}
.brx-pchip.me .brx-pav{box-shadow:0 0 0 2px rgba(255,255,255,.75)}
.brx-pchip.me .brx-pnm{color:#fff}
.brx-pnm{font-size:.66rem;font-weight:800;color:#dcebe2;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brx-psc{font-size:.58rem;font-weight:900;color:#8ba295;font-variant-numeric:tabular-nums}
.brx-lgp{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.brx-lgdot{width:9px;height:9px;border-radius:50%;display:inline-block;background:rgba(255,255,255,.22)}
.brx-lgdot.hit{background:linear-gradient(135deg,#ffd75e,#f0b53a)}
.brx-lgdot.ok{background:#4ae08e}
.brx-lgdot.inv{background:#ff8b82}
.brx-pop-empty{font-size:.72rem;color:#5d7267;text-align:center;padding:6px 0}
.brx-pop-foot{margin-top:13px;text-align:center;font-size:.6rem;font-weight:800;color:#71877b;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
/* ranking */
.brx-rank{display:grid;gap:8px}
.brx-rank-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;column-gap:12px;row-gap:7px;padding:12px 14px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01))}
.brx-rank-row.me{border-color:rgba(255,215,94,.42);background:linear-gradient(180deg,rgba(255,215,94,.07),rgba(255,215,94,.015))}
.brx-rank-pos{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:950;font-size:.9rem;background:rgba(255,255,255,.07);color:#c8d9ce}
.brx-rank-pos.p1{background:linear-gradient(135deg,#ffd75e,#e8a616);color:#241a00;box-shadow:0 6px 18px rgba(255,215,94,.25)}
.brx-rank-pos.p2{background:linear-gradient(135deg,#dbe2ea,#96a5b4);color:#131a22}
.brx-rank-pos.p3{background:linear-gradient(135deg,#e2a06b,#a96430);color:#2b1300}
.brx-rank-main{min-width:0}
.brx-rank-name{display:flex;align-items:center;gap:8px;font-weight:900;font-size:.9rem;color:#eef5f0;min-width:0}
.brx-rank-name b{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brx-rank-name .you{flex:0 0 auto;font-size:.52rem;font-weight:950;letter-spacing:.6px;text-transform:uppercase;background:rgba(255,215,94,.16);color:#ffd75e;padding:3px 7px;border-radius:999px}
.brx-rank-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.brx-mchip{font-size:.56rem;font-weight:900;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:#8ba295;line-height:1}
.brx-mchip.g{color:#ffd75e;background:rgba(255,215,94,.1)}
.brx-mchip.v{color:#4ae08e;background:rgba(74,224,142,.1)}
.brx-mchip.r{color:#ff8b82;background:rgba(255,122,112,.12)}
.brx-rank-pts{font-weight:950;font-size:1.32rem;color:#4ae08e;display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums}
.brx-rank-pts span{font-size:.52rem;color:#71877b;text-transform:uppercase;letter-spacing:.5px;font-weight:900}
.brx-rank-bar{grid-column:1/-1;height:5px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
.brx-rank-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,rgba(0,168,81,.85),#4ae08e)}
.brx-empty-note{font-size:.66rem;color:#71877b;font-weight:800;text-align:center;padding:8px 0 2px}
/* tabela do returno (oficial + projeção pelos palpites) */
.brx-seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.brx-seg button{border:none;background:transparent;color:#9fb3a7;font-weight:950;font-size:.72rem;padding:8px 14px;border-radius:8px;cursor:pointer;line-height:1;transition:background .15s,color .15s}
.brx-seg button:hover{color:#dcebe2}
.brx-seg button.active{background:linear-gradient(120deg,#ffd75e,#f0b53a);color:#241a00;box-shadow:0 6px 16px rgba(255,215,94,.2)}
.brx-tbl-cta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 10px}
.brx-tbl-note{font-size:.74rem;color:#9db3a6;font-weight:800;line-height:1.5;margin:0 0 4px}
.brx-tbl-note b{color:#dcebe2}
.brx-tbl-wrap{overflow-x:auto;margin-top:8px;scrollbar-width:thin}
.brx-tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-variant-numeric:tabular-nums}
.brx-tbl th{font-size:.54rem;font-weight:950;text-transform:uppercase;letter-spacing:.7px;color:#71877b;text-align:center;padding:0 6px 2px;white-space:nowrap}
.brx-tbl th:nth-child(2){text-align:left;padding-left:12px}
.brx-tbl td{background:rgba(255,255,255,.028);border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06);padding:8px 6px;text-align:center;font-weight:850;font-size:.78rem;color:#c8d9ce;transition:background .15s}
.brx-tbl td:first-child{border-left:1px solid rgba(255,255,255,.06);border-radius:11px 0 0 11px;position:relative}
.brx-tbl td:last-child{border-right:1px solid rgba(255,255,255,.06);border-radius:0 11px 11px 0}
.brx-tbl td:nth-child(3){color:#fff;font-weight:950;font-size:.9rem}
.brx-tbl tbody tr:hover td{background:rgba(255,255,255,.055)}
.brx-tbl tbody tr{animation:brxRowIn .34s both;animation-delay:calc(var(--i,0)*16ms)}
@keyframes brxRowIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.brx-tr.zg4 td:first-child:before,.brx-tr.zz4 td:first-child:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:99px}
.brx-tr.zg4 td:first-child:before{background:#4ae08e}
.brx-tr.zz4 td:first-child:before{background:#ff7a70}
.brx-poswrap{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.brx-posn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.06);color:#c8d9ce;font-weight:950;font-size:.7rem}
.brx-tr.zg4 .brx-posn{background:rgba(74,224,142,.13);color:#4ae08e}
.brx-tr.zz4 .brx-posn{background:rgba(255,122,112,.13);color:#ff8b82}
.brx-tr.lider .brx-posn{background:linear-gradient(135deg,#ffd75e,#e8a616);color:#241a00;box-shadow:0 5px 14px rgba(255,215,94,.28)}
.brx-delta{font-size:.54rem;font-weight:950;line-height:1;color:#5d7267}
.brx-delta.up{color:#4ae08e}
.brx-delta.down{color:#ff8b82}
.brx-club{display:flex;align-items:center;gap:9px;min-width:0;text-align:left}
.brx-club .brx-crest,.brx-club .brx-logo-ph{width:24px;height:24px;font-size:.5rem}
.brx-club-name{font-weight:900;font-size:.8rem;color:#eef5f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brx-club .livedot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:#4ae08e;animation:brxPulse 1.2s ease-in-out infinite}
.brx-sgn.up{color:#4ae08e}
.brx-sgn.down{color:#ff8b82}
.brx-form{display:inline-flex;gap:4px;justify-content:center}
.brx-dot{width:9px;height:9px;border-radius:50%;background:currentColor;color:rgba(255,255,255,.1)}
.brx-dot.v{color:#4ae08e}
.brx-dot.e{color:#93a89d}
.brx-dot.d{color:#ff8b82}
.brx-dot.proj{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.brx-dot.live{animation:brxPulse 1.2s ease-in-out infinite}
.brx-link{color:#ffd75e;font-weight:900;cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}
@media(max-width:640px){
  .brx-tbl th:nth-child(8),.brx-tbl td:nth-child(8),.brx-tbl th:nth-child(9),.brx-tbl td:nth-child(9){display:none}
}
@media(max-width:470px){
  .brx-tbl th:nth-child(5),.brx-tbl td:nth-child(5),.brx-tbl th:nth-child(6),.brx-tbl td:nth-child(6),.brx-tbl th:nth-child(7),.brx-tbl td:nth-child(7){display:none}
  .brx-club-name{font-size:.74rem}
  .brx-tbl td{padding:8px 4px}
}
/* Tabela V2 do returno — prévia exclusiva para administradores. */
body.br-mode .tab .panel.brv2-page{padding:0;background:transparent;border:0;box-shadow:none}
body.br-mode .tab .card.brv2-shell{
  --brv2-accent:#4ae08e;
  position:relative;
  overflow:hidden;
  margin:0;
  padding:0;
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  background:linear-gradient(180deg,#111c15 0%,#09110d 100%);
  box-shadow:0 28px 76px rgba(0,0,0,.4);
}
body.br-mode .tab .card.brv2-shell.is-projected{--brv2-accent:#ffd75e}
.brv2-header{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:16px;
  align-items:center;
  padding:14px 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:
    radial-gradient(420px 160px at 88% -45%,rgba(74,224,142,.18),transparent 68%),
    linear-gradient(135deg,rgba(255,255,255,.035),transparent 60%);
}
.brv2-shell.is-projected .brv2-header{
  background:
    radial-gradient(420px 160px at 88% -45%,rgba(255,215,94,.15),transparent 68%),
    linear-gradient(135deg,rgba(255,255,255,.035),transparent 60%);
}
.brv2-heading{min-width:0}
.brv2-eyebrow{display:flex;align-items:center;margin-bottom:4px;font-size:.51rem;font-weight:950;letter-spacing:1px;text-transform:uppercase;color:#8ba295}
.brv2-preview{display:inline-flex;align-items:center;padding:3px 7px;border:1px solid rgba(255,215,94,.24);border-radius:999px;background:rgba(255,215,94,.07);color:#ffd75e;letter-spacing:.65px}
.brv2-titleline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brv2-title{margin:0;color:#fff;font-size:clamp(1.12rem,2.1vw,1.38rem);font-weight:950;line-height:1;letter-spacing:-.02em}
.brv2-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:#71877b;font-size:.59rem;font-weight:850;line-height:1.3}
.brv2-meta-live{display:inline-flex;align-items:center;gap:6px;color:#4ae08e;font-weight:950}
.brv2-meta-projected{color:#d7b84e;font-weight:950}
.brv2-meta-sep{color:#42564a}
.brv2-live-dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(74,224,142,.09);animation:brxPulse 1.4s ease-in-out infinite}
.brv2-switch{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:38px;
  min-width:132px;
  padding:8px 12px;
  border:1px solid #ffd75e;
  border-radius:9px;
  background:linear-gradient(120deg,#ffd75e,#efb63d);
  color:#251b00;
  font-size:.68rem;
  font-weight:950;
  line-height:1.15;
  box-shadow:0 8px 20px rgba(255,215,94,.13);
  transition:transform .16s ease,filter .16s ease,background .16s ease;
}
.brv2-switch:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}
.brv2-switch:active:not(:disabled){transform:translateY(0)}
.brv2-shell.is-projected .brv2-switch{border-color:rgba(74,224,142,.42);background:rgba(74,224,142,.1);color:#72eca4;box-shadow:none}
.brv2-switch-mark{font-size:.9rem;line-height:1}
.brv2-alert{margin:12px 18px 0;padding:9px 11px;border:1px solid rgba(255,215,94,.25);border-radius:9px;background:rgba(255,215,94,.07);color:#e8cc78;font-size:.67rem;font-weight:800;line-height:1.4}
.brv2-table-area{padding:14px 14px 18px}
.brv2-table-wrap{overflow:auto;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:rgba(0,0,0,.1);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.brv2-table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-variant-numeric:tabular-nums}
.brv2-table caption,.brv2-sr{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.brv2-table thead th{position:sticky;top:0;z-index:2;padding:11px 8px;border-bottom:1px solid rgba(255,255,255,.1);background:#101a14;color:#71877b;font-size:.54rem;font-weight:950;letter-spacing:.75px;text-align:center;text-transform:uppercase;white-space:nowrap}
.brv2-table thead th.brv2-col-club{text-align:left}
.brv2-table abbr{text-decoration:none}
.brv2-table tbody td,.brv2-table tbody th{height:53px;padding:8px;border-bottom:1px solid rgba(255,255,255,.065);background:rgba(255,255,255,.018);color:#bccdc3;font-size:.75rem;font-weight:820;text-align:center;transition:background .14s ease}
.brv2-table tbody th{font-weight:inherit}
.brv2-table tbody tr:last-child td,.brv2-table tbody tr:last-child th{border-bottom:0}
.brv2-table tbody tr:hover td,.brv2-table tbody tr:hover th{background:rgba(255,255,255,.045)}
.brv2-row.is-live td,.brv2-row.is-live th{background:rgba(74,224,142,.055)}
.brv2-table .brv2-col-pos{position:relative;width:72px}
.brv2-table .brv2-col-club{width:27%;text-align:left}
.brv2-table .brv2-col-points{width:52px;color:#fff;font-size:.94rem;font-weight:950}
.brv2-table .brv2-col-stat{width:42px}
.brv2-table .brv2-col-sg{width:48px}
.brv2-table .brv2-col-form{width:94px}
.brv2-row.zone-lib-group .brv2-col-pos:before,
.brv2-row.zone-lib-pre .brv2-col-pos:before,
.brv2-row.zone-sula .brv2-col-pos:before,
.brv2-row.zone-relegation .brv2-col-pos:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 4px 4px 0}
.brv2-row.zone-lib-group .brv2-col-pos:before{background:#60a5fa}
.brv2-row.zone-lib-pre .brv2-col-pos:before{background:#c4b5fd}
.brv2-row.zone-sula .brv2-col-pos:before{background:#fbbf24}
.brv2-row.zone-relegation .brv2-col-pos:before{background:#fb7185}
.brv2-position{display:flex;align-items:center;justify-content:center;gap:5px}
.brv2-pos-number{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.065);color:#d4e1d9;font-size:.72rem;font-weight:950}
.brv2-row.is-leader .brv2-pos-number{background:linear-gradient(135deg,#ffd75e,#e8a616);color:#251b00;box-shadow:0 5px 14px rgba(255,215,94,.22)}
.brv2-shell.is-projected .brv2-row.moved .brv2-pos-number{border:1px solid rgba(255,215,94,.34);color:#ffd75e}

.brv2-club-copy{display:flex;flex-direction:column;gap:3px;min-width:0}

.brv2-form-dot.v.projected{color:#4ae08e}.brv2-form-dot.e.projected{color:#82958a}.brv2-form-dot.d.projected{color:#ff7a70}

.brv2-footer{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 8px 0}

.brv2-zone{width:3px;height:14px;border-radius:999px}

.brv2-method{max-width:510px;color:#687d71;font-size:.6rem;font-weight:760;line-height:1.5;text-align:right}
.brv2-state{display:flex;min-height:350px;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:34px 20px;text-align:center}

}

}
.btn-save:active,.icon-btn:active,.btn-ok:active{transform:translateY(1px)}

/* NAV */
nav{
  position:sticky;
  top:0;
  z-index:5;
  background:rgba(255,253,244,.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  display:flex;
  overflow-x:auto;
  gap:4px;
  padding:8px max(10px,calc((100vw - 1120px)/2 + 10px));
  scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  min-width:0;
  flex:0 0 auto;
  background:transparent;
  border:1px solid transparent;
  padding:10px 12px;
  border-radius:8px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:.82rem;
  font-weight:850;
  transition:background .15s,color .15s,border-color .15s;
}
nav button.active{color:var(--blue);background:#fff;border-color:var(--border);box-shadow:0 6px 18px rgba(0,39,118,.08)}

/* CONTENT */
.tab{display:none;position:relative;z-index:1;padding:18px 14px 34px;max-width:1120px;margin:0 auto}
.tab.active{display:block}
.panel{background:rgba(255,253,244,.86);border:1px solid rgba(220,229,216,.9);border-radius:8px;padding:14px;box-shadow:var(--shadow)}
.card{background:var(--surface-2);border-radius:8px;border:1px solid var(--border);padding:14px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,39,118,.06)}
.card-title{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--blue);margin:4px 0 12px;font-weight:950}
.microcopy{font-size:.78rem;color:var(--muted);line-height:1.5}

/* HOME */
.home-dashboard{display:grid;gap:14px}
.home-spotlight{
  position:relative;
  overflow:hidden;
  display:grid;
  grid-template-columns:minmax(0,1.26fr) minmax(300px,.74fr);
  gap:14px;
  padding:16px;
  border:1px solid rgba(255,255,255,.48);
  border-radius:8px;
  color:#fff;
  background:
    linear-gradient(135deg,rgba(0,39,118,.96),rgba(0,95,47,.94)),
    linear-gradient(90deg,rgba(255,223,0,.16),transparent);
  box-shadow:0 22px 56px rgba(0,39,118,.22);
}
.home-spotlight:after{
  content:"";
  position:absolute;
  inset:auto 0 0 auto;
  width:58%;
  height:100%;
  background:linear-gradient(115deg,transparent 0 34%,rgba(255,255,255,.12) 34% 35%,transparent 35% 100%);
  pointer-events:none;
}
.home-copy,.home-prize-board{position:relative;z-index:1;min-width:0}
.home-kicker,.section-kicker{
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:1.2px;
  font-weight:950;
}
.home-actions{display:flex;gap:8px;flex-wrap:wrap}
.home-link-btn,.home-ghost-btn{
  border:1px solid rgba(255,255,255,.28);
  border-radius:8px;
  padding:10px 12px;
  font-size:.78rem;
  font-weight:950;
  white-space:nowrap;
}
.home-link-btn{background:var(--yellow);color:var(--blue);border-color:var(--yellow)}
.home-ghost-btn{background:rgba(255,255,255,.1);color:#fff}
.home-metrics{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(260px,.92fr);gap:8px;margin-top:12px;align-items:stretch}
.home-metric-stack{display:grid;gap:8px;min-width:0}
.home-metric{
  border:1px solid rgba(255,255,255,.18);
  border-radius:8px;
  padding:11px;
  background:rgba(255,255,255,.1);
  min-width:0;
}
.home-metric strong{display:block;font-size:1.3rem;line-height:1;font-weight:950;color:#fff}
.home-metric span{display:block;margin-top:5px;font-size:.65rem;text-transform:uppercase;letter-spacing:.55px;color:rgba(255,255,255,.76);font-weight:900}
.home-metric small{display:block;margin-top:7px;font-size:.71rem;line-height:1.4;color:rgba(255,255,255,.82);font-weight:750}
.home-metric.progress-metric{
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:flex-start;
  gap:9px;
}
.home-metric.progress-metric span{margin-top:0}
.progress-metric-main{
  width:100%;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
}
.progress-metric-ratio{
  display:block;
  font-size:1.92rem;
  letter-spacing:0;
  line-height:1;
}
.progress-metric-percent{

  color:#fff;
  font-size:1.2rem;
  font-weight:950;
  line-height:1;
  text-align:right;
}
.progress-metric-bar{

  border-radius:999px;

}
.progress-metric-bar:before{

}
.progress-metric-foot{
  width:100%;

  line-height:1.4;

}
.home-metric.compact-insight{

  justify-content:center;
  gap:4px;
}
.home-metric.compact-insight span{margin-top:0}
.home-metric strong.compact-insight-value{

  line-height:1.05;
}
.home-metric strong.position-value{

  font-size:1.58rem;
  line-height:1;

}

.home-metric strong.position-value.top-2{color:var(--silver)}

.position-help{

  flex-wrap:wrap;
  margin-top:8px;
}
.metric-inline-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.3);
  border-radius:999px;
  padding:6px 10px;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:.7rem;
  font-weight:900;
}
.home-copy-footer{margin-top:10px}
.metric-link{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:999px;
  padding:7px 10px;
  background:rgba(255,255,255,.1);
  color:#fff;
  font-size:.7rem;
  font-weight:900;
}
.prize-head{
  display:flex;

  justify-content:space-between;

}
.prize-head .home-copy-footer{

}
.home-prize-board{

  justify-content:space-between;
  gap:12px;
  padding:14px;
  border:1px solid rgba(255,255,255,.34);

  background:rgba(255,255,255,.12);
  backdrop-filter:blur(12px);

}
.prize-total .label{font-size:.66rem;text-transform:uppercase;letter-spacing:1px;font-weight:950;color:rgba(255,255,255,.76)}

.prize-split{display:grid;gap:10px}
.prize-row{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  gap:10px;

.prize-rank.silver,.prize-rank.bronze{font-size:1.95rem}
.prize-copy{min-width:0}
.prize-copy strong{display:block;font-size:.92rem;color:#fff;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prize-copy span{display:block;margin-top:4px;font-size:.66rem;color:rgba(255,255,255,.72);font-weight:850}

.prize-score span{display:block;margin-top:3px;font-size:.58rem;text-transform:uppercase;letter-spacing:.4px;color:rgba(255,255,255,.68);font-weight:900}
.home-layout{display:grid;grid-template-columns:minmax(0,.94fr) minmax(340px,1.06fr);gap:14px;align-items:start;min-width:0}
.home-side{display:grid;gap:14px}
.home-section{

  background:rgba(255,255,255,.92);
  border:1px solid rgba(220,229,216,.95);

.ranking-compact{min-height:0}

    radial-gradient(circle at 30% 28%,rgba(255,228,202,.92) 0 18%,transparent 19%),

  gap:12px;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  box-shadow:0 8px 20px rgba(0,39,118,.05);
}
/* O status (AO VIVO · 45' / Encerrado) flutua no canto superior direito; as
   linhas com status ganham uma faixa no topo para a partida centralizar logo
   abaixo sem colidir e sem espremer os nomes dos times. */
.fixture-status{position:absolute;top:9px;right:12px;display:flex}
.fixture-row.is-live,
.fixture-row.is-live-closed{padding-top:30px}
.fixture-meta{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:6px;
  min-width:0;
}
.fixture-date-inline{
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  line-height:1.1;
}
.fixture-date-inline .fixture-weekday{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:24px;
  padding:0 9px;
  border-radius:999px;
  background:#eef5ff;
  color:var(--blue);
  font-size:.61rem;
  font-weight:950;
  text-transform:uppercase;
  letter-spacing:.55px;
}
.fixture-date-inline .fixture-weekday-short{display:none}
.fixture-date-inline .fixture-day{
  font-size:.68rem;
  font-weight:900;
  color:#4f5f79;
  text-transform:uppercase;
  letter-spacing:.4px;
}
.fixture-time{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:30px;
  padding:6px 10px;
  border-radius:999px;
  background:#f4f8ff;
  color:var(--blue);
  font-size:.75rem;
  font-weight:950;
  line-height:1;
}
.fixture-phase{
  font-size:.6rem;
  text-transform:uppercase;
  letter-spacing:.7px;
  color:var(--muted);
  font-weight:900;
  white-space:nowrap;
  line-height:1;
}
.fixture-match{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  gap:10px;
  min-width:0;
}
.fixture-row .team{
  font-size:.95rem;
  font-weight:850;
}
.fixture-row .team.r{justify-content:flex-end;text-align:right}
.fixture-row .flag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:1.15em;
  text-align:center;
}
.fixture-row .team-name{
  white-space:nowrap;
  line-height:1.2;
}
.fixture-vs{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:30px;
  min-height:30px;
  padding:3px 8px;
  border-radius:999px;
  background:#f2f5f9;
  color:var(--muted);
  font-size:.78rem;
  font-weight:950;
  line-height:1;
  letter-spacing:.3px;
}
.fixture-row.is-result .fixture-vs{
  min-width:auto;
  padding:4px 12px;
  background:#edf9f0;
  color:var(--green);
  font-size:.92rem;
}
.fixture-meta-time{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.fixture-row.is-live{
  border-color:#7ed1a1;
  background:linear-gradient(180deg,#f4fff7,#fff);
  box-shadow:0 0 0 3px rgba(16,185,129,.10),0 14px 32px -16px rgba(0,132,61,.32);
}
.fixture-row.is-live .fixture-vs{
  min-width:auto;
  padding:4px 13px;
  background:#e6fbef;
  color:var(--green-2,#047857);
  border:1px solid #b7e7c9;
  font-size:.96rem;
}
.fixture-row.is-live-closed{
  border-color:#cbe4d2;
  background:linear-gradient(180deg,#f7fbf7,#fff);
}
.fixture-row.is-live-closed .fixture-vs{
  min-width:auto;
  padding:4px 12px;
  background:#eef6f0;
  color:#3f6b51;
  font-size:.92rem;
}
.fixture-live-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 9px;
  border-radius:999px;
  background:#ecfdf5;
  border:1px solid rgba(16,185,129,.4);
  color:#047857;
  font-size:.6rem;
  font-weight:950;
  letter-spacing:.5px;
  text-transform:uppercase;
  line-height:1;
  white-space:nowrap;
}
.fixture-live-pill i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#10b981;
  animation:fixtureLivePulse 1.4s ease-in-out infinite;
}
.fixture-live-pill.closed{
  background:#f1f5f4;
  border-color:#cbd6cf;
  color:#3f6b51;
}
@keyframes fixtureLivePulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.55);opacity:.5}}
.kicker-live-dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#10b981;
  margin-right:6px;
  box-shadow:0 0 0 3px rgba(16,185,129,.22);
  animation:fixtureLivePulse 1.4s ease-in-out infinite;
  vertical-align:middle;
}
.fixture-empty{
  padding:14px;
  border:1px dashed #c9d5c7;
  border-radius:8px;
  background:#fbfff8;
  color:var(--muted);
  font-size:.8rem;
  font-weight:850;
}
.brazil-table{display:grid;gap:6px;overflow-x:auto;padding-bottom:2px;flex:1}
.brazil-row{
  display:grid;
  grid-template-columns:22px minmax(128px,1fr) 42px repeat(7,31px);
  gap:3px;
  align-items:center;
  padding:8px 8px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
  font-size:.75rem;
  min-width:492px;
}
.brazil-row.head{
  background:#f2f7ef;
  color:var(--muted);
  font-size:.58rem;
  text-transform:uppercase;
  letter-spacing:.45px;
  font-weight:950;
}
.brazil-row.brazil-highlight{border-color:#a7d8b4;background:#f3fff5}
.brazil-row .team-cell{font-size:.78rem;gap:5px}
.brazil-row strong{color:var(--green);font-weight:950}
.brazil-next{
  margin-top:10px;
  padding:10px;
  border:1px solid #d8e5ff;
  border-radius:8px;
  background:#f7fbff;
  font-size:.78rem;
  color:#31415f;
  line-height:1.45;
}
/* Brasil no mata-mata (Início) */
.brazil-ko{display:flex;flex-direction:column;gap:12px;flex:1}
.bk-next{
  border:1px solid #cfe3d6;
  border-radius:12px;
  background:linear-gradient(180deg,#f3fff5,#ffffff);
  padding:14px 15px;
}
.bk-next-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bk-next-phase{
