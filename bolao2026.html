// Auto-scroll ao abrir a aba Jogos: pula direto pro dia atual quando já
// existem dias anteriores acima (conforme a Copa avança, evita o scrollzão).
function copaAutoScrollToCurrent(){
  requestAnimationFrame(()=>{
    const days=document.querySelectorAll("#tab-jogos .copa-games-day");
    const cur=document.querySelector("#tab-jogos .copa-games-day.is-current");
    if(cur&&days.length&&days[0]!==cur) scrollCopaToCurrent(false);
  });
}
let copaTodayObserver=null;
// FAB "Jogos de hoje": aparece quando o dia atual sai da tela.
function setupCopaTodayFab(){
  if(copaTodayObserver){copaTodayObserver.disconnect();copaTodayObserver=null;}
  const fab=document.getElementById("copaTodayFab");
  if(!fab) return;
  const target=document.querySelector("#tab-jogos .copa-games-day.is-current");
  if(!target){fab.classList.remove("show");return;}
  copaTodayObserver=new IntersectionObserver(entries=>{
    const e=entries[0];
    fab.classList.toggle("show",!e.isIntersecting);
    const dir=fab.querySelector(".copa-today-fab-dir");
    if(dir) dir.textContent=e.boundingClientRect.top<0?"↑":"↓";
  },{rootMargin:"-64px 0px 0px 0px"});
  copaTodayObserver.observe(target);
}
// Mede a altura do menu de abas (nav sticky) e expõe como --copa-nav-h, usado
// pelo top: da barra de fases sticky pra ela grudar exatamente abaixo da nav.
function updateCopaNavOffset(){
  const nav=document.querySelector("nav");
  const h=nav?Math.round(nav.getBoundingClientRect().height):56;
  document.documentElement.style.setProperty("--copa-nav-h",h+"px");
}
if(typeof window!=="undefined"&&!window.__copaNavOffsetBound){
  window.__copaNavOffsetBound=true;
  window.addEventListener("resize",updateCopaNavOffset);
}
function renderJogos(){
  const koAvailable=groupPhaseComplete();
  // "Ir para hoje"/FAB miram o dia atual da seção em foco (mata-mata quando já
  // montado, senão grupos) — é onde o destaque "is-current" é renderizado.
  const primaryGames=koAvailable?copaKoVisibleGames():copaGroupVisibleGames();
  const hasCurrentDay=!!copaCurrentDayKey(primaryGames);
  const h=`<div class="copa-games-page v2">
    <section class="copa-games-shell">
      ${renderCopaMetrics(copaMetricsGames())}
      <div class="copa-games-toolbar">
        <input class="txt-inp" type="search" placeholder="Buscar seleção ou jogo" value="${esc(jogosSearch)}" oninput="jogosSearch=this.value;renderJogos()">
        <select class="txt-select" onchange="jogosStatusFilter=this.value;renderJogos()">
          ${[["all","Todos"],["open","Programados"],["live","Ao vivo"],["finished","Apurados"],["pending","Pendentes"]].map(([value,label])=>`<option value="${value}" ${jogosStatusFilter===value?"selected":""}>${label}</option>`).join("")}
        </select>
        ${hasCurrentDay?`<button class="action-btn copa-today-btn" onclick="scrollCopaToCurrent(true)">Ir para hoje</button>`:""}
        <button class="action-btn secondary" onclick="jogosSearch='';jogosStatusFilter='all';renderJogos()">Limpar filtros</button>
      </div>
      ${isOnlineMode()&&!isAdmin()?`<div class="ko-note">Os resultados oficiais ficam bloqueados para participantes. Você pode acompanhar aqui e preencher seus palpites na aba Palpites.</div>`:""}
      ${!koAvailable?`<div class="ko-note">O mata-mata será montado automaticamente quando todos os resultados da fase de grupos forem preenchidos.</div>`:""}
      ${renderCopaGamesList()}
    </section>
    <button type="button" id="copaTodayFab" class="copa-today-fab" onclick="scrollCopaToCurrent(true)"><span class="copa-today-fab-dir" aria-hidden="true">↓</span>Jogos de hoje</button>
  </div>`;
  // O re-render troca o innerHTML; preserva o foco/cursor da busca pra não
  // interromper a digitação.
  const searchSel="#tab-jogos .copa-games-toolbar .txt-inp[type='search']";
  const searchHadFocus=document.activeElement&&document.activeElement===document.querySelector(searchSel);
  document.getElementById("tab-jogos").innerHTML=h;
  if(searchHadFocus){
    const inp=document.querySelector(searchSel);
    if(inp){
      inp.focus();
      const end=inp.value.length;
      try{inp.setSelectionRange(end,end);}catch(_e){}
    }
  }
  setupCopaTodayFab();
  updateCopaNavOffset();
  // Mantém o chip de fase ativo visível dentro do seletor de cada gaveta.
  document.querySelectorAll("#tab-jogos .copa-archive-filter").forEach(wrap=>{
    const active=wrap.querySelector(".fbtn.active");
    if(active) wrap.scrollLeft=Math.max(0,active.offsetLeft-(wrap.clientWidth-active.offsetWidth)/2);
  });
}
function copaSelfPickOthersHTML(game,liveRes){
  const myIdx=myParticipantIndex();
  const rows=S.participants.map((name,i)=>({i,name}))
    .filter(p=>!Number.isInteger(myIdx)||p.i!==myIdx)
    .map(p=>{
      const pal=S.palpites[`${p.i}_${game.id}`]||{};
      const has=hasScore(pal);
      const d=has&&liveRes?scoreDetails(pal,liveRes,game):null;
      return {...p,pal,has,pts:d?.pts};
    })
    .sort((a,b)=>{
      const ap=Number.isFinite(a.pts)?a.pts:-Infinity;
      const bp=Number.isFinite(b.pts)?b.pts:-Infinity;
      if(ap!==bp) return bp-ap;
      if(a.has!==b.has) return a.has?-1:1;
      return String(a.name).localeCompare(String(b.name),"pt-BR");
    });
  if(!rows.length) return "";
  return `<div class="copa-self-pick-others">
    <div class="copa-self-pick-others-head">Palpites dos outros</div>
    <div class="copa-self-pick-others-list">
      ${rows.map(r=>copaLivePalpiteRowHTML(game,r.i,liveRes,{hidePts:!liveRes})).join("")}
    </div>
  </div>`;
}
function copaSelfPickHTML(game){
  const myIdx=myParticipantIndex();
  const started=!!(game.utc&&new Date()>=new Date(game.utc));
  const res=S.results[game.id];
  const isLiveState=!res&&copaGameState(game)==="live";
  const liveRes=isLiveState?liveProvisionalResult(game):null;
  // Oficial manda; ao vivo entra como parcial. Serve tanto pro badge do "Seu
  // palpite" quanto pra pontuar o dropdown dos outros (ao vivo OU encerrado).
  const scoringRes=res||liveRes;
  // O PRÓPRIO palpite aparece SEMPRE na aba Jogos (igual à fase de grupos). O dos
  // OUTROS só entra no momento certo: grupos = aberto; mata-mata = quando a FASE
  // encerra (koOthersRevealed: 30 min antes do 1º jogo da fase) — igual à aba
  // Palpites e ao RLS. Antes do fechamento, fica só o "Seu palpite" (sem dropdown).
  const othersHTML=(game.ko&&!koOthersRevealed(game))?"":copaSelfPickOthersHTML(game,scoringRes);
  // Verde = ao vivo; dourado = encerrado/apurado; azul = ainda sem placar (grupo futuro).
  const variantCls=isLiveState?"":(started?"final":"upcoming");
  if(!Number.isInteger(myIdx)){
    if(!othersHTML) return "";
    return `<details class="copa-self-pick-wrap" data-game-id="${esc(game.id)}"${copaOpenPickGames.has(game.id)?" open":""}>
      <summary class="copa-self-pick has-chev solo ${variantCls}">
        <span class="copa-self-pick-label">Palpites dos outros</span>
        <span class="copa-self-pick-chev" aria-hidden="true">▾</span>
      </summary>
      ${othersHTML}
    </details>`;
  }
  const pal=S.palpites[`${myIdx}_${game.id}`]||{};
  const has=hasScore(pal);
  let badgeHTML="";
  let bodyHTML;
  if(has){
    const tied=game.ko&&+pal.s1===+pal.s2;
    const advancer=tied&&pal.koWinner?`${teamFlag(pal.koWinner)} ${esc(pal.koWinner)} passa`:"";
    bodyHTML=`<span class="copa-self-pick-score"><b>${esc(pal.s1)}</b><span>×</span><b>${esc(pal.s2)}</b></span>
      ${advancer?`<span class="copa-self-pick-adv">${advancer}</span>`:""}`;
    if(scoringRes){
      const d=scoreDetails(pal,scoringRes,game);
      if(d){
        const cls=d.exact?"hit":d.pts>0?"good":d.pts===-2?"bad":"zero";
        const lbl=d.exact?`Cravou +${d.pts}`:d.pts>0?`+${d.pts}`:d.pts===-2?"−2":"0";
        badgeHTML=`<span class="copa-self-pick-badge ${cls}">${esc(lbl)}</span>`;
      }
    }else if(started){
      badgeHTML=`<span class="copa-self-pick-badge pending">Aguardando apuração</span>`;
    }
  }else{
    bodyHTML=`<span class="copa-self-pick-empty">Sem palpite registrado</span>`;
  }
  // Sem ninguém pra comparar (só eu de participante) → pill estática, sem dropdown.
  if(!othersHTML){
    return `<div class="copa-self-pick">
      <span class="copa-self-pick-label">Seu palpite</span>
      ${bodyHTML}
      ${badgeHTML}
    </div>`;
  }
  return `<details class="copa-self-pick-wrap" data-game-id="${esc(game.id)}"${copaOpenPickGames.has(game.id)?" open":""}>
    <summary class="copa-self-pick has-chev ${variantCls}">
      <span class="copa-self-pick-label">Seu palpite</span>
      ${bodyHTML}
      ${badgeHTML}
      <span class="copa-self-pick-chev" aria-hidden="true">▾</span>
    </summary>
    ${othersHTML}
  </details>`;
}
function copaLivePtsLabel(d){
  if(!d) return {cls:"none",text:"—"};
  if(d.exact) return {cls:"hit",text:`+${d.pts} cravou`};
  if(d.pts>0) return {cls:"good",text:`+${d.pts}`};
  if(d.pts===-2) return {cls:"bad",text:"−2 inv."};
  return {cls:"zero",text:"0"};
}
function copaLivePalpiteRowHTML(game,pi,liveRes,opts){
  opts=opts||{};
  const pal=S.palpites[`${pi}_${game.id}`]||{};
  const has=hasScore(pal);
  const d=has&&liveRes?scoreDetails(pal,liveRes,game):null;
  const pts=copaLivePtsLabel(d);
  const tied=game.ko&&has&&+pal.s1===+pal.s2;
  const advancer=tied&&pal.koWinner?`${teamFlag(pal.koWinner)} ${pal.koWinner} passa`:"";
  const name=esc(S.participants[pi]||`Participante ${pi+1}`);
  const scoreCell=has
    ? `<span class="copa-live-pal-score"><b>${esc(pal.s1)}</b><span>×</span><b>${esc(pal.s2)}</b></span>`
    : `<span class="copa-live-pal-score empty">— × —</span>`;
  const advCell=advancer?`<span class="copa-live-pal-adv">${esc(advancer)}</span>`:"";
  const meCls=opts.me?"is-me":"";
  // Sem placar ainda (jogo de grupo que não começou) → esconde a coluna de pontos.
  const showPts=!opts.hidePts;
  return `<div class="copa-live-pal-row ${meCls} ${showPts?"":"no-pts"}">
    <span class="copa-live-pal-name">${name}${opts.me?` <small>(você)</small>`:""}</span>
    <span class="copa-live-pal-pick">${scoreCell}${advCell}</span>
    ${showPts?`<span class="copa-live-pal-pts ${pts.cls}">${esc(pts.text)}</span>`:""}
  </div>`;
}
function copaPredictionsExportAllowed(game){
  return !game.ko||koOthersRevealed(game);
}
function copaPredictionsWhatsAppText(game){
  const teams=gameTeams(game);
  const flag1=teamFlag(teams.t1);
  const flag2=teamFlag(teams.t2);
  const matchup=[teams.t1,flag1,"x",flag2,teams.t2].filter(Boolean).join(" ");
  const picks=S.participants.map((name,i)=>{
    const pal=S.palpites[`${i}_${game.id}`]||{};
    if(!hasScore(pal)) return "";
    const tied=game.ko&&+pal.s1===+pal.s2;
    const advancer=tied&&pal.koWinner
      ? ` → ${[teamFlag(pal.koWinner),pal.koWinner,"passa"].filter(Boolean).join(" ")}`
      : "";
    return `@${name} ${flag1} ${pal.s1}x${pal.s2} ${flag2}${advancer}`.replace(/\s+/g," ").trim();
  }).filter(Boolean);
  if(!picks.length) return "";
  return [matchup,"",...picks].join("\n");
}
function fallbackCopyText(text){
  const area=document.createElement("textarea");
  area.value=text;
  area.setAttribute("readonly","");
  area.style.position="fixed";
  area.style.opacity="0";
  document.body.appendChild(area);
  area.select();
  let copied=false;
  try{copied=document.execCommand("copy");}catch(_e){}
  area.remove();
  return copied;
}
async function copyGamePredictions(gameId,button){
  const game=gameById(gameId);
  if(!game) return;
  if(!copaPredictionsExportAllowed(game)){
    toast("Os palpites serão liberados no fechamento da fase.");
    return;
  }
  const text=copaPredictionsWhatsAppText(game);
  if(!text){
    toast("Ainda não há palpites registrados para este jogo.");
    return;
  }
  let copied=false;
  if(navigator.clipboard&&window.isSecureContext){
    try{await navigator.clipboard.writeText(text);copied=true;}catch(_e){}
  }
  if(!copied) copied=fallbackCopyText(text);
  if(!copied){
    toast("Não foi possível copiar os palpites.");
    return;
  }
  toast("Palpites copiados para o WhatsApp.");
  if(button){
    const original=button.innerHTML;
    button.innerHTML="✓ Copiado";
    button.classList.add("is-copied");
    setTimeout(()=>{
      if(!button.isConnected) return;
      button.innerHTML=original;
      button.classList.remove("is-copied");
    },1800);
  }
}
function renderGameRow(game){
  const res=S.results[game.id];
  const teams=gameTeams(game);
  const t1=teams.t1;
  const t2=teams.t2;
  const canEdit=canEditResults();
  const state=copaGameState(game);
  const disabled=game.ko&&!teams.ready;
  const draft=resultDrafts[game.id]||{s1:0,s2:0};
  const liveScore=copaLiveScoreForGame(game);
  const liveMinute=liveScore?copaLiveMinuteLabel(liveScore):"";
  const liveActive=liveScore&&copaLiveIsActive(liveScore);
  const livePens=liveScore?copaLivePensSuffix(liveScore):"";
  const isLiveState=!res&&state==="live";
  const selfPickHTML=copaSelfPickHTML(game);
  const scoreCoreHTML=res
    ? copaScoreHTML(res.s1,res.s2)
    : liveScore
      ? copaScoreHTML(liveScore.goals_home,liveScore.goals_away)
      : `<span class="copa-versus">x</span>`;
  const mainScoreHTML=`<div class="copa-primary-score"><div class="copa-score-stage">${scoreCoreHTML}</div>${selfPickHTML}</div>`;
  let stateTagLabel=copaGameStateLabel(game);
  if(state==="live"){
    const minuteExtra=liveMinute&&!/^ao vivo$/i.test(liveMinute)?` · ${liveMinute}`:"";
    stateTagLabel=`Ao vivo${minuteExtra}${livePens}`;
  }
  let sidePanelHTML="";
  if(res){
    const outcome=koOutcomeLabel(game,res,teams);
    sidePanelHTML=`<div class="copa-side-panel">
      <div class="copa-side-row"><span class="copa-side-label">Resultado</span><span class="copa-side-result ok">Apurado</span></div>
      ${outcome?`<div class="advancer-badge">${esc(outcome)}</div>`:""}
      ${resultDetailHTML(game,res,teams)}
      ${canEdit?`<div class="copa-actions"><button class="copa-mini-action danger" onclick="clearRes(${jsAttr(game.id)})">Remover</button></div>`:""}
    </div>`;
  }else if(canEdit){
    // Quando o jogo está ao vivo, o pill da esquerda já traz "Ao vivo · 23'" — só mostra a linha do robô quando ele já encerrou e ainda falta apurar.
    const robotClosedLabel=liveScore&&liveScore.status_long&&/^Conferir:/i.test(String(liveScore.status_long))
      ? liveScore.status_long
      : "Encerrado"+livePens;
    const liveInfoHTML=liveScore&&!liveActive
      ? `<div class="copa-side-row"><span class="copa-side-label">Robô</span><span class="copa-side-result warn">${esc(robotClosedLabel)}</span></div>`
      : "";
    sidePanelHTML=`<div class="copa-side-panel">
      ${liveInfoHTML}
      <div class="copa-editor">
        <span class="copa-side-label">Placar oficial</span>
        <div class="score-wrap">
          ${scoreControl(`r1_${game.id}`,draft.s1,`setResDraft(${jsAttr(game.id)},1,this.value)`,"0","oninput",disabled)}
          <span class="ssep">×</span>
          ${scoreControl(`r2_${game.id}`,draft.s2,`setResDraft(${jsAttr(game.id)},2,this.value)`,"0","oninput",disabled)}
        </div>
        ${koAdvancerControl(game,teams,draft,disabled)}
        <div class="copa-actions"><button class="copa-mini-action primary" ${disabled?"disabled":""} onclick="confirmRes(${jsAttr(game.id)})">Salvar</button></div>
      </div>
    </div>`;
  }else{
    // Não-admin durante o ao vivo: o pill da esquerda já mostra "Ao vivo · 23'", e o palpite + dropdown ficam na pill central. Sem painel lateral.
    if(liveScore&&liveActive){
      sidePanelHTML="";
    }else{
      const pendingCls=state==="live"?"live":state==="closed"?"warn":"empty";
      const pendingLabel=liveScore
        ? "Encerrado · aguardando apuração"
        : state==="live"?"Aguardando placar ao vivo":state==="closed"?"Falta apurar":"Aguardando placar";
      sidePanelHTML=`<div class="copa-side-panel">
        <div class="copa-side-row"><span class="copa-side-label">Resultado</span></div>
        <div class="copa-side-result ${pendingCls}">${esc(pendingLabel)}</div>
      </div>`;
    }
  }
  const noSidePanel=!sidePanelHTML;
  const cardCls=["copa-game",`is-${state}`,disabled?"is-locked":"",noSidePanel?"is-noside":""].filter(Boolean).join(" ");
  const exportAllowed=copaPredictionsExportAllowed(game);
  const exportTitle=exportAllowed
    ?"Copiar os palpites deste jogo para o WhatsApp"
    :"Disponível quando os palpites desta fase forem liberados";
  return `<article class="${cardCls}" data-tournament="copa" data-game-id="${esc(game.id)}">
    <div class="copa-meta">
      <div class="copa-state-tag ${state}">${esc(stateTagLabel)}</div>
      <div class="copa-time">${esc(game.time||"--:--")}</div>
      <div class="copa-round">${esc(copaRoundLabel(game))}</div>
      <div class="copa-game-id">${esc(game.id)}</div>
      <button type="button" class="copa-share-btn" title="${esc(exportTitle)}" aria-label="${esc(exportTitle)}" onclick="copyGamePredictions(${jsAttr(game.id)},this)" ${exportAllowed?"":"disabled"}><span aria-hidden="true">↗</span> WhatsApp</button>
    </div>
    <div class="copa-matchline">
      ${copaTeamHTML(t1,"home",!teams.ready)}
      ${mainScoreHTML}
      ${copaTeamHTML(t2,"away",!teams.ready)}
    </div>
    ${sidePanelHTML}
  </article>`;
}
function koAdvancerControl(game,teams,draft,disabled){
  if(!game.ko) return "";
  const tied=Number(draft.s1)===Number(draft.s2);
  const visible=koAdvancerVisible(draft);
  const selectDisabled=disabled||!visible;
  const selected=koOutcomeValue(draft.koWinner,draft.koDecision);
  return `<div class="ko-advancer ${visible?"":"hidden"} ${tied?"":"muted"}" id="advwrap_${game.id}">
    <label for="adv_${game.id}">Empate: como foi decidido?</label>
    <select class="txt-select" id="adv_${game.id}" onchange="setResTiebreak('${game.id}',this.value)" ${selectDisabled?"disabled":""}>
      <option value="">Selecione o desempate</option>
      ${koOutcomeOptions(teams,selected)}
    </select>
  </div>`;
}
function koAdvancerVisible(draft){
  return Number(draft.s1)===Number(draft.s2)&&Boolean(draft.touched||draft.showKoAdvancer||draft.koWinner||draft.koDecision);
}
function koOutcomeValue(team,decision){
  const cleanTeam=norm(team);
  const cleanDecision=normalizeKoDecision(decision);
  return cleanTeam&&cleanDecision?`${cleanDecision}::${cleanTeam}`:"";
}
function koAdvancerValue(team){
  return norm(team);
}
function parseKoAdvancerValue(value){
  const raw=String(value||"");
  const parsed=parseKoOutcomeValue(raw);
  return parsed.koWinner||norm(raw);
}
function parseKoOutcomeValue(value){
  const raw=String(value||"");
  const cut=raw.indexOf("::");
  if(cut<0) return {koWinner:"",koDecision:""};
  return {koDecision:normalizeKoDecision(raw.slice(0,cut)),koWinner:norm(raw.slice(cut+2))};
}
function koOutcomeOptions(teams,selected){
  return [teams.t1,teams.t2].filter(Boolean).flatMap(team=>{
    return KO_DECISIONS.map(([decision,label])=>{
      const value=koOutcomeValue(team,decision);
      return `<option value="${esc(value)}" ${selected===value?"selected":""}>${esc(teamFlag(team)+" "+team)} passa ${esc(label)}</option>`;
    });
  }).join("");
}
function setJGroupFilter(k){jGroupFilter=k;renderJogos();}
function setJKoFilter(k){jKoFilter=k;renderJogos();}
function setResDraft(id,w,v){
  if(!resultDrafts[id]) resultDrafts[id]={s1:0,s2:0};
  const n=parseInt(v,10);
  const draft=resultDrafts[id];
  draft[w===1?"s1":"s2"]=!Number.isNaN(n)&&n>=0?Math.min(30,n):0;
  draft.touched=true;
  draft.showKoAdvancer=gameById(id)?.ko&&Number(draft.s1)===Number(draft.s2);
  updateKoAdvancerControl(id);
}
function setResTiebreak(id,value){
  if(!resultDrafts[id]) resultDrafts[id]={s1:0,s2:0};
  Object.assign(resultDrafts[id],parseKoOutcomeValue(value));
}
function updateKoAdvancerControl(id){
  const game=gameById(id);
  if(!game?.ko) return;
  const draft=resultDrafts[id]||{s1:0,s2:0};
  const tied=Number(draft.s1)===Number(draft.s2);
  const visible=koAdvancerVisible(draft);
  const wrap=document.getElementById(`advwrap_${id}`);
  const select=document.getElementById(`adv_${id}`);
  if(wrap){
    wrap.classList.toggle("hidden",!visible);
    wrap.classList.toggle("muted",!tied);
  }
  if(select){
    select.disabled=!visible;
    if(!tied) select.value="";
  }
  if(!tied){
    delete draft.koWinner;
    delete draft.koDecision;
  }
}
function confirmRes(id){
  if(!canEditResults()){toast("Só o administrador altera resultados.");render(activeTab);return;}
  const game=gameById(id);
  const teams=gameTeams(game);
  if(game.ko&&!teams.ready){toast("Complete os jogos anteriores para liberar este confronto.");return;}
  const rawS1=parseInt(document.getElementById(`r1_${id}`)?.value,10);
  const rawS2=parseInt(document.getElementById(`r2_${id}`)?.value,10);
  if(Number.isNaN(rawS1)||Number.isNaN(rawS2)||rawS1<0||rawS2<0){toast("Placar inválido.");return;}
  const s1=Math.min(30,rawS1);
  const s2=Math.min(30,rawS2);
  const result={s1,s2};
  if(game.ko&&s1===s2){
    const selected=parseKoOutcomeValue(document.getElementById(`adv_${id}`)?.value||koOutcomeValue(resultDrafts[id]?.koWinner,resultDrafts[id]?.koDecision));
    if(![teams.t1,teams.t2].includes(selected.koWinner)||!koDecisionLabel(selected.koDecision)){
      if(!resultDrafts[id]) resultDrafts[id]={s1,s2};
      Object.assign(resultDrafts[id],{s1,s2,touched:true,showKoAdvancer:true});
      updateKoAdvancerControl(id);
      toast("Escolha como o empate foi decidido.");
      return;
    }
    result.koWinner=selected.koWinner;
    result.koDecision=selected.koDecision;
  }
  S.results[id]=result;
  delete resultDrafts[id];
  const clearedIds=clearDependentKnockouts(id);
  save();
  saveResultRemote(id);
  // Propaga a cascata de deleção ao Supabase para evitar que o poll ressuscite resultados inválidos
  if(remoteClient&&isAdmin()&&clearedIds.length){
    remoteWrite(()=>remoteClient.from("results").delete().in("game_id",clearedIds));
  }
  toast("Resultado salvo.");
  render(activeTab);
}
// Retorna array de game_ids deletados para que o chamador possa propagá-los ao Supabase
function clearDependentKnockouts(id){
  const order=["R32","R16","QF","SF","P3","FINAL"];
  const prefix=id.split("_")[0];
  const idx=order.indexOf(prefix);
  const cleared=[];
  if(idx<0&&id!=="P3"&&id!=="FINAL"){
    if(id.startsWith("G")){
      koGames().forEach(g=>{
        if(S.results[g.id]) cleared.push(g.id);
        delete S.results[g.id];
        delete resultDrafts[g.id];
      });
    }
    return cleared;
  }
  const start=idx<0?order.length:idx+1;
  koGames().forEach(g=>{
    const gp=g.id.split("_")[0];
    if(order.indexOf(gp)>=start){
      if(S.results[g.id]) cleared.push(g.id);
      delete S.results[g.id];
      delete resultDrafts[g.id];
    }
  });
  return cleared;
}
function clearRes(id){
  if(!canEditResults()){toast("Só o administrador altera resultados.");render(activeTab);return;}
  if(!confirm("Remover este resultado?")) return;
  delete S.results[id];
  resultDrafts[id]={s1:0,s2:0};
  const clearedOnRemove=clearDependentKnockouts(id);
  save();
  deleteResultRemote(id);
  // Propaga a cascata ao Supabase
  if(remoteClient&&isAdmin()&&clearedOnRemove.length){
    remoteWrite(()=>remoteClient.from("results").delete().in("game_id",clearedOnRemove));
  }
  render(activeTab);
}

function palInitials(name){
  if(!name) return "?";
  const parts=String(name).trim().split(/\s+/);
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}

function predictionStateId(scope,pi,gid){
  return `predictionState_${scope}_${pi}_${gid}`;
}
function predictionStateChipsHTML(key,game,pal,opts={}){
  const complete=isPredictionComplete(game,pal);
  const closed=predictionDeadlineClosed(game);
  const chips=[];
  if(complete){
    let cls="valid";
    let label="Salvo";
    let title="Palpite completo e salvo.";
    if(pendingPredictionWrites.has(key)){
      cls="saving";
      label="Salvando";
      title="Palpite válido, aguardando confirmação online.";
    }else if(isOnlineMode()&&dirtyPredictionKeys.has(key)){
      cls="local";
      label="Salvo local";
      title="Palpite válido, salvo neste navegador e aguardando sincronização.";
    }
    chips.push(`<span class="pal-state-chip ${cls}" title="${esc(title)}"><span class="dot"></span>${esc(label)}</span>`);
  }
  if(closed){
    if(game&&game.ko&&koPhaseLockReason(game.phaseKey)==="before"){
      const hint=KO_OPEN_HINT[game.phaseKey]||"quando a fase anterior encerrar";
      chips.push(`<span class="pal-state-chip closed" title="${esc("Abre "+hint+".")}"><span class="dot"></span>Aguardando liberação</span>`);
    }else{
      const label=formatPredictionDeadline(predictionDeadlineMs(game));
      const title=label?`Prazo encerrado em ${label}.`:"Prazo encerrado.";
      chips.push(`<span class="pal-state-chip closed" title="${esc(title)}"><span class="dot"></span>Prazo encerrado</span>`);
    }
  }
  if(!chips.length) return "";
  return `<div class="pal-state-chips ${opts.compact?"compact":""}">${chips.join("")}</div>`;
}
function predictionStateSlotHTML(scope,pi,gid,game,pal,opts={}){
  const key=`${pi}_${gid}`;
  return `<div class="pal-state-slot" id="${esc(predictionStateId(scope,pi,gid))}">${predictionStateChipsHTML(key,game,pal,opts)}</div>`;
}
function refreshPredictionStateIndicators(pi,gid){
  const game=gameById(gid);
  if(!game) return;
  const key=`${pi}_${gid}`;
  const pal=S.palpites[key]||{};
  [
    {scope:"pal",compact:false},
    {scope:"bk",compact:true}
  ].forEach(item=>{
    const el=document.getElementById(predictionStateId(item.scope,pi,gid));
    if(el) el.innerHTML=predictionStateChipsHTML(key,game,pal,{compact:item.compact});

// Palpite alheio do mata-mata fica visível quando a FASE encerra — mesmo instante
// da trava de escrita (koPhaseCloseMs = 30 min antes do 1º jogo da fase). Travou,
// ninguém edita mais, então revelar a fase inteira de uma vez é seguro (inclui
// jogos que só acontecem dias depois). Vale inclusive para o admin, que joga.
function koOthersRevealed(game){
  if(!game||!game.ko) return true;
  const close=koPhaseCloseMs(game.phaseKey);
  return Number.isFinite(close)&&Date.now()>=close;
}
function canViewParticipantPrediction(pi,game){
  const myIdx=myParticipantIndex();
  // Sempre dá pra ver o próprio palpite; modo offline/demo não tem restrição.
  if(myIdx===pi||!isOnlineMode()) return true;
  // Grupos são abertos no bolão. Mata-mata: revela no fechamento da fase (igual RLS + aba Jogos).
  if(!game?.ko) return true;
  return koOthersRevealed(game);
}
function predictionRevealLabel(game){
  // KO: predictionDeadlineMs(game) já é o fechamento da fase (koPhaseCloseMs).
  const label=formatPredictionDeadline(predictionDeadlineMs(game));
  if(game?.ko) return label?`Libera ${label}`:"Libera no fechamento da fase";
  return label?`Libera ${label}`:"Libera no prazo";
}
function hiddenPredictionNoticeHTML(game,scope="pal"){
  const compact=scope==="bk";
  return `<div class="pal-hidden-note ${compact?"compact":""}" title="${esc(predictionRevealLabel(game))}">
    <span class="dot"></span><span class="label">Palpite oculto</span>
  </div>`;
}
function samePrediction(a,b,game){
  if(!hasScore(a)||!hasScore(b)) return false;
  const sameScore=+a.s1===+b.s1&&+a.s2===+b.s2;
  if(!sameScore) return false;
  if(!game?.ko||+a.s1!==+a.s2) return true;
  return koAdvancerValue(a.koWinner)===koAdvancerValue(b.koWinner);
}
function ownPredictionCompareHTML(game,viewedPal,scope="pal"){
  const myIdx=myParticipantIndex();
  if(!Number.isInteger(myIdx)||myIdx===palPi) return "";
  if(!canViewParticipantPrediction(palPi,game)) return "";
  const myPal=S.palpites[`${myIdx}_${game.id}`]||{};
  if(!hasScore(myPal)) return "";
  const complete=isPredictionComplete(game,myPal);
  const same=samePrediction(myPal,viewedPal,game);
  const advancer=game?.ko&&+myPal.s1===+myPal.s2&&myPal.koWinner?`${teamFlag(myPal.koWinner)} ${myPal.koWinner} passa`:"";
  const compact=scope==="bk";
  const title=`Seu palpite: ${myPal.s1} x ${myPal.s2}${advancer?` - ${advancer}`:""}`;
  return `<div class="pal-self-compare ${compact?"compact":""} ${same?"same":""} ${complete?"":"incomplete"}" title="${esc(title)}">
    <span class="pal-self-label">Seu palpite</span>
    <span class="pal-self-score"><b>${esc(myPal.s1)}</b><span>×</span><b>${esc(myPal.s2)}</b></span>
    ${advancer?`<span class="pal-self-adv">${esc(advancer)}</span>`:""}
  </div>`;
}

function bracketCard(game,opts){
  if(!game) return "";
  opts=opts||{};
  const key=`${palPi}_${game.id}`;
  const rawPal=S.palpites[key]||{};
  const canViewPal=canViewParticipantPrediction(palPi,game);
  const pal=canViewPal?rawPal:{};
  const res=S.results[game.id];
  const teams=gameTeams(game);
  const canEdit=canEditParticipant(palPi);
  const gameStarted=!!(game.utc&&new Date()>=new Date(game.utc));
  const deadlineClosed=predictionDeadlineClosed(game);
  const disabled=!canEdit||deadlineClosed;
  const waiting=!teams.ready;
  const dateParts=game.date?formatGameDateParts(game.date):null;

  let cls="bracket-card";
  if(opts.accent) cls+=" "+opts.accent;
  if(waiting) cls+=" waiting";
  if(gameStarted&&!res) cls+=" live";

  let badge="";
  if(canViewPal&&pal.s1!=null&&pal.s2!=null&&res){
    const details=scoreDetails(pal,res,game);
    const sc=details?.pts;
    if(details?.exact){cls+=" hit";badge=`<span class="bk-badge">+${sc} cravou</span>`;}
    else if(sc>0) badge=`<span class="bk-badge">+${sc}</span>`;
    else if(sc===-2) badge=`<span class="bk-badge" style="background:linear-gradient(135deg,#ef4444,#991b1b)">-2</span>`;
    else badge=`<span class="bk-badge" style="background:#9ca3af">0</span>`;
  }

  const v1=canEdit&&!deadlineClosed&&!waiting?(pal.s1??null):pal.s1;
  const v2=canEdit&&!deadlineClosed&&!waiting?(pal.s2??null):pal.s2;
  const inp=(id,val,which)=>`<input id="${id}" type="number" min="0" max="30" inputmode="numeric" value="${val==null?"":esc(val)}" placeholder="–" ${disabled||waiting?"disabled":""} onchange="setPal(${palPi},'${game.id}',${which},this.value)">`;

  const rowHTML=(name,side,val,which)=>{
    const flag=teamFlag(name);
    const placeholder=!flag;
    const rcls=`bk-row ${placeholder?"muted":""}`;
    return `<div class="${rcls}">
      <div class="nm">${flag?`<span class="flag">${flag}</span>`:""}<span class="txt">${esc(name)}</span></div>
      ${inp(`bk_${palPi}_${game.id}_${which}`,val,which)}

  const meta=`<div class="bk-meta">

  </div>`;
  const compareHTML=canViewPal?ownPredictionCompareHTML(game,pal,"bk"):hiddenPredictionNoticeHTML(game,"bk");

  return `<div class="${cls}">

function setKoPhaseOverride(phase,val){
  if(!isAdmin()){toast("Só o administrador libera ou trava o mata-mata.");return;}
  if(!S.config.knockoutOverrides) S.config.knockoutOverrides={};
  if(val==="auto") delete S.config.knockoutOverrides[phase];
  else if(val==="open"||val==="closed") S.config.knockoutOverrides[phase]=val;
  save();
  saveKnockoutOverridesRemote();
  renderPalpites();
}
function setPalFilter(k){palFilter=k;renderPalpites();}
function setPal(pi,gid,w,v){
  if(!canEditParticipant(pi)){toast("Você só pode alterar seus próprios palpites.");renderPalpites();return;}
  const game=gameById(gid);
  if(predictionDeadlineClosed(game)){
    toast(predictionClosedMessage(game));
    renderPalpites();
    return;
  }
  const key=`${pi}_${gid}`;
  if(!S.palpites[key]) S.palpites[key]={};
  const n=parseInt(v,10);
  if(!Number.isNaN(n)&&n>=0){
    const clamped=Math.min(30,n);
    if(w===1) S.palpites[key].s1=clamped;
    else S.palpites[key].s2=clamped;
    completePredictionVisibleZero(S.palpites[key]);
  }else{
    if(w===1) delete S.palpites[key].s1;
    else delete S.palpites[key].s2;
  }
  if(!game?.ko||!hasScore(S.palpites[key])||+S.palpites[key].s1!==+S.palpites[key].s2){
    delete S.palpites[key].koWinner;
    delete S.palpites[key].koDecision;
  }
  save();
  if(remoteClient) savePredictionRemote(pi,gid);
  else dirtyPredictionKeys.delete(key);
  renderPalpites();
}
function setPalTiebreak(pi,gid,value){
  if(!canEditParticipant(pi)){toast("Você só pode alterar seus próprios palpites.");renderPalpites();return;}
  const game=gameById(gid);
  if(predictionDeadlineClosed(game)){
    toast(predictionClosedMessage(game));
    renderPalpites();
    return;
  }
  const key=`${pi}_${gid}`;
  const pal=S.palpites[key];
  if(!game?.ko||!hasScore(pal)||+pal.s1!==+pal.s2){
    toast("O desempate só vale para empate no mata-mata.");
    renderPalpites();
    return;
  }
  const teams=gameTeams(game);
  const selected=parseKoAdvancerValue(value);
  if(![teams.t1,teams.t2].includes(selected)){
    delete pal.koWinner;
    delete pal.koDecision;
  }else{
    pal.koWinner=selected;
    delete pal.koDecision;
  }
  save();
  savePredictionRemote(pi,gid);
  renderPalpites();
}

      <div class="cfg-row">
        <div class="cfg-lbl"><strong>${lbl}</strong><span>${brl(prizes[i])}</span></div>
        <div style="display:flex;align-items:center;gap:6px">
          <input class="cfg-inp" type="number" min="0" max="100" value="${pcts[i]}" onchange="updPrize(${i},+this.value)" ${locked?"disabled":""}>
          <span class="microcopy">%</span>
        </div>
      </div>`).join("")}
      <div class="microcopy" style="font-weight:850;color:${Math.abs(diff)<1?"#065f46":"#b91c1c"}">
        ${Math.abs(diff)<1?"Distribuição balanceada.":`Diferença de ${brl(Math.abs(diff))}; ajuste os percentuais.`}
      </div>
    </div>
    <div class="card">
      <div class="card-title">Regras de pontuação</div>
      <div class="rules-box">
        <div><strong>Cravada:</strong> placar exato vale <strong style="color:#065f46">+3 pontos</strong>.</div>
        <div><strong>Resultado certo:</strong> vencedor ou empate correto, sem placar exato, vale <strong style="color:#1e40af">+1 ponto</strong>.</div>
        <div><strong>Invertida:</strong> placar exatamente ao contrário vale <strong style="color:#b91c1c">−2 pontos</strong>.</div>
        <div><strong>Erro:</strong> resultado incorreto vale <strong>0 ponto</strong>.</div>
        <hr style="margin:10px 0;border:none;border-top:1px solid var(--border)">
        <div><strong>Pódio:</strong> campeão +20, vice +10, 3º lugar +5 e 4º lugar +3.</div>
        <div><strong>Mata-mata:</strong> com vencedor no tempo normal, cravada vale 3+1 e acerto do vencedor sem cravar vale 1+1; erro vale 0 e invertida vale −2. Se empatar no tempo regulamentar, só pontua quem também palpitou empate: empate cravado vale 3 e empate não cravado vale 1, com +1 se acertar quem passa.</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Backup de dados</div>
      <div class="action-row">
        <button class="action-btn" onclick="saveBackup()">Exportar JSON</button>
        <button class="action-btn" onclick="exportReportPDF()">Exportar PDF</button>
        <label class="action-label">Importar JSON<input type="file" accept=".json" style="display:none" onchange="importBackup(this)"></label>
        ${isOnlineMode()&&isAdmin()?`<button class="action-btn secondary" onclick="pushLocalStateToRemote()">Publicar dados locais no Supabase</button>`:""}
        ${canEditResults()?`<button class="action-btn secondary" onclick="resetCompetitionData()">Resetar competição</button>`:""}
      </div>
      <div class="microcopy" style="margin-top:10px">Os dados também ficam neste navegador como cópia de segurança. Exporte um backup regularmente.</div>
      <div class="microcopy" style="margin-top:4px">O reset apaga resultados, palpites e pódios; participantes, contas vinculadas e configurações permanecem.</div>
      ${S.savedAt?`<div class="microcopy" style="margin-top:4px">Último salvamento: ${new Date(S.savedAt).toLocaleString("pt-BR")}.</div>`:""}
    </div>
  </div>`;
  document.getElementById("tab-config").innerHTML=h;
}
function updCfg(k,v){
  if(!canEditResults()){toast("Só o administrador altera as configurações.");renderConfig();return;}
  S.config[k]=Number.isFinite(v)&&v>0?v:S.config[k];
  save();
  saveConfigRemote();
  renderConfig();
}
function updPrize(i,v){
  if(!canEditResults()){toast("Só o administrador altera as configurações.");renderConfig();return;}
  S.config.prizePercents[i]=Number.isFinite(v)?Math.max(0,Math.min(100,v)):0;
  save();
  saveConfigRemote();
  renderConfig();
}
// ── Gerenciamento de convidados (invited_emails) ──────────────────────────
async function loadInvitedEmails(){
  if(!remoteClient||!remoteSession||!isAdmin()) return;
  const {data}=await remoteClient.from('invited_emails').select('email,participant_index').order('participant_index');
  invitedEmailsList=data||[];
  if(activeTab==='config') renderConfig();
}
async function addInvitedEmail(){
  if(!remoteClient||!remoteSession||!isAdmin()){toast("Só o administrador pode gerenciar convidados.");return;}
  const email=(document.getElementById('inviteEmailInp')?.value||'').toLowerCase().trim();
  const idx=parseInt(document.getElementById('inviteIdxSel')?.value,10);
  if(!email||!email.includes('@')){toast("Informe um e-mail válido.");return;}
  if(!Number.isInteger(idx)||idx<0||idx>=S.participants.length){toast("Escolha um participante válido.");return;}
  const ok=await remoteWrite(()=>remoteClient.from('invited_emails').upsert({email,participant_index:idx},{onConflict:'email'}));
  if(ok){invitedEmailsList=null;await loadInvitedEmails();toast(`Convite salvo para ${email}.`);}
}
async function removeInvitedEmail(email){
  if(!remoteClient||!remoteSession||!isAdmin()){toast("Só o administrador pode gerenciar convidados.");return;}
  if(!confirm(`Remover o convite de ${email}?\nSe esta pessoa já tiver vinculado a conta, ela não conseguirá criar um novo perfil caso saia.`)) return;
  const ok=await remoteWrite(()=>remoteClient.from('invited_emails').delete().eq('email',email));
  if(ok){invitedEmailsList=null;await loadInvitedEmails();toast(`Convite de ${email} removido.`);}
}

function resetCompetitionDataState(){
  S.results={};
  S.palpites={};
  S.podio={};
  S.actualPodio={};
  save();
}

async function resetCompetitionData(){
  const message=isOnlineMode()
    ? "Isso vai apagar todos os resultados, palpites e pódios salvos aqui e no Supabase. Participantes e configurações serão mantidos. Deseja continuar?"
    : "Isso vai apagar todos os resultados, palpites e pódios salvos neste navegador. Participantes e configurações serão mantidos. Deseja continuar?";
  if(!window.confirm(message)) return;
  if(isOnlineMode()){
    if(!remoteClient||!remoteSession){toast("Entre como administrador primeiro.");return;}
    if(!isAdmin()){toast("Só o administrador pode resetar a competição.");return;}
    setSyncStatus("warn","Limpando dados da competição...");
    const responses=await Promise.all([
      remoteClient.from("results").delete().neq("game_id",""),
      remoteClient.from("predictions").delete().gte("participant_index",0),
      remoteClient.from("podium_predictions").delete().gte("participant_index",0),
      remoteClient.from("actual_podium").upsert({
        id:"main",
        p1:null,
        p2:null,
        p3:null,
        p4:null,
        updated_by:remoteSession.user.id
      },{onConflict:"id"})
    ]);
    const failed=responses.find(r=>r.error);
    if(failed){
      setSyncStatus("err",remoteErrorText(failed.error));
      toast(remoteErrorText(failed.error));
      await loadRemoteData(false);
      return;
    }
  }
  resetCompetitionDataState();
  render(activeTab);
  if(isOnlineMode()){
    await loadRemoteData(false);
    toast("Competição resetada no navegador e no Supabase.");
  }else{
    toast("Competição resetada neste navegador.");
  }
}

function saveBackup(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`bolao2026_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast("Backup exportado.");
}
// ===== Relatório em PDF (via impressão do navegador, sem bibliotecas) =====
function reportPtLabel(n){return n>0?`+${n}`:(n<0?`−${Math.abs(n)}`:"0");}
function reportPlayerMaxPossible(pi){
  let m=0;
  GAMES.forEach(g=>{
    const res=S.results[g.id]||liveProvisionalResult(g);
    const pal=S.palpites[`${pi}_${g.id}`];
    if(scoreDetails(pal,res,g)) m+=maxScoreForGame(g);
  });
  return m;
}
function reportOutcome(pi,g){
  const res=S.results[g.id]||liveProvisionalResult(g);
  const pal=S.palpites[`${pi}_${g.id}`];
  const d=scoreDetails(pal,res,g);
  if(!pal) return {cls:"rp-none",txt:"—"};
  if(!d)   return {cls:"rp-pend",txt:`${pal.s1}–${pal.s2}`}; // palpite sem resultado
  const cls=d.exact?"rp-crav":d.base===1?"rp-ok":d.base===-2?"rp-inv":"rp-err";
  return {cls,txt:`<b>${pal.s1}–${pal.s2}</b> <span class="rp-pt">${reportPtLabel(d.pts)}</span>`};
}
function buildBolaoReportHTML(){
  const rk=ranking();
  const order=rk.map(r=>r.i);
  const pool=S.participants.length*S.config.entryValue;
  const grupos=[...new Set(GAMES.filter(g=>g.phaseKey==="groups").map(g=>g.group))];
  const groupGames=GAMES.filter(g=>g.phaseKey==="groups");
  const comResultado=groupGames.filter(g=>S.results[g.id]).length;
  const pendentes=groupGames.length-comResultado;
  const fmt=n=>n.toLocaleString("pt-BR");
  const podioReal=S.actualPodio&&(S.actualPodio.p1||S.actualPodio.p2||S.actualPodio.p3||S.actualPodio.p4);

  // --- Classificação ---
  const rkRows=rk.map((r,idx)=>{
    const m=reportPlayerMaxPossible(r.i);
    const aprov=m?Math.round((r.pts-r.pp)/m*1000)/10:0;
    const medal=idx===0?"rp-gold":idx===1?"rp-silver":idx===2?"rp-bronze":"";
    return `<tr class="${medal}"><td class="rp-c"><b>${idx+1}</b></td><td>${esc(r.name)}</td>
      <td class="rp-c"><b>${r.pts}</b></td><td class="rp-c">${r.crav}</td><td class="rp-c">${r.corr}</td>
      <td class="rp-c">${r.err}</td><td class="rp-c">${r.inv}</td><td class="rp-c">${aprov.toLocaleString("pt-BR")}%</td></tr>`;
  }).join("");

  // --- Premiação ---
  const lugares=["1º lugar","2º lugar","3º lugar"];
  const przRows=[0,1,2].map(i=>`<tr class="${["rp-gold","rp-silver","rp-bronze"][i]}">
    <td><b>${lugares[i]}</b> <span class="rp-muted">(hoje: ${esc(rk[i]?rk[i].name:"—")})</span></td>
    <td class="rp-c">${S.config.prizePercents[i]}%</td><td class="rp-c"><b>R$ ${fmt(prize(i+1))}</b></td></tr>`).join("");

  // --- Pódios palpitados ---
  const pdRows=rk.map(r=>{const p=S.podio[r.i]||{};return `<tr><td><b>${esc(r.name)}</b></td>
    <td class="rp-c">${esc(p.p1||"—")}</td><td class="rp-c">${esc(p.p2||"—")}</td>
    <td class="rp-c">${esc(p.p3||"—")}</td><td class="rp-c">${esc(p.p4||"—")}</td></tr>`;}).join("");

  // --- Resultados por grupo ---
  const resBlocks=grupos.map(grp=>{
    const rows=groupGames.filter(g=>g.group===grp).map(g=>{
      const r=S.results[g.id];
      const t=gameTeams(g);
      let lab;
      if(!r) lab='<span class="rp-pendtxt">A jogar</span>';
      else if(+r.s1>+r.s2) lab=`Vitória: ${esc(t.t1)}`;
      else if(+r.s1<+r.s2) lab=`Vitória: ${esc(t.t2)}`;
      else lab="Empate";
      return `<tr><td class="rp-c">${g.id}</td><td class="rp-c">${g.round}</td>
        <td>${esc(t.t1)} <span class="rp-muted">x</span> ${esc(t.t2)}</td>
        <td class="rp-c ${r?"":"rp-err"}"><b>${r?`${r.s1}–${r.s2}`:"—"}</b></td><td>${lab}</td></tr>`;
    }).join("");
    return `<h3>Grupo ${grp}</h3><table class="rp-res"><thead><tr>
      <th>Jogo</th><th>Rod.</th><th>Confronto</th><th>Placar</th><th>Resultado</th></tr></thead><tbody>${rows}</tbody></table>`;
  }).join("");

  // --- Matriz de palpites ---
  const mxHead=order.map((pi,idx)=>`<th>${esc(S.participants[pi])}<br><span class="rp-rank">${idx+1}º</span></th>`).join("");
  const mxBody=grupos.map(grp=>{
    const sep=`<tr class="rp-grp"><td colspan="${3+order.length}">Grupo ${grp}</td></tr>`;
    const rows=groupGames.filter(g=>g.group===grp).map(g=>{
      const r=S.results[g.id];const t=gameTeams(g);
      const cells=order.map(pi=>{const o=reportOutcome(pi,g);return `<td class="${o.cls}">${o.txt}</td>`;}).join("");
      return `<tr><td class="rp-c">${g.id}</td><td>${esc(t.t1)} <span class="rp-muted">x</span> ${esc(t.t2)}</td>
        <td class="rp-c ${r?"":"rp-err"}"><b>${r?`${r.s1}–${r.s2}`:"—"}</b></td>${cells}</tr>`;
    }).join("");
    return sep+rows;
  }).join("");

  const css=`
    *{box-sizing:border-box} body{font:13px/1.45 Arial,Helvetica,sans-serif;color:#1b2430;margin:24px;}
    h1{font-size:24px;color:#12233B;margin:0 0 2px} h2{font-size:17px;color:#12233B;border-bottom:2px solid #2E75B6;padding-bottom:3px;margin:22px 0 10px}
    h3{font-size:14px;color:#1F4E79;margin:14px 0 5px} .rp-sub{color:#2E75B6;font-size:15px;margin:0 0 8px}
    .rp-meta{color:#666;font-size:12px;margin:0 0 4px} table{border-collapse:collapse;width:100%;margin:0 0 6px}
    th,td{border:1px solid #BFC7D1;padding:4px 7px;text-align:left;vertical-align:middle}
    thead th{background:#1F4E79;color:#fff;font-size:12px;text-align:center}
    .rp-c{text-align:center} .rp-muted{color:#888} .rp-pendtxt{color:#B00020;font-style:italic}
    .rp-gold{background:#FFF2CC} .rp-silver{background:#ECECEC} .rp-bronze{background:#F6E2D3}
    .rp-note{color:#666;font-size:11px;font-style:italic;margin:4px 0 0}
    .rp-rules td:first-child{font-weight:bold;width:170px}
    .rp-crav{background:#C6EFCE} .rp-ok{background:#DDEBF7} .rp-err{background:#F2F2F2} .rp-inv{background:#FFC7CE}
    .rp-none{color:#aaa;text-align:center} .rp-pend{color:#555;text-align:center}
    .rp-legend span{display:inline-block;padding:2px 8px;margin:0 4px 4px 0;border:1px solid #BFC7D1;font-size:11px}
    /* Matriz */
    .rp-matrix-wrap{page:landscapePg}
    table.rp-matrix{font-size:9px} table.rp-matrix th,table.rp-matrix td{padding:2px 4px;text-align:center}
    table.rp-matrix td:nth-child(2){text-align:left;white-space:nowrap}
    table.rp-matrix .rp-pt{color:#333;font-size:8px} .rp-rank{color:#cfe0f0;font-weight:normal;font-size:8px}
    tr.rp-grp td{background:#12233B;color:#fff;font-weight:bold;text-align:left}
    .no-print{margin:0 0 16px} .no-print button{font:13px Arial;padding:8px 14px;margin-right:8px;cursor:pointer;border:1px solid #2E75B6;background:#2E75B6;color:#fff;border-radius:6px}
    .no-print button.sec{background:#fff;color:#2E75B6}
    @page{size:A4 portrait;margin:12mm} @page landscapePg{size:A4 landscape;margin:9mm}
    @media print{.no-print{display:none}}
  `;
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
  <title>Bolão do Hexa 2026 — Relatório</title><style>${css}</style></head><body>
  <div class="no-print"><button onclick="window.print()">Imprimir / Salvar PDF</button><button class="sec" onclick="window.close()">Fechar</button></div>
  <h1>Bolão do Hexa 2026</h1>
  <p class="rp-sub">Relatório de palpites, resultados e pontuação — fase de grupos</p>
  <p class="rp-meta">Gerado em ${new Date().toLocaleString("pt-BR")}. ${comResultado} de ${groupGames.length} jogos com resultado oficial${pendentes?`; ${pendentes} ainda a jogar`:""}.${podioReal?"":" Pódio real ainda não definido (pontos de pódio = 0)."}</p>

  <h2>Como funciona a pontuação</h2>
  <table class="rp-rules"><tbody>
    <tr class="rp-crav"><td>+3 — Cravada</td><td>Acertou o placar exato.</td></tr>
    <tr class="rp-ok"><td>+1 — Acerto</td><td>Acertou o resultado (vitória do mesmo time ou empate), mas não o placar.</td></tr>
    <tr class="rp-err"><td>0 — Erro</td><td>Errou o resultado.</td></tr>
    <tr class="rp-inv"><td>−2 — Invertido</td><td>Cravou o placar ao contrário (ex.: palpite 2–1, deu 1–2). Não vale para empates.</td></tr>
  </tbody></table>
  <p class="rp-note">Pódio (quando definido): campeão +20, vice +10, 3º +5, 4º +3. Mata-mata pode dar +1 de bônus por acertar quem avança. Desempate: pontos → cravadas → menos invertidos → ordem alfabética.</p>

  <h2>Classificação geral</h2>
  <table><thead><tr><th>#</th><th style="text-align:left">Jogador</th><th>Pontos</th><th>Cravadas</th><th>Acertos</th><th>Erros</th><th>Invertidos</th><th>Aproveit.</th></tr></thead><tbody>${rkRows}</tbody></table>
  <p class="rp-note">Aproveitamento = pontos ÷ máximo possível nos jogos avaliados.</p>

  <h2>Premiação</h2>
  <p>Entrada de <b>R$ ${fmt(S.config.entryValue)}</b> por pessoa · ${S.participants.length} jogadores · bolo de <b>R$ ${fmt(pool)}</b>.</p>
  <table><thead><tr><th style="text-align:left">Colocação</th><th>Percentual</th><th>Prêmio</th></tr></thead><tbody>${przRows}</tbody></table>
  <p class="rp-note">"Hoje" reflete a classificação parcial atual, não o resultado final.</p>

  <h2>Pódios palpitados</h2>
  <table><thead><tr><th style="text-align:left">Jogador</th><th>Campeão</th><th>Vice</th><th>3º lugar</th><th>4º lugar</th></tr></thead><tbody>${pdRows}</tbody></table>

  <h2>Resultados dos jogos</h2>
  ${resBlocks}

  <div class="rp-matrix-wrap">
  <h2>Palpites de todos, jogo a jogo</h2>
  <p class="rp-legend"><span class="rp-crav">Cravada +3</span><span class="rp-ok">Acerto +1</span><span class="rp-err">Erro 0</span><span class="rp-inv">Invertido −2</span><span>— sem palpite</span> <span class="rp-muted">Colunas em ordem de classificação.</span></p>
  <table class="rp-matrix"><thead><tr><th>Jogo</th><th style="text-align:left">Confronto</th><th>Placar</th>${mxHead}</tr></thead><tbody>${mxBody}</tbody></table>
  </div>
  </body></html>`;
}
function exportReportPDF(){
  let html;
  try{ html=buildBolaoReportHTML(); }
  catch(err){ toast("Não foi possível gerar o relatório."); return; }
  const win=window.open("","_blank");
  if(!win){ toast("Permita pop-ups para gerar o PDF."); return; }
  win.document.open(); win.document.write(html); win.document.close();
  win.focus();
  setTimeout(()=>{ try{win.print();}catch(e){} },350);
  toast("Relatório aberto — use Imprimir e escolha \"Salvar como PDF\".");
}
function importBackup(input){
  const f=input.files[0];
  if(!f) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      S=migrateState(JSON.parse(e.target.result));
      save();
      toast(isOnlineMode()&&isAdmin()?"Backup importado. Use Publicar dados locais no Supabase para enviar online.":"Backup importado.");
      render(activeTab);
    }catch(err){toast("Arquivo inválido.");}
  };
  reader.readAsText(f);
}
function toast(msg,ms=2400){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),ms);
}
