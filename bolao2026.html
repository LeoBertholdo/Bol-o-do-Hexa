  color:var(--green);display:inline-flex;align-items:center;gap:6px;
}
.bk-next-when{font-size:.74rem;font-weight:800;color:var(--muted)}
.bk-next-match{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.bk-team{display:inline-flex;align-items:center;gap:7px;font-weight:900;font-size:1.02rem;color:var(--text)}
.bk-team .flag{font-size:1.35rem}
.bk-team.bk-br{color:var(--green)}
.bk-vs{font-weight:950;color:var(--muted);font-size:.85rem}
.bk-opp-tbd{font-weight:900;color:var(--blue);font-size:.95rem}
.bk-possibles{border:1px solid #d8e5ff;border-radius:10px;background:#f7fbff;padding:11px 12px}
.bk-possibles-label{
  font-size:.62rem;text-transform:uppercase;letter-spacing:.55px;font-weight:950;
  color:#31415f;margin-bottom:8px;
}
.bk-poss-list{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bk-poss{
  display:inline-flex;align-items:center;gap:6px;background:#fff;
  border:1px solid #d8e5ff;border-radius:999px;padding:5px 11px;
  font-weight:850;font-size:.82rem;color:var(--text);
}
.bk-poss .flag{font-size:1.05rem}
.bk-poss-sep{font-size:.7rem;font-weight:800;color:var(--muted)}
.bk-poss-src{margin-top:9px;font-size:.7rem;color:var(--muted);font-weight:700}
.brazil-ko-status{
  display:flex;align-items:center;gap:12px;border:1px solid var(--border);
  border-radius:12px;background:#fff;padding:16px;
}
.brazil-ko-status .bk-emoji{font-size:1.9rem;line-height:1;flex-shrink:0}
.brazil-ko-status strong{display:block;font-size:1rem;color:var(--text);font-weight:950;margin-bottom:2px}
.brazil-ko-status span{font-size:.8rem;color:var(--muted);line-height:1.4}
.brazil-ko-status.is-champ{border-color:#ffe08a;background:linear-gradient(180deg,#fffdf2,#ffffff)}
.brazil-ko-status.is-champ strong{color:#b8860b}
.home-insights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.home-insights.single{grid-template-columns:1fr}
.quick-insight{
  background:#fff;
  border:1px solid var(--border);
  border-radius:8px;
  padding:13px;
  box-shadow:0 10px 26px rgba(0,39,118,.07);
}
.quick-insight .label{font-size:.62rem;text-transform:uppercase;letter-spacing:.65px;color:var(--muted);font-weight:950}
.quick-insight .value{margin-top:6px;font-size:1.18rem;color:var(--blue);font-weight:950;line-height:1.05}
.quick-insight .note{margin-top:5px;font-size:.72rem;color:var(--muted);line-height:1.4}
.position-insight{
  background:linear-gradient(135deg,#fffef7 0%,#f4fbff 100%);
  border-color:#d8e5ff;
  box-shadow:0 12px 30px rgba(0,39,118,.08);
}
.position-insight .value{color:var(--green)}
.position-insight .note strong{color:var(--text)}
.insight-action{margin-top:12px}

/* RANKING */
.ranking-page{display:grid;gap:14px}
.chart-shell{
  display:grid;
  gap:12px;
  background:#fff;
  border:1px solid rgba(220,229,216,.95);
  border-radius:8px;
  padding:14px;
  box-shadow:0 14px 34px rgba(0,39,118,.07);
}
.chart-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.chart-presets,.chart-legend,.chart-mode-pills{display:flex;gap:8px;flex-wrap:wrap}
.chart-toggle.active{background:var(--blue);border-color:var(--blue);color:#fff}
.chart-mode-pills{padding-bottom:2px}
.chart-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--border);
  border-radius:999px;
  padding:4px 10px;
  background:#fff;
  color:var(--muted);
  font-size:.7rem;
  font-weight:900;
  line-height:1.15;
}
.chart-chip.active{border-color:transparent;color:#fff;box-shadow:0 6px 14px rgba(0,39,118,.14);padding:4px 11px}
.chart-chip.active .chart-dot{display:none}
.chart-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
/* Chart controls — grouped & labeled, kept visually lighter than the chart itself
   so the graph stays the focal point. Segmented (pick one) for Período/Detalhe. */
.chart-toolbar-head{flex:1;min-width:0}
.chart-controls{
  display:grid;
  gap:10px;
  padding:11px 12px;
  background:#f7f9fc;
  border:1px solid #ebeff7;
  border-radius:11px;
}
.chart-control{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;min-width:0}
.chart-control-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chart-control-label{
  font-size:.56rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  color:#8492aa;line-height:1;
}
/* Segmented control = choose ONE */
.chart-seg{
  display:inline-flex;flex-wrap:wrap;gap:2px;padding:2px;
  background:#edf1f8;border:1px solid #e6ebf4;border-radius:9px;
  width:max-content;max-width:100%;
}
.chart-seg-btn{
  border:0;background:transparent;cursor:pointer;
  padding:5px 11px;border-radius:7px;
  font-size:.68rem;font-weight:800;color:#5e6c85;white-space:nowrap;
  transition:background .15s ease,color .15s ease,box-shadow .15s ease;
}
.chart-seg-btn:hover{color:var(--blue)}
.chart-seg-btn.active{background:#fff;color:var(--blue);box-shadow:0 1px 2px rgba(0,39,118,.16)}
/* Quick selectors for the participant chips — secondary, quiet */
.chart-presets-inline{display:flex;gap:6px;flex-wrap:wrap}
.chart-preset-btn{
  border:1px solid var(--border);background:#fff;cursor:pointer;
  padding:4px 9px;border-radius:999px;
  font-size:.57rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  color:var(--muted);transition:background .15s ease,border-color .15s ease,color .15s ease;
}
.chart-preset-btn:hover{background:#f4f7fc;border-color:#cdd9ea;color:var(--blue)}
.chart-preset-btn.active{background:#e9f0fb;border-color:#cadaf3;color:var(--blue)}
/* Participant filter strip below the chart — compact, lighter than the chart */
.chart-filter{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chart-filter-sep{width:1px;align-self:stretch;min-height:18px;background:#dfe6f1;margin:0 3px}
.chart-filter .chart-chip{padding:3px 9px;font-size:.64rem;font-weight:800}
.chart-filter .chart-chip.active{padding:3px 10px}
.chart-filter .chart-dot{width:7px;height:7px}
.chart-stage{
  border:1px solid #e5edf8;
  border-radius:10px;
  padding:14px 12px 10px;
  background:
    radial-gradient(circle at 0% 0%,rgba(47,124,246,.05),transparent 55%),
    radial-gradient(circle at 100% 100%,rgba(21,163,107,.05),transparent 55%),
    linear-gradient(180deg,#fcfdff 0%,#f6fbf8 100%);
  overflow:hidden;
}
.chart-stage svg{display:block;width:100%;height:auto;overflow:visible}
.chart-axis-tick{letter-spacing:.02em}
.chart-axis-tick.is-start{fill:#002776;font-weight:950}
.chart-axis-tick.is-podio{fill:#d4a017;font-weight:950}
.chart-axis-tick.is-live{fill:#d83a34}
.chart-endpoint-label text{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.chart-endpoint-dot{filter:drop-shadow(0 2px 4px rgba(0,39,118,.18))}
.chart-endpoint-dot.is-live,.chart-live-dot{animation:chart-live-pulse 1.6s ease-in-out infinite}
.chart-goal-marker.is-live line{animation:chart-live-pulse 1.6s ease-in-out infinite}
.chart-series{transition:opacity .25s ease;cursor:pointer}
svg.chart-hover .chart-series:not(.is-hovered),svg.chart-focus:not(.chart-hover) .chart-series:not(.is-focused){opacity:.18}
.chart-endpoint-name{cursor:pointer;transition:fill-opacity .25s ease}
svg.chart-hover .chart-endpoint-name:not(.is-hovered),svg.chart-focus:not(.chart-hover) .chart-endpoint-name:not(.is-focused){fill-opacity:.25}
@keyframes chart-live-pulse{
  0%,100%{opacity:1;transform:scale(1);transform-origin:center;transform-box:fill-box}
  50%{opacity:.55;transform:scale(1.25);transform-origin:center;transform-box:fill-box}
}
.chart-shell-compact{padding:12px;gap:10px}
.chart-shell-compact .chart-stage{padding:10px 8px 6px}
.chart-shell-compact h3{font-size:.9rem;line-height:1.15}
.chart-expand-btn{
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid var(--border);background:#fff;color:var(--blue);
  border-radius:8px;padding:6px 10px;font-size:.68rem;font-weight:950;
  text-transform:uppercase;letter-spacing:.55px;cursor:pointer;
}
.chart-expand-btn:hover{background:#eef5ff;border-color:#cbd9eb}
.chart-modal{position:fixed;inset:0;z-index:1200;display:none;align-items:center;justify-content:center;padding:18px}
.chart-modal.open{display:flex}
.chart-modal-backdrop{position:absolute;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px)}
.chart-modal-frame{position:relative;background:#fff;border-radius:14px;max-width:1100px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 90px rgba(0,39,118,.35);padding:18px 18px 18px}
.chart-modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:#fff;color:var(--blue);font-size:1.25rem;font-weight:950;cursor:pointer;display:grid;place-items:center;z-index:3;box-shadow:0 4px 10px rgba(0,39,118,.12)}
.chart-modal-close:hover{background:#eef5ff;border-color:#cbd9eb}
.chart-modal .chart-shell{box-shadow:none;border:0;padding:8px 4px}
.chart-modal .chart-shell .chart-toolbar{padding-right:52px}
.chart-modal .chart-stage{padding:16px 14px 12px}
body.chart-modal-open{overflow:hidden}
.chart-axis{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.68rem;color:var(--muted);font-weight:850}
.chart-empty{
  padding:18px;
  border:1px dashed #c7d7f0;
  border-radius:8px;
  background:#f7fbff;
  font-size:.8rem;
  color:#41516d;
  font-weight:850;
}
.ranking-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);gap:14px;align-items:start}
.ranking-side{display:grid;gap:14px;min-width:0}
.ranking-card{
  background:#fff;
  border:1px solid rgba(220,229,216,.95);
  border-radius:8px;
  padding:14px;
  box-shadow:0 14px 34px rgba(0,39,118,.06);
}
.ranking-card h3{font-size:1rem;line-height:1.1;color:var(--text);font-weight:950}
.ranking-card p{margin-top:6px;font-size:.76rem;color:var(--muted);line-height:1.45}
.ranking-card .mini-action{margin-top:12px}
.bolao-stats-card{display:grid;gap:13px}
.bolao-rate-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.bolao-rate-value{font-size:2rem;line-height:1;font-weight:950;color:var(--green)}
.bolao-rate-label{margin-top:4px;font-size:.58rem;text-transform:uppercase;letter-spacing:.72px;color:var(--muted);font-weight:950}
.bolao-rate-bar{
  display:flex;
  width:100%;
  height:16px;
  border-radius:999px;
  overflow:hidden;
  background:#eef2f7;
  box-shadow:inset 0 0 0 1px rgba(0,39,118,.08);
}
.bolao-rate-hit{background:linear-gradient(90deg,var(--green),#54c98e)}
.bolao-rate-miss{background:linear-gradient(90deg,#e0615c,var(--red))}
.bolao-rate-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bolao-rate-pill{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:baseline;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
  padding:8px 9px;
  min-width:0;
}
.bolao-rate-pill span{font-size:.62rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:950}
.bolao-rate-pill strong{font-size:.95rem;color:var(--text);font-weight:950;white-space:nowrap}
.bolao-stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bolao-stat-tile{
  border:1px solid var(--border);
  border-radius:8px;
  background:#fbfcff;
  padding:10px;
  min-width:0;
}
.bolao-stat-tile strong{display:block;font-size:1.1rem;line-height:1.05;color:var(--blue);font-weight:950}
.bolao-stat-label{display:block;margin-top:6px;font-size:.58rem;text-transform:uppercase;letter-spacing:.56px;color:var(--muted);font-weight:950}
.bolao-stat-tile small{display:block;margin-top:7px;font-size:.7rem;line-height:1.35;color:#52617a;font-weight:750}
.bolao-stat-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.bolao-stat-title-row strong{min-width:0}
.bolao-points-main{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.bolao-points-delta{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid currentColor;
  border-radius:999px;
  padding:4px 7px;
  font-size:.62rem;
  line-height:1;
  font-weight:950;
  white-space:nowrap;
}
.bolao-points-delta.up{color:var(--green);background:#f1fbf5}
.bolao-points-delta.down{color:var(--red);background:#fff4f3}
.bolao-points-delta:before{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent}
.bolao-points-delta.up:before{border-bottom:7px solid currentColor}
.bolao-points-delta.down:before{border-top:7px solid currentColor}
.bolao-stat-expand{
  border:1px solid #cfe0d1;
  border-radius:999px;
  background:#fff;
  color:var(--green);
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 8px;
  font-size:.58rem;
  line-height:1;
  text-transform:uppercase;
  letter-spacing:.48px;
  font-weight:950;
  white-space:nowrap;
  cursor:pointer;
}
.bolao-stat-expand:hover{background:#f3fbf5;border-color:#a9cfb0}
.bolao-stat-expand .chev{
  width:7px;
  height:7px;
  border-right:2px solid currentColor;
  border-bottom:2px solid currentColor;
  transform:rotate(45deg);
  transition:transform .16s ease;
}
.bolao-stat-expand[aria-expanded="true"] .chev{transform:rotate(225deg);margin-top:4px}
.bolao-game-heading{display:block;font-size:.86rem;line-height:1.12;color:var(--text);font-weight:950}
.bolao-game-summary{margin-top:7px;font-size:.66rem;line-height:1.32;color:#52617a;font-weight:850}
.bolao-game-line{margin-top:8px;font-size:.75rem;line-height:1.28;color:#52617a;font-weight:850}
.bolao-top-list{display:grid;gap:7px;margin-top:9px;padding-top:8px;border-top:1px solid #e5edf8}
.bolao-top-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px;align-items:start}
.bolao-top-rank{
  display:grid;
  place-items:center;
  width:22px;
  height:22px;
  border-radius:999px;
  background:#eef5ff;
  color:var(--blue);
  font-size:.62rem;
  font-weight:950;
}
.bolao-top-meta{min-width:0}
.bolao-top-meta b{display:block;font-size:.7rem;line-height:1.2;color:var(--text);font-weight:950}
.bolao-top-meta em{display:block;margin-top:2px;font-style:normal;font-size:.68rem;line-height:1.25;color:#52617a;font-weight:760}
.bolao-stat-tile.highlight strong{color:var(--green)}
.bolao-stat-tile.warn strong{color:var(--red)}
.bolao-crav-row{display:flex;min-width:0;margin-top:7px}
.bolao-crav-names{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.66rem;line-height:1.25;color:#52617a;font-weight:800}
/* Seletor de período do card de estatísticas — próprio, com rolagem horizontal quando acumula rodadas */
.bolao-period-seg{
  display:flex;gap:2px;padding:2px;margin-top:2px;
  background:#edf1f8;border:1px solid #e6ebf4;border-radius:9px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.bolao-period-seg::-webkit-scrollbar{display:none}
.bolao-period-seg .chart-seg-btn{flex:0 0 auto}
.bolao-tile-wide{grid-column:1/-1}
.lb-row{display:grid;grid-template-columns:auto minmax(86px,.62fr) minmax(220px,1.7fr) auto;align-items:center;gap:10px;padding:12px;border-radius:8px;margin-bottom:8px;background:#fff;border:1px solid var(--border);box-shadow:0 8px 18px rgba(0,39,118,.05);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
@media(hover:hover){.lb-row:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(0,39,118,.12);border-color:#cdd9ea}}
.podium-row{position:relative;padding:15px 14px;border-width:2px;box-shadow:0 16px 34px rgba(0,39,118,.12)}
.podium-row .pname{font-size:1.06rem}
.podium-row .pts-num{font-size:2rem}
.podium-row.top-1{background:linear-gradient(110deg,#fff8d8,#fffdf4 46%,#fff);border-color:#f5c542}
.podium-row.top-2{background:linear-gradient(110deg,#f4f7fb,#fff 48%,#fff);border-color:#b9c3cf}
.podium-row.top-3{background:linear-gradient(110deg,#fff0df,#fff 48%,#fff);border-color:#c98747}
.rank{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:950;font-size:.82rem;flex-shrink:0}
.ro{background:#eef3f8;color:var(--muted);border:1px solid #e0e8f1}
.rank.r1{background:linear-gradient(135deg,#fff8dc 0%,#ffe99b 100%);color:#7a5700;border:1px solid #efc64a;box-shadow:0 10px 20px rgba(212,151,0,.16)}
.rank.r2{background:linear-gradient(135deg,#f8fafc 0%,#dfe7f0 100%);color:#415066;border:1px solid #c7d1dd;box-shadow:0 10px 20px rgba(83,98,120,.14)}
.rank.r3{background:linear-gradient(135deg,#fff1e3 0%,#df9a62 100%);color:#743910;border:1px solid #c87b39;box-shadow:0 10px 20px rgba(170,90,36,.16)}
.podium-row .rank{
  position:relative;
  width:54px;
  height:44px;
  border-radius:12px;
  flex-direction:column;
  gap:1px;
  overflow:hidden;
  box-shadow:0 10px 22px rgba(0,39,118,.14);
}
.podium-row .rank:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:currentColor;opacity:.78}
.podium-row .rank .rank-pos{font-size:1.12rem;font-weight:950;line-height:.95;letter-spacing:0}
.podium-row .rank .rank-suffix{font-size:.62em;margin-left:1px}
.podium-row .rank .rank-label{font-size:.48rem;font-weight:900;letter-spacing:.45px;line-height:1;text-transform:uppercase;opacity:.72}
.pname{font-weight:900;font-size:.98rem;min-width:0}
.lb-row.me{
  border-color:#9fc5ff;
  background:linear-gradient(110deg,#f7fbff,#ffffff 48%,#f7fbff);
  box-shadow:0 12px 28px rgba(0,39,118,.1);
}
.lb-row.me .pname:after{content:"Você";margin-left:8px;font-size:.56rem;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:var(--blue);background:#e4eeff;border:1px solid #c5d9f7;border-radius:999px;padding:2px 7px;vertical-align:middle}
.pstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-items:stretch}
.stat{
  display:grid;
  gap:3px;
  align-content:center;
  padding:6px 7px;
  border:0;
  border-radius:9px;
  background:#f1f4f9;
  text-align:center;
}
.sv{font-size:1.02rem;font-weight:950;line-height:1;color:var(--text)}
.sl{font-size:.53rem;text-transform:uppercase;color:var(--muted);font-weight:900;letter-spacing:.28px;white-space:nowrap}
.lb-row .pts{
  min-width:48px;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  line-height:1;
}
.pts-num{font-size:1.82rem;font-weight:950;color:var(--green);line-height:1}
.pts-unit{font-size:.54rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:900;margin-top:3px}
.crav-stat{background:rgba(0,132,61,.1)}
.corr-stat{background:rgba(0,39,118,.07)}
.err-stat{background:rgba(100,116,139,.1)}
.inv-stat{background:rgba(216,58,52,.09)}
.podio-stat{background:rgba(245,197,66,.16)}
.crav-stat .sv{color:var(--green)}
.corr-stat .sv{color:var(--blue)}
.err-stat .sv{color:#64748b}
.inv-stat .sv{color:var(--red)}
.podio-stat .sv{color:#9a7200}

/* GROUP TABLES */
.groups-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.group-card{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 8px 22px rgba(0,39,118,.06);transition:transform .16s ease,box-shadow .16s ease}
@media(hover:hover){.group-card:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(0,39,118,.12)}}
.group-title{display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(90deg,#eaf3ec,#f6faf3);border-bottom:1px solid var(--border);padding:10px 12px;font-size:.74rem;text-transform:uppercase;letter-spacing:.8px;font-weight:950;color:var(--blue)}
.group-title span:last-child{font-size:.6rem;letter-spacing:.4px;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:999px;padding:3px 9px;white-space:nowrap}
.group-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:.78rem;font-variant-numeric:tabular-nums}
.group-table th,.group-table td{padding:7px 4px;border-bottom:1px solid var(--border);text-align:center}
.group-table th{font-size:.58rem;text-transform:uppercase;color:var(--muted);font-weight:900;background:#fbfdf8}
.group-table td:first-child,.group-table th:first-child{width:44%;text-align:left;padding-left:10px;padding-right:5px}
.group-table th:not(:first-child),.group-table td:not(:first-child){width:7%}
.group-table tr:last-child td{border-bottom:0}
.team-cell{display:flex;align-items:center;gap:5px;min-width:0;font-weight:850}
.team-cell .team-name{white-space:normal}
.group-table .team-name{min-width:0;line-height:1.13;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
.group-table .flag,.group-table .pos-pill{flex:0 0 auto}
.group-table .pts-cell{font-weight:950;color:var(--green)}
.qual-row{background:#f3fff5}
.qual-row td:first-child{box-shadow:inset 3px 0 0 #34c77b}
.third-row{background:#fffdf0}
.third-row td:first-child{box-shadow:inset 3px 0 0 #f5c542}
.pos-pill{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#eef3f8;color:var(--muted);font-size:.68rem;font-weight:950}
.qual-row .pos-pill{background:#d1fae5;color:#065f46}
.third-row .pos-pill{background:#fff0a6;color:#725400}
.groups-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.groups-head-main{min-width:0}
.groups-head-title{font-size:1.05rem;font-weight:950;color:var(--text);line-height:1.12;margin-top:3px}
.groups-progress{flex:1;min-width:200px;max-width:340px;display:grid;gap:7px}
.groups-progress-label{display:flex;align-items:baseline;gap:7px;font-size:.76rem;font-weight:850;color:var(--muted)}
.groups-progress-label strong{font-size:1.2rem;color:var(--blue);font-weight:950;line-height:1}
.groups-progress-label .gp-rest{margin-left:auto;font-size:.64rem;text-transform:uppercase;letter-spacing:.5px;font-weight:900}
.groups-progress-bar{position:relative;height:8px;border-radius:999px;background:#e7eef6;overflow:hidden}
.groups-progress-bar:before{content:"";position:absolute;inset:0 auto 0 0;width:var(--gp,0%);border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--green))}
.groups-legend{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.legend-pill{display:inline-flex;align-items:center;gap:7px;font-size:.7rem;font-weight:850;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:999px;padding:5px 11px}
.legend-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.legend-dot.is-qual{background:#34c77b;box-shadow:0 0 0 3px rgba(52,199,123,.18)}
.legend-dot.is-third{background:#f5c542;box-shadow:0 0 0 3px rgba(245,197,66,.22)}
.legend-dot.is-live{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.22);animation:livePulse 1.6s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.45}}

/* FILTERS */
.fbar,.psel,.section-switch{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fbtn,.pbtn,.seg-btn{
  padding:8px 11px;
  border:1.5px solid var(--border);
  border-radius:8px;
  background:#fff;
  font-size:.76rem;
  font-weight:850;
  cursor:pointer;
  color:var(--muted);
}
.fbtn.active,.pbtn.active,.seg-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.pbtn.active{background:var(--green);border-color:var(--green)}
.section-switch{padding:4px;background:#eaf2e7;border:1px solid var(--border);border-radius:10px;width:max-content;max-width:100%}
.seg-btn{border-color:transparent;background:transparent}
.seg-btn.active{background:#fff;color:var(--blue);box-shadow:0 5px 16px rgba(0,39,118,.08)}

/* GAMES */
.phase-hdr{display:flex;align-items:center;gap:8px;font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:#fff;background:linear-gradient(90deg,var(--blue),var(--green));padding:8px 11px;border-radius:8px;margin:16px 0 8px;font-weight:950}
.game-row,.pal-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px;background:#fff;border:1px solid var(--border);border-radius:8px;margin-bottom:7px}
.gid{font-size:.68rem;color:var(--muted);font-weight:900}
.gteams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;min-width:0}
.team{display:flex;align-items:center;gap:7px;min-width:0;font-size:.86rem;font-weight:760}
.team.r{justify-content:flex-end;text-align:right}
.team.muted{color:var(--muted);font-weight:650}
.gteams .team,.pgn .team,.fixture-match .team{width:max-content;max-width:100%}
.gteams .team.r,.pgn .team.r,.fixture-match .team.r{justify-self:end}
.gteams .team:not(.r),.pgn .team:not(.r),.fixture-match .team:not(.r){justify-self:start}
.team-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flag{font-size:1.16rem;line-height:1;filter:saturate(1.08)}
.score-wrap{display:flex;align-items:center;gap:5px;justify-content:center}
.result-stack{display:flex;flex-direction:column;align-items:center;gap:4px}
.ko-advancer{display:flex;flex-direction:column;gap:4px;min-width:188px}
.ko-advancer.hidden{display:none}
.ko-advancer label,.advancer-badge{font-size:.62rem;font-weight:950;letter-spacing:.45px;text-transform:uppercase;color:var(--green);text-align:center}
.ko-advancer.muted label{color:var(--muted)}
.ko-advancer .txt-select{height:34px;padding:5px 8px;font-size:.72rem;font-weight:850;text-align:left}
.pal-tiebreak{min-width:0;margin-top:6px}
.bracket-card .pal-tiebreak{margin:8px 0 0;width:100%}
.pass-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.pass-btn{
  border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--blue);
  min-height:34px;padding:5px 7px;font-size:.68rem;font-weight:950;line-height:1.12;
}
.pass-btn.active{background:#e7f8ed;border-color:#9be3b8;color:var(--green);box-shadow:0 4px 12px rgba(0,140,74,.08)}
.pass-btn:disabled{opacity:.55;cursor:not-allowed}
.advancer-badge{background:#e7f8ed;border:1px solid #b8ebcb;border-radius:999px;padding:3px 8px;text-transform:none;letter-spacing:0}
.result-detail{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.62rem;font-weight:900;color:var(--muted)}
.result-detail-line{background:#f7faf2;border:1px solid var(--border);border-radius:6px;padding:3px 7px;color:var(--text)}
.penalty-detail{display:flex;flex-direction:column;gap:3px;align-items:center;background:#f7faf2;border:1px solid var(--border);border-radius:6px;padding:4px 7px}
.penalty-detail strong{font-size:.64rem;color:var(--text)}
.penalty-row{display:grid;grid-template-columns:minmax(42px,1fr) auto;gap:6px;align-items:center;width:100%}
.penalty-team{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.penalty-dots{display:flex;gap:3px;align-items:center;justify-content:flex-end}
.pen-dot{width:7px;height:7px;border-radius:999px;border:1px solid var(--border);background:#fff}
.pen-dot.made{background:var(--green);border-color:var(--green)}
.pen-dot.missed{background:var(--red);border-color:var(--red)}
.score-control{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;box-shadow:inset 0 1px 0 rgba(0,0,0,.02)}
.score-control input{width:42px;height:38px;border:0;text-align:center;font-size:.95rem;font-weight:950;color:var(--text);background:#fff}
.score-control input::-webkit-outer-spin-button,.score-control input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.score-control input[type=number]{appearance:textfield;-moz-appearance:textfield}
.step-btn{width:31px;height:38px;border:0;background:#eef4f0;color:var(--blue);font-size:1.1rem;font-weight:950}
.step-btn:hover{background:#e0ecff}
.ssep{color:var(--blue);font-weight:950;font-size:.95rem}
.btn-ok,.btn-x{border:none;border-radius:8px;font-weight:950;white-space:nowrap}
.btn-ok{background:var(--green);color:#fff;padding:10px 12px}
.btn-ok:disabled{opacity:.45;cursor:not-allowed}
.btn-x{background:#fee2e2;color:var(--red);padding:9px 10px}
.res{display:flex;align-items:center;gap:4px;font-weight:950;font-size:.94rem;flex-shrink:0}
.res .sc{background:var(--green);color:#fff;padding:4px 9px;border-radius:7px;min-width:28px;text-align:center}
.ko-note{background:#fffbe6;border:1px solid #f3df89;color:#725400;border-radius:8px;padding:10px 12px;font-size:.8rem;font-weight:750;margin-bottom:12px}

/* PALPITES — PREMIUM (compact) */
.pal-shell{display:grid;gap:14px;min-width:0}
.pal-shell>*{min-width:0}
.pal-hero{
  position:relative;
  overflow:hidden;
  border-radius:14px;
  padding:14px 16px;
  color:#fff;
  background:
    radial-gradient(110% 140% at 0% 0%,rgba(255,223,0,.18),transparent 55%),
    radial-gradient(120% 140% at 100% 100%,rgba(0,132,61,.5),transparent 60%),
    linear-gradient(135deg,#001b54 0%,#002776 45%,#004c2d 100%);
  box-shadow:0 18px 44px rgba(0,39,118,.24);
  border:1px solid rgba(255,255,255,.18);
}
.pal-hero:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 1px,transparent 1px 28px),
    radial-gradient(60% 80% at 80% 20%,rgba(255,223,0,.16),transparent 65%);
  mix-blend-mode:screen;opacity:.9;
}
.pal-hero-top{
  position:relative;display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:14px;align-items:center;
}
.pal-hero-title{display:flex;align-items:center;gap:12px;min-width:0}
.pal-hero-title h2{font-size:clamp(1.05rem,2.1vw,1.32rem);font-weight:950;letter-spacing:.2px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-hero-title .kicker{font-size:.6rem;letter-spacing:1.1px;text-transform:uppercase;font-weight:950;color:var(--yellow);line-height:1;display:block;margin-bottom:4px}
.pal-hero-avatar{
  width:42px;height:42px;border-radius:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:.95rem;font-weight:950;color:#1a1300;
  background:linear-gradient(135deg,#ffdf00,#f5c542);
  box-shadow:0 6px 14px rgba(0,0,0,.22);
}
.pal-hero-metrics{
  position:relative;display:flex;gap:6px;flex-wrap:nowrap;
  min-width:0;
}
.pal-metric{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  border-radius:10px;padding:6px 10px;min-width:0;
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;
}
.pal-metric .lbl{font-size:.54rem;text-transform:uppercase;letter-spacing:.8px;font-weight:900;opacity:.78;white-space:nowrap}
.pal-metric .val{font-size:1.05rem;font-weight:950;line-height:1.05;color:#fff;display:flex;align-items:baseline;gap:3px;white-space:nowrap}
.pal-metric .val small{font-size:.6rem;font-weight:800;opacity:.7;letter-spacing:.4px}
.pal-metric.accent{background:linear-gradient(135deg,rgba(255,223,0,.92),rgba(245,197,66,.82));color:#1a1300;border-color:rgba(255,255,255,.5);box-shadow:0 6px 14px rgba(255,223,0,.22)}
.pal-metric.accent .lbl,.pal-metric.accent .val{color:#1a1300}
.pal-progress-bar{position:relative;width:100%;height:4px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:4px}
.pal-progress-fill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,var(--yellow),#9fffb6);border-radius:99px;transition:width .4s ease}

/* Hero bottom row: people + stages */
.pal-hero-bottom{
  position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;
  gap:10px;align-items:center;margin-top:12px;
}

/* Participant selector — compact pills */
.pal-people{
  display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;
  scrollbar-width:thin;min-width:0;
}
.pal-people::-webkit-scrollbar{height:5px}
.pal-people::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:99px}
.pal-person{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;
  padding:5px 11px 5px 5px;border-radius:99px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-weight:850;font-size:.74rem;white-space:nowrap;
  cursor:pointer;transition:transform .15s,background .15s,border-color .15s;line-height:1;
}
.pal-person:hover{background:rgba(255,255,255,.18)}
.pal-person .avatar{
  width:24px;height:24px;border-radius:50%;
  background:linear-gradient(135deg,#ffdf00,#f5c542);color:#1a1300;
  display:flex;align-items:center;justify-content:center;
  font-size:.66rem;font-weight:950;letter-spacing:.3px;
  box-shadow:0 3px 8px rgba(0,0,0,.18);
}
.pal-person.active{background:#fff;color:var(--blue);border-color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.pal-person.active .avatar{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff}
.pal-person.self:after{content:"você";font-size:.5rem;font-weight:950;text-transform:uppercase;letter-spacing:.5px;padding:2px 5px;border-radius:99px;background:rgba(255,223,0,.92);color:#1a1300;margin-left:2px}

/* Stage segmented — compact 3 stages */
.pal-stages{
  display:flex;gap:4px;flex-shrink:0;
  padding:4px;border-radius:11px;background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.16);
  min-width:0;
}
.pal-stage{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:8px;background:transparent;border:0;color:rgba(255,255,255,.78);
  font-size:.74rem;font-weight:900;cursor:pointer;transition:background .18s,color .18s;white-space:nowrap;
}
.pal-stage .ico{font-size:.95rem;line-height:1}
.pal-stage:hover{background:rgba(255,255,255,.08);color:#fff}
.pal-stage.active{background:#fff;color:var(--blue);box-shadow:0 6px 14px rgba(0,0,0,.18)}

/* Filter bar inside main panel */
.pal-filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pal-filters .fbar{margin-bottom:0;flex:1;min-width:0}
.progress-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:7px 12px;
  border:1px solid #d8e5ff;
  border-radius:999px;
  background:#f5f9ff;
  color:var(--blue);
  font-size:.76rem;
  font-weight:950;
  white-space:nowrap;
}
.pal-stage-note{
  background:linear-gradient(135deg,#fffbe6,#fff7c2);
  border:1px solid #f3df89;color:#725400;
  border-radius:10px;padding:11px 13px;font-size:.78rem;font-weight:800;margin-bottom:12px;
  display:flex;gap:9px;align-items:flex-start;
}
.pal-stage-note .ic{font-size:.95rem;line-height:1.2}

/* ==== PREMIUM FIXTURE CARD (palpite-card) ==== */
.pal-card{
  position:relative;
  display:grid;
  grid-template-columns:88px minmax(0,1fr) auto;
  gap:14px;align-items:center;
  background:linear-gradient(180deg,#fff,#fbfdf8);
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px 14px;
  margin-bottom:8px;
  box-shadow:0 6px 18px rgba(0,39,118,.05);
  transition:transform .15s,box-shadow .2s,border-color .2s;
  min-width:0;
}
.pal-card:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(0,39,118,.08);border-color:#cbd9eb}
.pal-card.is-live{border-color:#7ed1a1;background:linear-gradient(180deg,#f4fff7,#fff)}
.pal-card.is-locked{background:linear-gradient(180deg,#fbfcfe,#f5f7fa)}
.pal-card.is-waiting{background:linear-gradient(180deg,#fafbfd,#fff);border-style:dashed}
.pal-card.is-hit{border-color:#7ed1a1;background:linear-gradient(180deg,#f3fff6,#fff)}

.pal-card-meta{
  display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0;
}
.pal-card-date{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 9px;border-radius:8px;
  background:linear-gradient(135deg,var(--blue),#003a9e);color:#fff;
  font-size:.7rem;font-weight:950;letter-spacing:.2px;line-height:1;
  box-shadow:0 4px 10px rgba(0,39,118,.16);
}
.pal-card-date .wd{font-size:.55rem;text-transform:uppercase;letter-spacing:.6px;opacity:.85;font-weight:900}
.pal-card-date .dm{font-weight:950}
.pal-card-time{
  font-size:.7rem;font-weight:900;color:var(--muted);letter-spacing:.3px;
  display:inline-flex;align-items:center;gap:4px;
}
.pal-card-time:before{content:"";width:5px;height:5px;border-radius:50%;background:#a3aab6;display:inline-block}
.pal-card.is-live .pal-card-time:before{background:var(--green);animation:livePulse 1.4s ease-in-out infinite}
.pal-card.is-live .pal-card-time{color:var(--green-2)}
@keyframes livePulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}
.pal-card-gid{
  font-size:.55rem;letter-spacing:.6px;font-weight:900;
  color:#a3aab6;text-transform:uppercase;line-height:1;
}

.pal-card-body{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;gap:10px;min-width:0;
}
.pal-card-team{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0;
  font-size:.82rem;font-weight:850;color:var(--text);text-align:center;
  padding:2px 4px;
}
.pal-card-team .flag{
  font-size:2.6rem;line-height:1;
  filter:saturate(1.08) drop-shadow(0 3px 6px rgba(0,0,0,.12));
  flex-shrink:0;
}
.pal-card-team .nm{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:100%;
  letter-spacing:.1px;
}
.pal-card-team.muted{color:var(--muted);font-weight:700}
.pal-card-team.muted .flag{opacity:.55}

.pal-card-score{
  display:flex;align-items:center;gap:7px;flex-shrink:0;
}
.pal-card-main{
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;
}
.pal-card-score .ssep{color:var(--muted);font-weight:950;font-size:.92rem}
.pal-card-score .score-control{box-shadow:0 4px 10px rgba(0,39,118,.08)}
.pal-card-status{
  font-size:.58rem;font-weight:900;letter-spacing:.6px;text-transform:uppercase;
  color:var(--muted);text-align:center;margin-top:4px;
}
.pal-card-status.live{color:var(--green-2)}
.pal-card-status.locked{color:#a3aab6}

.pal-state-slot{
  display:flex;justify-content:center;margin-top:7px;min-height:0;
}
.pal-state-chips{
  display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;
}
.pal-state-chip{
  display:inline-flex;align-items:center;gap:5px;
  min-height:20px;padding:3px 7px;border-radius:999px;
  border:1px solid #b8ebcb;background:#edfdf3;color:var(--green-2);
  font-size:.56rem;font-weight:950;letter-spacing:.45px;text-transform:uppercase;
  line-height:1;white-space:nowrap;
}
.pal-state-chip .dot{width:6px;height:6px;border-radius:999px;background:currentColor;box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.pal-state-chip.saving{background:#eef5ff;border-color:#cfe0ff;color:var(--blue)}
.pal-state-chip.local{background:#fff8d7;border-color:#f3df89;color:#725400}
.pal-state-chip.closed{background:#fff1f2;border-color:#fecdd3;color:var(--red)}
.pal-state-chips.compact{justify-content:flex-start}
.bracket-card .pal-state-slot{justify-content:flex-start;margin-top:8px}
.bracket-card .pal-state-chip{font-size:.51rem;padding:3px 6px;min-height:18px}

.pal-card-result{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  margin-top:3px;font-size:.65rem;font-weight:900;color:var(--muted);
}
.pal-card-result .real{
  display:inline-flex;gap:5px;align-items:center;background:#f7faf2;border:1px solid var(--border);
  padding:3px 7px;border-radius:6px;color:var(--text);font-weight:950;font-size:.7rem;
}
.pal-card-result .result-detail{font-size:.58rem}
.pal-card-result .penalty-detail{max-width:220px}

.pal-self-compare,.pal-hidden-note{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-width:0;max-width:100%;margin-top:7px;
  padding:4px 9px;border-radius:999px;
  font-size:.62rem;font-weight:950;line-height:1;
  border:1px solid #d8e5ff;background:#f5f9ff;color:var(--blue);
  white-space:nowrap;
}
.pal-self-compare.same{border-color:#d8e5ff;background:#f5f9ff;color:var(--blue)}
.pal-self-compare.incomplete{border-style:dashed;color:#6b7280;background:#f8fafc}
.pal-self-label,.pal-hidden-note .label{
  font-size:.5rem;text-transform:uppercase;letter-spacing:.55px;color:inherit;opacity:.72;
}
.pal-self-score{display:inline-flex;align-items:center;gap:4px}
.pal-self-score b{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;padding:0 5px;border-radius:6px;
  background:#fff;color:var(--text);box-shadow:inset 0 0 0 1px rgba(0,39,118,.08);
}
.pal-self-adv{
  min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;
  color:#475569;font-size:.56rem;font-weight:900;
}
.pal-hidden-note{border-color:#e4eaf2;background:#f8fafc;color:#64748b}
.pal-hidden-note .dot{width:6px;height:6px;border-radius:999px;background:currentColor;opacity:.62;flex-shrink:0}
.bracket-card .pal-self-compare,.bracket-card .pal-hidden-note{
  align-self:flex-start;margin-top:4px;padding:3px 6px;font-size:.51rem;gap:4px;
}
.bracket-card .pal-self-label,.bracket-card .pal-hidden-note .label{font-size:.46rem}
.bracket-card .pal-self-score b{min-width:16px;height:16px;padding:0 4px;border-radius:5px}
.bracket-card .pal-self-adv{display:none}

.pal-card-badge{
  display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;min-width:50px;
}
.pal-card-badge .sbadge{
  width:34px;height:34px;border-radius:11px;font-size:.78rem;
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:950;letter-spacing:.2px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}
.pal-card-badge .lbl{font-size:.5rem;font-weight:900;letter-spacing:.55px;text-transform:uppercase;color:var(--muted)}

/* Score badges (reused) */
.sbadge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:.68rem;font-weight:950;flex-shrink:0}
.b3{background:linear-gradient(135deg,#a7f3c8,#22c55e);color:#053822}
.b1{background:linear-gradient(135deg,#bfd3ff,#3b82f6);color:#0c2e75}
.bn2{background:linear-gradient(135deg,#ffc8c6,#ef4444);color:#5a0e0e}
.b0{background:linear-gradient(135deg,#e5e7eb,#cbd5e1);color:#475569}
.bem{background:#f3f4f6;color:#a3aab6;box-shadow:none}

/* ==== KNOCKOUT BRACKET (flow-based, self-centering) ==== */
.bracket-wrap{
  display:flex;align-items:stretch;
  gap:clamp(14px,1.5vw,26px);
  min-width:1180px;width:100%;
  padding:6px 6px 10px;
}
.bracket-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.bracket-col-head{
  font-size:.62rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;
  color:var(--blue);text-align:center;padding-bottom:9px;margin-bottom:6px;
  border-bottom:1.5px dashed #cfdcf0;
}
.bracket-col-body{
  flex:1 1 auto;display:flex;flex-direction:column;
  justify-content:space-around;gap:12px;position:relative;
}
/* connector ticks: each match emits a short inward line toward the next round */
.bracket-col--left  .bracket-card::after,
.bracket-col--right .bracket-card::after{
  content:"";position:absolute;top:50%;width:clamp(12px,1.1vw,20px);height:2px;
  background:#c2d2ea;border-radius:2px;
}
.bracket-col--left  .bracket-card::after{left:100%}
.bracket-col--right .bracket-card::after{right:100%}

.bracket-card{
  position:relative;border:1.5px solid var(--border);background:#fff;border-radius:11px;
  padding:8px 9px;display:flex;flex-direction:column;gap:5px;
  box-shadow:0 4px 12px rgba(0,39,118,.06);
  transition:transform .15s,box-shadow .2s,border-color .2s;min-width:0;
}
.bracket-card:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(0,39,118,.1);border-color:#cbd9eb}
.bracket-card.waiting{background:#fafbfd;border-style:dashed;opacity:.9}
.bracket-card.live{border-color:#7ed1a1;background:linear-gradient(180deg,#f7fff9,#fff)}
.bracket-card.hit{border-color:#7ed1a1;background:linear-gradient(180deg,#f3fff6,#fff)}
.bracket-card.final{border-color:#f0d77e;background:linear-gradient(180deg,#fffaea,#fff);
  box-shadow:0 12px 28px rgba(245,197,66,.18);border-width:2px}

.bracket-card .bk-meta{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:.52rem;font-weight:900;letter-spacing:.4px;color:var(--muted);text-transform:uppercase;
}
.bracket-card .bk-meta span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bracket-card .bk-meta .date{color:var(--blue);font-weight:950;white-space:nowrap;flex-shrink:0;text-align:right}

.bracket-card .bk-row{
  display:grid;grid-template-columns:minmax(0,1fr) 40px;align-items:center;gap:7px;
  font-size:.76rem;font-weight:800;color:var(--text);min-width:0;
}
.bracket-card .bk-row.muted{color:var(--muted);font-weight:700}
.bracket-card .bk-row .nm{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.bracket-card .bk-row .nm .flag{font-size:.95rem;flex-shrink:0;line-height:1}
.bracket-card .bk-row .nm .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* placeholder rows ("Vencedor M73") wrap to 2 lines instead of clipping to "Venced..." */
.bracket-card .bk-row.muted .nm .txt{
  white-space:normal;overflow:visible;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.15;
}
.bracket-card .bk-row input{
  width:100%;height:30px;border:1.2px solid var(--border);border-radius:7px;
  text-align:center;font-size:.82rem;font-weight:950;color:var(--text);background:#fff;-moz-appearance:textfield;
}
.bracket-card .bk-row input::-webkit-outer-spin-button,
.bracket-card .bk-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.bracket-card .bk-row input:disabled{background:#f4f7f5;color:#9aa3b2}
.bracket-card .bk-divider{height:1px;background:#eef2f7}
.bracket-card .bk-badge{
  position:absolute;top:-8px;right:10px;font-size:.55rem;font-weight:950;letter-spacing:.35px;
  padding:2px 8px;border-radius:99px;color:#fff;
  background:linear-gradient(135deg,var(--blue),#003a9e);box-shadow:0 4px 10px rgba(0,39,118,.18);
}
.bracket-card.hit .bk-badge{background:linear-gradient(135deg,#22c55e,#047857)}
.bracket-card.final .bk-badge{background:linear-gradient(135deg,#f5c542,#b48400);color:#3a2700}
/* soften the repeated deadline chip so 15 of them don't read as alarms */
.bracket-card .pal-state-chip.closed{background:#f4f6fa;border-color:#e4e9f1;color:#8a93a3}

/* final column: trophy + final + 3rd place, centered as a group */
.bracket-col--final .bracket-col-body{justify-content:center;gap:10px}
.bracket-trophy{
  text-align:center;font-size:1.7rem;line-height:1;
  filter:drop-shadow(0 6px 12px rgba(245,197,66,.45));
  animation:trophyFloat 4s ease-in-out infinite;
}
@keyframes trophyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bracket-third-card{
  background:linear-gradient(180deg,#fffdf9,#fff);
  border:1.5px dashed #e7d2bc;border-radius:12px;padding:9px;margin-top:4px;
  box-shadow:0 6px 14px rgba(201,135,71,.08);
}
.bracket-third-head{
  display:flex;align-items:center;gap:6px;margin-bottom:7px;
  font-size:.58rem;font-weight:900;color:#9a6a41;letter-spacing:.5px;text-transform:uppercase;
}
.bracket-third-head .ic{font-size:.92rem}
.bracket-third-card .bracket-card{box-shadow:none;border-style:dashed}

.bracket-stage{
  background:rgba(255,253,244,.86);
  border:1px solid rgba(220,229,216,.9);
  border-radius:12px;padding:14px;
  box-shadow:var(--shadow);
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:thin;
}
.bracket-stage::-webkit-scrollbar{height:6px}
.bracket-stage::-webkit-scrollbar-thumb{background:#cbd9eb;border-radius:99px}

/* R32 separate compact grid */
.r32-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:8px;margin-top:8px;
}
.r32-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin:6px 0 4px;font-size:.66rem;font-weight:900;color:var(--blue);
  text-transform:uppercase;letter-spacing:.7px;
}
.r32-head .count{font-size:.6rem;color:var(--muted);font-weight:800}

/* Mobile / narrow knockout list (chronological) */
.ko-mobile-list{display:none;flex-direction:column;gap:16px}
.ko-mobile-section{display:flex;flex-direction:column;gap:8px}
.ko-mobile-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  font-size:.66rem;font-weight:900;color:var(--blue);
  text-transform:uppercase;letter-spacing:.7px;
  padding:6px 10px;border-radius:8px;
  background:linear-gradient(90deg,rgba(0,39,118,.08),rgba(0,132,61,.04));
}
.ko-mobile-head .count{font-size:.6rem;color:var(--muted);font-weight:800}
.ko-mobile-cards{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;
}
.ko-mobile-section.final-section .ko-mobile-head{
  background:linear-gradient(90deg,#fff4c8,#fff);color:#7a5600;
}
.ko-mobile-section.p3-section .ko-mobile-head{
  background:linear-gradient(90deg,#fff0df,#fff);color:#915221;
}

/* ===== PÓDIO — PREMIUM ===== */
.podio-shell{display:grid;gap:18px}
.podio-section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.podio-section-head h3{font-size:1.05rem;font-weight:950;color:var(--text);letter-spacing:.2px}
.podio-section-head p{font-size:.78rem;color:var(--muted);margin-top:4px;line-height:1.5}
.podio-status-chip{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 11px;border-radius:99px;
  font-size:.7rem;font-weight:900;letter-spacing:.3px;
  background:#eef5ff;color:var(--blue);border:1px solid #d8e5ff;
}
.podio-status-chip.locked{background:#fff3e0;color:#a8550a;border-color:#ffd8a1}
.podio-status-chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.8}

.podium-cards{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;
}
.podium-card{
  position:relative;
  border-radius:14px;
  padding:16px 14px 14px;
  background:#fff;
  border:1px solid var(--border);
  box-shadow:0 14px 32px rgba(0,39,118,.08);
  overflow:hidden;
  display:flex;flex-direction:column;gap:11px;
  transition:transform .2s,box-shadow .2s;
}
.podium-card:before{
  content:"";position:absolute;left:0;top:0;right:0;height:5px;
  background:linear-gradient(90deg,transparent,currentColor,transparent);opacity:.85;
}
.podium-card .crown{
  position:absolute;top:-22px;right:-20px;font-size:5.2rem;opacity:.08;transform:rotate(18deg);
}
.podium-card .pos-line{display:flex;align-items:center;gap:9px;min-width:0}
.podium-medal{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.18rem;font-weight:950;color:#fff;
  background:linear-gradient(135deg,#888,#bbb);
  box-shadow:0 8px 16px rgba(0,0,0,.18);flex-shrink:0;
}
.podium-card .pos-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.podium-card .pos-info .lbl{font-size:.66rem;font-weight:900;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.podium-card .pos-info .ttl{font-size:1rem;font-weight:950;color:var(--text);line-height:1}
.podium-card .pts-pill{
  margin-left:auto;
  display:inline-flex;align-items:baseline;justify-content:center;gap:3px;
  min-width:58px;
  padding:6px 9px;border-radius:999px;
  font-size:.66rem;font-weight:950;line-height:1;white-space:nowrap;
  color:var(--podium-points-text);
  background:var(--podium-points-bg);
  border:1px solid var(--podium-points-border);
  box-shadow:0 8px 18px var(--podium-points-shadow);
  flex-shrink:0;
}
.podium-card .pts-pill strong{font-size:.76rem;color:inherit}
.podium-card .pts-pill span{font-size:.58rem;color:inherit;text-transform:uppercase;letter-spacing:.35px;opacity:.82}
.podium-card .country-input{display:flex;flex-direction:column;gap:6px}
.podium-card input{
  width:100%;border:1.6px solid var(--border);border-radius:10px;
  padding:11px 12px;font-size:.92rem;font-weight:850;background:#fff;text-align:left;
}
.podium-card input:focus{outline:none;border-color:currentColor;box-shadow:0 0 0 3px rgba(0,39,118,.12)}
.podium-card .country-display{
  display:flex;align-items:center;gap:9px;
  padding:11px 12px;border:1.6px dashed var(--border);border-radius:10px;
  font-size:.9rem;font-weight:900;color:var(--text);min-height:46px;background:#fafdf3;
}
.podium-card .country-display.empty{color:var(--muted);font-weight:700;font-style:italic;border-style:dashed}
.podium-card .country-display .flag{font-size:1.4rem}
.podium-card.gold{color:#b48400;background:linear-gradient(180deg,#fffaea 0%,#fff 60%);border-color:#f0d77e;--podium-points-text:#805800;--podium-points-bg:#fff3bf;--podium-points-border:#efd06a;--podium-points-shadow:rgba(180,132,0,.16)}
.podium-card.gold .podium-medal{background:linear-gradient(135deg,#fff1a8,#f5c542 60%,#b48400);color:#5a3d00;border:2px solid #fff1a8}
.podium-card.silver{color:#5f6c7d;background:linear-gradient(180deg,#f6f9fc 0%,#fff 60%);border-color:#cdd6e0;--podium-points-text:#4b5b6f;--podium-points-bg:#edf2f7;--podium-points-border:#c5d0dc;--podium-points-shadow:rgba(95,108,125,.14)}
.podium-card.silver .podium-medal{background:linear-gradient(135deg,#e7ecf2,#b9c3cf 60%,#7f8b9b);color:#fff}
.podium-card.bronze{color:#915221;background:linear-gradient(180deg,#fff4e9 0%,#fff 60%);border-color:#e3b793;--podium-points-text:#7a3f12;--podium-points-bg:#ffe5ca;--podium-points-border:#e2ab79;--podium-points-shadow:rgba(145,82,33,.14)}
.podium-card.bronze .podium-medal{background:linear-gradient(135deg,#f3c79a,#c98747 60%,#7d4715);color:#fff}
.podium-card.fourth{color:var(--blue);background:linear-gradient(180deg,#eef4fb 0%,#fff 60%);border-color:#cfdcf0;--podium-points-text:#173d83;--podium-points-bg:#e7efff;--podium-points-border:#bed0f2;--podium-points-shadow:rgba(0,39,118,.14)}
.podium-card.fourth .podium-medal{background:linear-gradient(135deg,#dbe7f6,var(--blue) 80%);color:#fff}

/* Locked / muted state */
.podium-card.locked .country-input input{background:#f6f8fa;color:#7c8693}
.podium-locked-note{
  margin-top:8px;font-size:.74rem;color:var(--muted);
  display:flex;gap:7px;align-items:center;
}

/* My pódio mini-summary */
.my-podio-summary{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(135deg,#fff,#fbfff3);
  border:1px dashed #c7d7f0;border-radius:12px;padding:11px 14px;
  margin-top:14px;font-size:.8rem;font-weight:800;color:var(--text);
}
.my-podio-summary .label{color:var(--muted);font-weight:850;text-transform:uppercase;font-size:.65rem;letter-spacing:.7px}
.my-podio-summary .score-pill{
  background:var(--green);color:#fff;padding:6px 11px;border-radius:99px;font-weight:950;font-size:.78rem;
}
.my-podio-summary .score-pill.empty{background:#eef3f8;color:var(--muted)}

/* Participants podium leaderboard */
.podio-board{
  background:#fff;border:1px solid var(--border);border-radius:14px;
  box-shadow:0 14px 32px rgba(0,39,118,.06);overflow:hidden;
}
.podio-board-head{
  padding:14px 16px;background:linear-gradient(135deg,#f7faf2,#fff);
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;
}
.podio-board-head h3{font-size:1rem;font-weight:950;color:var(--text)}
.podio-board-head p{font-size:.76rem;color:var(--muted);margin-top:3px}
.podio-board-legend{display:flex;gap:8px;flex-wrap:wrap}
.podio-legend-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:.66rem;font-weight:900;color:var(--text);background:#f7faf2;border:1px solid var(--border)}
.podio-legend-chip .sw{width:9px;height:9px;border-radius:50%}
.podio-list{display:grid;gap:8px;padding:12px}
.podio-entry{
  display:grid;grid-template-columns:36px minmax(140px,1.05fr) minmax(0,2.2fr) auto;
  align-items:center;gap:14px;
  padding:11px 14px;border-radius:12px;
  background:#fff;border:1px solid var(--border);
  transition:transform .15s,box-shadow .2s,border-color .2s;
}
.podio-entry:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(0,39,118,.08);border-color:#cbd9eb}
.podio-entry.me{border-color:#9fc5ff;background:linear-gradient(110deg,#f7fbff,#fff 48%,#f7fbff)}
.podio-entry .pe-avatar{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:950;font-size:.78rem;
}
.podio-entry .pe-name{font-weight:900;font-size:.9rem;color:var(--text);min-width:0;display:flex;flex-direction:column;gap:2px}
.podio-entry .pe-name .you{font-size:.6rem;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:var(--blue)}
.podio-entry .pe-picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;min-width:0}
.pe-pick{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:6px 8px;border-radius:9px;background:#fafcff;border:1px solid #e5ecf6;
  font-size:.76rem;font-weight:850;color:var(--text);min-width:0;
}
.pe-pick .pos{font-size:.55rem;font-weight:900;letter-spacing:.5px;color:var(--muted);text-transform:uppercase}
.pe-pick .country{display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.pe-pick .country .flag{font-size:1rem;flex-shrink:0}
.pe-pick .country .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pe-pick.hit{background:#d1fae5;border-color:#7ed1a1;color:#065f46}
.pe-pick.miss{background:#fff;border-color:#e5ecf6;color:var(--muted)}
.pe-pick.empty{background:#f6f8fa;border-style:dashed;color:#a3aab6}
.pe-pick.hit .pos{color:#04714b}
.podio-entry .pe-score{
  display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;flex-shrink:0;
}
.podio-entry .pe-score .pts{font-size:1.35rem;font-weight:950;color:var(--green);line-height:1}
.podio-entry .pe-score.empty .pts{color:#a3aab6}
.podio-entry .pe-score .lbl{font-size:.55rem;font-weight:900;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}

/* Inputs reused */
.txt-inp,.txt-select{width:100%;min-width:92px;border:1.5px solid var(--border);border-radius:7px;padding:8px;font-size:.82rem;text-align:center;background:#fff}
.txt-inp:focus,.txt-select:focus{outline:none;border-color:var(--blue)}
.ppts{font-weight:950;color:var(--green)}

/* CONFIG */
.cfg-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.cfg-row:last-child{border-bottom:0}
.cfg-row.profile-row{align-items:flex-start}
.cfg-lbl{flex:1}.cfg-lbl strong{display:block;font-size:.9rem}.cfg-lbl span{font-size:.74rem;color:var(--muted)}
.cfg-inp{border:1.5px solid var(--border);border-radius:7px;padding:8px 10px;font-size:.9rem;width:92px;text-align:center;background:#fff}
.rules-box{font-size:.84rem;line-height:1.95;color:#435064}
.rules-box strong{color:var(--text)}
.action-row{display:flex;gap:9px;flex-wrap:wrap}
.cfg-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.action-btn,.action-label{flex:1;min-width:170px;padding:12px;background:var(--green);color:#fff;border:none;border-radius:8px;font-weight:900;cursor:pointer;font-size:.84rem;text-align:center}
.action-label{background:var(--blue)}
.action-btn.secondary{background:#eef4ff;color:var(--blue);border:1px solid #d8e5ff}
.role-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:.68rem;font-weight:950;letter-spacing:.3px;border:1px solid rgba(0,39,118,.12);background:#eef5ff;color:var(--blue)}
.role-chip.admin{background:#fff8d6;border-color:rgba(245,197,66,.55);color:#7a5600}
.role-chip.participant{background:#edf7f0;border-color:rgba(0,132,61,.18);color:var(--green-2)}
.sync-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}
.sync-pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:8px 11px;font-size:.74rem;font-weight:900;background:#fff;color:var(--blue)}
.sync-dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.sync-pill.ok .sync-dot{background:var(--green)}
.sync-pill.warn .sync-dot{background:var(--gold)}
.sync-pill.err .sync-dot{background:var(--red)}
.login-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:10px}

/* ==== BRASILEIRAO TEST LAB: remove this block after the Copa integration is ready ==== */
.api-test-page{display:grid;gap:12px}
.api-test-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,.42fr);gap:14px;align-items:start}
.api-test-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.api-test-form label{font-size:.66rem;text-transform:uppercase;letter-spacing:.65px;color:var(--muted);font-weight:950}
.api-test-form .txt-inp,.api-test-form .txt-select{text-align:left;height:40px}
.api-test-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.api-test-actions .action-btn{flex:0 0 auto;min-width:150px;padding:10px 12px}
.api-test-warning{
  margin-top:10px;
  padding:10px 11px;
  border-radius:8px;
  border:1px solid #f0d899;
  background:#fff8d7;
  color:#6f4c00;
  font-size:.78rem;
  line-height:1.45;
}
.api-test-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.api-test-metric{border:1px solid var(--border);border-radius:8px;background:#fff;padding:10px}
.api-test-metric strong{display:block;font-size:1.22rem;line-height:1;color:var(--blue);font-weight:950}
.api-test-metric span{display:block;margin-top:6px;font-size:.62rem;letter-spacing:.55px;text-transform:uppercase;color:var(--muted);font-weight:900}
.api-test-filters{display:grid;grid-template-columns:minmax(0,1fr) 150px 170px auto;gap:8px;margin-bottom:10px;align-items:center}
.api-test-filters .txt-inp,.api-test-filters .txt-select{text-align:left}
.api-test-filters .action-btn{min-width:0;flex:0 0 auto;width:max-content;padding:9px 11px;font-size:.72rem;white-space:nowrap}
.api-test-list{display:grid;gap:14px}
.api-test-day{
  display:grid;
  gap:8px;
  padding:10px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#f8fbf1;
}
.api-test-day-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:0 2px 2px;
}
.api-test-day-title{font-size:.78rem;font-weight:950;color:var(--blue)}
.api-test-day-count{font-size:.64rem;font-weight:950;text-transform:uppercase;letter-spacing:.55px;color:var(--muted)}
.api-test-day-games{display:grid;gap:10px}
.api-test-game{
  position:relative;
  display:grid;
  grid-template-columns:96px minmax(0,1fr) 50px;
  gap:10px;
  align-items:center;
  border:1px solid var(--border);
  border-radius:10px;
  background:linear-gradient(180deg,#fff,#fbfdf8);
  padding:10px 12px;
  box-shadow:0 6px 18px rgba(0,39,118,.05);
  transition:transform .15s,box-shadow .2s,border-color .2s;
  min-width:0;
  overflow:hidden;
}
.api-test-game:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:4px;
  background:#9fc5ff;
}
.api-test-game:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(0,39,118,.08);border-color:#cbd9eb}
.api-test-game.is-upcoming{min-height:96px;border-color:#b3cdea;background:linear-gradient(180deg,#f6faff,#fff)}
.api-test-game.is-upcoming:before{background:#2563eb}
.api-test-game.is-closed{min-height:96px;border-color:#fed7aa;background:linear-gradient(180deg,#fff7ed,#fff)}
.api-test-game.is-closed:before{background:#f59e0b}
.api-test-game.is-live{
  grid-template-columns:104px minmax(0,1fr);
  gap:12px;
  padding:14px 14px;
  border-color:#61c58d;
  background:linear-gradient(180deg,#f1fff6,#fff);
  box-shadow:0 0 0 1px rgba(16,185,129,.16),0 12px 28px rgba(0,132,61,.16);
}
.api-test-game.is-live:before{background:var(--green)}
.api-test-game.is-live.is-waiting-live{border-color:#a9dfc0;background:linear-gradient(180deg,#f7fff9,#fff)}
.api-test-game.is-live-only{grid-template-columns:104px minmax(0,1fr)}
.api-test-game.is-final{
  grid-template-columns:76px minmax(0,1fr) 44px;
  gap:8px;
  padding:8px 10px;
  border-radius:8px;
  border-color:#cdd6e2;
  background:linear-gradient(180deg,#eef2f7,#fff);
  box-shadow:0 3px 10px rgba(15,23,42,.05);
}
.api-test-game.is-final:before{background:#475569}
.api-test-game.is-final:hover{box-shadow:0 7px 16px rgba(15,23,42,.09)}
.api-test-game.is-locked{background:linear-gradient(180deg,#fbfcfe,#f5f7fa)}
.api-test-game.is-hit{border-color:#7ed1a1;background:linear-gradient(180deg,#f3fff6,#fff)}
.api-test-game.is-saved{border-color:#9fc5ff;background:linear-gradient(180deg,#f7fbff,#fff)}
.api-test-game.is-live.is-saved,.api-test-game.is-live.is-hit{border-color:#7ed1a1;background:linear-gradient(180deg,#f4fff7,#fff)}
.api-test-game.is-live.is-waiting-live.is-saved{border-color:#a9dfc0;background:linear-gradient(180deg,#f7fff9,#fff)}
.api-test-game.is-final.is-saved,.api-test-game.is-final.is-hit{border-color:#cdd6e2;background:linear-gradient(180deg,#eef2f7,#fff)}
.api-test-meta{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0;padding-left:2px}
.api-test-state-tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:20px;
  padding:3px 8px;
  border:1px solid var(--border);
  border-radius:999px;
  background:#eef5ff;
  color:var(--blue);
  font-size:.54rem;
  font-weight:950;
  letter-spacing:.55px;
  line-height:1;
  text-transform:uppercase;
  white-space:nowrap;
}
.api-test-state-tag.live{border-color:rgba(16,185,129,.4);background:#ecfdf5;color:#047857}
.api-test-state-tag.final{border-color:#94a3b8;background:#e2e8f0;color:#334155}
.api-test-state-tag.final:before{content:"\2713";margin-right:4px;font-weight:950;color:#475569}
.api-test-state-tag.final.unconfirmed{border-color:#fcd34d;background:#fef9c3;color:#92400e}
.api-test-state-tag.final.unconfirmed:before{content:"\26A0";color:#b45309}
.api-test-state-tag.upcoming{border-color:#93b8f0;background:#dbeafe;color:#174ea6}
.api-test-state-tag.closed{border-color:#fdba74;background:#ffedd5;color:#9a3412}
.api-test-date{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 9px;border-radius:8px;
  background:linear-gradient(135deg,var(--blue),#003a9e);color:#fff;
  font-size:.7rem;font-weight:950;letter-spacing:.2px;line-height:1;
  box-shadow:0 4px 10px rgba(0,39,118,.16);
}
.api-test-time{
  font-size:.7rem;font-weight:900;color:var(--muted);letter-spacing:.3px;
  display:inline-flex;align-items:center;gap:4px;
}
.api-test-time:before{content:"";width:5px;height:5px;border-radius:50%;background:#a3aab6;display:inline-block}
.api-test-game.is-live .api-test-time:before{background:var(--green);animation:livePulse 1.4s ease-in-out infinite}
.api-test-game.is-live .api-test-time{color:var(--green-2)}
.api-test-round,.api-test-status{font-size:.58rem;font-weight:900;letter-spacing:.55px;text-transform:uppercase;color:var(--muted);line-height:1.25}
.api-test-round{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.api-test-status{color:#a3aab6}
.api-test-game.is-final .api-test-round{display:none}
.api-test-body{
  display:grid;
  grid-template-columns:minmax(94px,1fr) minmax(150px,216px) minmax(94px,1fr);
  align-items:center;gap:8px;min-width:0;
}
.api-test-game.is-live .api-test-body{grid-template-columns:minmax(110px,1fr) minmax(180px,256px) minmax(110px,1fr);gap:12px}
.api-test-game.is-final .api-test-body{grid-template-columns:minmax(90px,1fr) minmax(78px,124px) minmax(90px,1fr);gap:6px}
.api-test-team{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:100%;min-width:0;font-size:.8rem;font-weight:850;color:var(--text);text-align:center;padding:2px 3px}
.api-test-team.away{justify-content:center;text-align:center}
.api-test-team img{width:38px;height:38px;object-fit:contain;flex:0 0 auto;filter:saturate(1.08) drop-shadow(0 3px 6px rgba(0,0,0,.12))}
.api-test-team span{
  min-width:0;
  max-width:112px;
  line-height:1.12;
  white-space:normal;
  overflow-wrap:anywhere;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.api-test-game.is-live .api-test-team{font-size:.9rem;font-weight:950}
.api-test-game.is-live .api-test-team img{width:46px;height:46px}
.api-test-game.is-final .api-test-team{
  flex-direction:row;
  justify-content:flex-end;
  gap:5px;
  padding:0;
  font-size:.74rem;
  line-height:1.1;
  text-align:right;
}
.api-test-game.is-final .api-test-team:first-child{flex-direction:row-reverse}
.api-test-game.is-final .api-test-team.away{justify-content:flex-start;text-align:left}
.api-test-game.is-final .api-test-team img{width:24px;height:24px;filter:saturate(1.02) drop-shadow(0 2px 4px rgba(0,0,0,.08))}
.api-test-game.is-final .api-test-team span{max-width:116px;-webkit-line-clamp:1}
.api-test-score-panel{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;max-width:236px;min-width:0;justify-self:center}
.api-test-game.is-live .api-test-score-panel{max-width:280px}
.api-test-live-panel{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.api-test-live-head{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;width:100%}
.api-test-live-pill{
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid rgba(16,185,129,.32);border-radius:999px;
  background:#ecfdf5;color:#047857;
  padding:4px 8px;font-size:.55rem;font-weight:950;text-transform:uppercase;letter-spacing:.65px;line-height:1;
}
.api-test-live-pill:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);animation:livePulse 1.4s ease-in-out infinite}
.api-test-live-clock{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:20px;
  padding:4px 8px;
  border:1px solid rgba(16,185,129,.24);
  border-radius:999px;
  background:#fff;
  font-size:.55rem;
  font-weight:950;
  text-transform:uppercase;
  letter-spacing:.6px;
  color:#047857;
  line-height:1;
}
.api-test-live-block{display:grid;justify-items:center;gap:3px;width:100%}
.api-test-live-label{font-size:.52rem;font-weight:950;text-transform:uppercase;letter-spacing:.72px;color:#64748b;line-height:1}
.api-test-score{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:950;color:var(--blue)}
.api-test-score b{min-width:30px;text-align:center;border:1px solid var(--border);border-radius:8px;background:#f8fbf1;padding:4px 5px;font-size:.76rem}
.api-test-score.is-waiting b{background:#f8fafc;color:#94a3b8}
.api-test-pick-score b{background:#eef5ff}
.api-test-game.is-live .api-test-score b{min-width:38px;padding:6px 7px;font-size:1rem;border-color:#b7e7c9;background:#f3fff6}
.api-test-game.is-final .api-test-score{gap:4px}
.api-test-game.is-final .api-test-score b{min-width:24px;padding:3px 4px;border-radius:7px;font-size:.68rem;background:#f8fafc}
.api-test-final-panel,.api-test-upcoming-panel{
  display:grid;
  justify-items:center;
  gap:5px;
  width:100%;
  min-width:0;
}
.api-test-final-pick{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  flex-wrap:wrap;
  min-width:0;
}
.api-test-saved-pick{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  flex-wrap:wrap;
  min-width:0;
}
.api-test-saved-pick .api-test-score b{min-width:26px;padding:3px 4px;font-size:.68rem;border-radius:7px}
.api-test-final-label{
  font-size:.5rem;
  font-weight:950;
  letter-spacing:.5px;
  line-height:1;
  color:var(--muted);
  text-transform:uppercase;
