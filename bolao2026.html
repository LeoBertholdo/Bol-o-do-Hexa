/* ---- Palpites (auto-save em brasileirao_predictions; trava no apito inicial) ----
   Salva no onchange de cada campo, SEM re-renderizar a aba — assim os palpites das
   outras partidas nunca são apagados. Feedback por um ✓ na própria linha. */
function brPalpiteRowHTML(fx,pi,now){
  const locked=Boolean(fx.ts&&now>=fx.ts);
  const pal=S_BR.palpites[brPredKey(pi,fx.id)]||{};
  const when='<div class="brx-pal-when">'+esc(fx.dshort||fx.date||"")+(fx.time?' · '+esc(fx.time):'')+'</div>'+
    (fx.late?'<div class="brx-tag late" title="Jogo adiado da rodada '+fx.round+', remarcado pra esta data">Adiado · rodada '+fx.round+'</div>':'');
  if(locked){
    const res=brScoringResult(fx);
    const sc=brFixtureScore(fx);
    const d=(pal.s1!=null&&res)?scoreDetails(pal,res):null;
    const palTxt=(pal.s1!=null)?(pal.s1+'–'+pal.s2):'sem palpite';
    const resTxt=res?(res.s1+'–'+res.s2):'a definir';
    return '<div class="brx-match brx-pal brx-locked'+(sc&&sc.live?' live':'')+'">'+
      '<div class="brx-team home"><span class="brx-team-name">'+esc(fx.t1)+'</span>'+brLogo(fx.t1)+'</div>'+
      '<div class="brx-mid">'+when+
        '<div class="brx-locked-line"><span class="brx-your">seu '+esc(palTxt)+'</span><span class="brx-real">'+esc(resTxt)+'</span></div>'+
        (d?brPtsBadge(d):(sc&&sc.live?'<span class="brx-tag live">Ao vivo</span>':''))+
      '</div>'+
      '<div class="brx-team">'+brLogo(fx.t2)+'<span class="brx-team-name">'+esc(fx.t2)+'</span></div>'+
    '</div>';
  }
  const v1=pal.s1!=null?pal.s1:''; const v2=pal.s2!=null?pal.s2:'';
  const gid=esc(fx.id); const done=(pal.s1!=null&&pal.s2!=null);
  return '<div class="brx-match brx-pal">'+
    '<div class="brx-team home"><span class="brx-team-name">'+esc(fx.t1)+'</span>'+brLogo(fx.t1)+'</div>'+
    '<div class="brx-mid">'+when+
      '<div class="brx-guess">'+
        '<input class="br-inp" id="brS1_'+gid+'" type="number" min="0" max="30" inputmode="numeric" value="'+v1+'" onchange="brAutoSavePalpite(\''+gid+'\')" aria-label="gols '+esc(fx.t1)+'">'+
        '<span>×</span>'+
        '<input class="br-inp" id="brS2_'+gid+'" type="number" min="0" max="30" inputmode="numeric" value="'+v2+'" onchange="brAutoSavePalpite(\''+gid+'\')" aria-label="gols '+esc(fx.t2)+'">'+
        '<span class="br-saved'+(done?' ok':'')+'" id="brSaved_'+gid+'">'+(done?'✓':'')+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="brx-team">'+brLogo(fx.t2)+'<span class="brx-team-name">'+esc(fx.t2)+'</span></div>'+
  '</div>';
}
function renderBrPalpites(){
  const el=document.getElementById("tab-palpites"); if(!el) return;
  if(!remoteSession){ el.innerHTML=brLoginPrompt(); return; }
  if(!S_BR.loaded){ el.innerHTML=brLoadingCard(); return; }
  const pi=myParticipantIndex();
  if(pi==null){ el.innerHTML=brStateCard("👀","Conta observadora","Sua conta não tem um participante vinculado, então não dá pra palpitar — mas dá pra acompanhar tudo pelas outras abas."); return; }
  const fixtures=brBolaoFixtures();
  if(!fixtures.length){ el.innerHTML=brEmptyCard(); return; }
  const now=Date.now();
  const {rounds,byRound}=brRoundsIndex(fixtures);
  if(brPalRound==null||!byRound[brPalRound]){
    const open=rounds.find(rr=>byRound[rr].some(f=>!(f.ts&&now>=f.ts)));
    brPalRound=open!=null?open:brDefaultRound(rounds,byRound);
  }
  const isFilled=f=>{ const p=S_BR.palpites[brPredKey(pi,f.id)]; return p&&p.s1!=null&&p.s2!=null; };
  const openFx=fixtures.filter(f=>!(f.ts&&now>=f.ts));
  const filled=openFx.filter(isFilled).length;
  const pct=openFx.length?Math.round(filled*100/openFx.length):100;
  const r=brPalRound, games=byRound[r]||[], idx=rounds.indexOf(r);
  const openRound=games.filter(f=>!(f.ts&&now>=f.ts));
  const roundMeta=openRound.length?(openRound.filter(isFilled).length+'/'+openRound.length+' preenchidos'):'rodada travada';
  el.innerHTML='<div class="panel">'+
    '<div class="card">'+
      '<div class="brx-sec"><span class="brx-sec-title">Seus palpites — '+esc(participantName(pi))+'</span><span class="brx-sec-meta">'+filled+'/'+openFx.length+' jogos abertos</span></div>'+
      '<div class="brx-progress-row"><div class="brx-progress"><i style="width:'+pct+'%"></i></div><span class="brx-sec-meta">'+pct+'%</span></div>'+
      '<p class="microcopy" style="margin:10px 0 12px">Salva sozinho ao digitar — sem botão. Cada palpite trava no apito inicial e já entra na <a class="brx-link" onclick="goTab(\'grupos\')">tabela projetada</a>.</p>'+
      brChipsHTML(rounds,byRound,r,"brSetPalRound")+
    '</div>'+
    '<div class="card">'+
      '<div class="brx-sec">'+
        '<div class="brx-rnav">'+
          '<button class="brx-arrow"'+(idx<=0?' disabled':'')+' onclick="brSetPalRound('+rounds[Math.max(0,idx-1)]+')" aria-label="Rodada anterior">‹</button>'+
          '<span class="brx-round-title">Rodada '+r+'</span>'+
          '<button class="brx-arrow"'+(idx>=rounds.length-1?' disabled':'')+' onclick="brSetPalRound('+rounds[Math.min(rounds.length-1,idx+1)]+')" aria-label="Próxima rodada">›</button>'+
        '</div>'+
        '<span class="brx-sec-meta">'+roundMeta+'</span>'+
      '</div>'+
      '<div class="brx-games">'+games.map(f=>brPalpiteRowHTML(f,pi,now)).join("")+'</div>'+
    '</div>'+
  '</div>';
  brScrollChips(el);
}
function brFlagSaved(gid,state){
  const el=document.getElementById('brSaved_'+gid); if(!el) return;
  el.className='br-saved '+(state==='erro'?'err':state==='salvando'?'wait':state==='vazio'?'':'ok');
  el.textContent=state==='erro'?'!':state==='salvando'?'…':state==='vazio'?'':'✓';
}
async function brAutoSavePalpite(gid){
  const pi=myParticipantIndex();
  if(pi==null){ toast("Sua conta não tem participante vinculado."); return; }
  /* gid pode vir prefixado (card do popup do clube); dados/banco usam o id real e,
     no fim, o pill do card gêmeo na aba atrás é atualizado junto. */
  const realGid=brRealGid(gid);
  const fromPopup=gid!==realGid; // card do popup do clube → a aba atrás precisa re-renderizar no fechamento
  const syncPills=()=>{ brRefreshPill(gid); if(fromPopup) brRefreshPill(realGid); };
  const fx=S_BR.fixtures.find(f=>f.id===realGid);
  if(fx&&fx.ts&&Date.now()>=fx.ts){ toast("Jogo já começou — palpite encerrado."); return; }
  const e1=document.getElementById('brS1_'+gid), e2=document.getElementById('brS2_'+gid);
  if(!e1||!e2) return;
  const r1=String(e1.value).trim(), r2=String(e2.value).trim();
  const key=brPredKey(pi,realGid);
  if(r1===''&&r2===''){
    if(S_BR.palpites[key]){
      delete S_BR.palpites[key];
      if(fromPopup) brTeamPopupDirty=true;
      brFlagSaved(gid,'salvando');
      const ok=await remoteWrite(()=>remoteClient.from("brasileirao_predictions").delete().eq("participant_index",pi).eq("game_id",realGid));
      brFlagSaved(gid, ok===false?'erro':'vazio');
    } else brFlagSaved(gid,'vazio');
    syncPills();
    return;
  }
  const s1=parseInt(r1,10), s2=parseInt(r2,10);
  if(!Number.isInteger(s1)||!Number.isInteger(s2)||s1<0||s2<0){ brFlagSaved(gid,'vazio'); return; }
  const pal={s1:Math.min(30,s1),s2:Math.min(30,s2)};
  if(String(pal.s1)!==r1) e1.value=pal.s1;
  if(String(pal.s2)!==r2) e2.value=pal.s2;
  S_BR.palpites[key]=pal;
  if(fromPopup) brTeamPopupDirty=true;
  brFlagSaved(gid,'salvando');
  const ok=await remoteWrite(()=>remoteClient.from("brasileirao_predictions").upsert({participant_index:pi,game_id:realGid,user_id:remoteSession.user.id,s1:pal.s1,s2:pal.s2},{onConflict:"participant_index,game_id"}));
  if(ok===false){ brFlagSaved(gid,'erro'); toast("Não salvou (confira o login ou se o jogo já começou)."); }
  else{
    brFlagSaved(gid,'salvo');
    // Salvou completo: recolhe o editor sozinho (vira o pill "seu palpite"), a menos
    // que o usuário ainda esteja com o foco num dos campos deste mesmo jogo.
    setTimeout(()=>{
      const a=document.activeElement;
      if(a&&(a.id==='brS1_'+gid||a.id==='brS2_'+gid)) return;
      brToggleGuess(gid,false);
    },600);
  }
  syncPills();
}

/* ---- Palpite inline (aba Jogos) + popup "todos os palpites" -------------------
   brToggleGuess abre/fecha os campos no card; brRefreshPill mantém o pill "seu
   palpite 2×1" em dia com o que está salvo. O popup só lista os palpites de todo
   mundo em jogo travado (segredo até o apito) — por segurança, brPopupHTML também

  const cols={home:[],draw:[],away:[]};
  (S.participants||[]).forEach((name,i)=>{

  const sortCol=a=>a.sort((x,y)=>((y.d?y.d.pts:0)-(x.d?x.d.pts:0))||brFirstName(x.name).localeCompare(brFirstName(y.name),"pt-BR"));

  const total=cols.home.length+cols.draw.length+cols.away.length;

    '<div class="brx-pop-cols">'+
      col(cols.home,fx.t1||'Mandante',finalRes==='home')+
      col(cols.draw,'Empate',finalRes==='draw')+

/* ---- Popup do clube (clicar num time filtra os jogos dele) --------------------
   Abre pelo clique no clube na Tabela, na Tabela V2 e nos cards de jogo (Home e
   aba Jogos — inclusive nos cards DENTRO do próprio popup, que viram pivô pra
   trocar de clube). Mora numa camada própria (#brTeamModal, abaixo do #brModal)
   pra o "ver todos" de jogo travado abrir POR CIMA. O próximo jogo aceita palpite
   inline; o primeiro turno aparece como histórico. IDs prefixados (tp:) evitam

const BRX_TP_NS="tp:";
function brRealGid(gid){ const s=String(gid||""); return s.startsWith(BRX_TP_NS)?s.slice(BRX_TP_NS.length):s; }
function brTeamKey(ev,el){ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); el.click(); } }

   (o change nativo roda antes); isto cobre Esc e fechamentos programáticos. */

/* Jogos que valem pontos no bolão, usados apenas para calcular "seus pts". */
function brTeamFixtures(team){
  return brBolaoFixtures().filter(f=>f.t1===team||f.t2===team)
    .sort((a,b)=>((a.ts||Infinity)-(b.ts||Infinity))||(((a.slot!=null?a.slot:a.round)||99)-((b.slot!=null?b.slot:b.round)||99)));
}
/* O carrossel usa a temporada inteira para conseguir juntar ida e volta. */
function brTeamSeasonFixtures(team){
  const fixtures=S_BR.fixtures.slice();
  BR_FIRST_TURN_RESULTS.forEach((row,index)=>{
    if(row[1]!==team&&row[2]!==team) return;
    const exists=fixtures.some(f=>f.round===row[0]&&f.t1===row[1]&&f.t2===row[2]);
    if(!exists) fixtures.push(brHistoricalFixture(row,index));
  });
  return fixtures.filter(f=>f.t1===team||f.t2===team)
    .sort((a,b)=>((a.ts||Infinity)-(b.ts||Infinity))||String(a.id).localeCompare(String(b.id)));
}
function brTeamTodayKey(now){
  return new Intl.DateTimeFormat("en-CA",{year:"numeric",month:"2-digit",day:"2-digit",timeZone:BR_TZ}).format(new Date(now));
}
function brTeamConfrontations(team,now=Date.now()){
  const today=brTeamTodayKey(now);
  const byOpponent=new Map();
  brTeamSeasonFixtures(team).forEach(f=>{
    const opponent=f.t1===team?f.t2:f.t1;
    if(!opponent) return;
    if(!byOpponent.has(opponent)) byOpponent.set(opponent,[]);
    byOpponent.get(opponent).push(f);
  });
  const groups=Array.from(byOpponent,([opponent,games])=>{
    games.sort((a,b)=>((a.ts||Infinity)-(b.ts||Infinity))||String(a.id).localeCompare(String(b.id)));
    const liveGame=games.find(f=>{ const s=brFixtureScore(f); return s&&s.live; })||null;
    const todayGame=games.find(f=>f.dateKey===today)||null;
    const upcomingGame=games.find(f=>{
      const s=brFixtureScore(f);
      return !(s&&s.final)&&!(f.ts&&f.ts<now);
    })||null;
    const activeGame=liveGame||todayGame||upcomingGame||games[games.length-1]||null;
    const anchorTs=activeGame&&activeGame.ts?activeGame.ts:Infinity;
    const stateLabel=liveGame?"Ao vivo":todayGame?"Hoje":upcomingGame?"Próximo":"Encerrado";
    const stateClass=liveGame?" live":(todayGame||upcomingGame)?" current":"";
    return {opponent,games,liveGame,todayGame,upcomingGame,activeGame,anchorTs,stateLabel,stateClass};
  });
  return groups.sort((a,b)=>(a.anchorTs-b.anchorTs)||a.opponent.localeCompare(b.opponent,"pt-BR"));
}
function brTeamInitialConfrontation(groups){
  const remembered=groups.findIndex(g=>g.opponent===brTeamPopupOpponent);
  if(remembered>=0) return remembered;
  const current=groups.findIndex(g=>g.liveGame||g.todayGame);
  if(current>=0) return current;
  const next=groups.findIndex(g=>g.upcomingGame);
  return next>=0?next:Math.max(0,groups.length-1);
}
function brTeamConfrontationVenue(group,team){
  const f=group&&(group.activeGame||group.upcomingGame||group.todayGame||group.games&&group.games[0]);
  return f&&f.t1===team?"home":"away";
}
function brTeamVenueText(venue){ return venue==="home"?"em casa":"fora"; }
function brTeamVenueBadge(venue){ return venue==="home"?"C":"F"; }
function brTeamCarouselSync(track){
  if(!track) return;
  const count=track.children.length;
  if(!count) return;
  const prevIndex=track.dataset.index;
  const width=Math.max(1,track.clientWidth);
  const index=Math.max(0,Math.min(count-1,Math.round(track.scrollLeft/width)));
  track.dataset.index=String(index);
  const slide=track.children[index];
  if(slide) brTeamPopupOpponent=slide.dataset.opponent||null;
  const frame=track.closest(".brx-team-frame");
  const prev=frame&&frame.querySelector('[data-br-tp-dir="-1"]');
  const next=frame&&frame.querySelector('[data-br-tp-dir="1"]');
  if(prev) prev.disabled=index<=0;
  if(next) next.disabled=index>=count-1;
  const seq=frame&&frame.querySelector(".brx-tp-sequence");
  if(seq){
    const buttons=seq.querySelectorAll("[data-br-tp-jump]");
    buttons.forEach((btn,i)=>{
      const active=i===index;
      btn.classList.toggle("active",active);
      if(active) btn.setAttribute("aria-current","true");
      else btn.removeAttribute("aria-current");
    });
    if(prevIndex!==String(index)){
      const activeBtn=seq.querySelector('[data-br-tp-jump="'+index+'"]');
      if(activeBtn&&typeof activeBtn.scrollIntoView==="function") activeBtn.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
    }
  }
}
function brTeamCarouselGo(index){
  const track=document.getElementById("brTpCarousel");
  if(!track) return;
  const count=track.children.length;
  if(!count) return;
  const target=Math.max(0,Math.min(count-1,Number(index)||0));
  const slide=track.children[target];
  if(slide) brTeamPopupOpponent=slide.dataset.opponent||null;
  const left=target*Math.max(1,track.clientWidth);
  if(typeof track.scrollTo==="function") track.scrollTo({left,behavior:"smooth"});
  else track.scrollLeft=left;
  brTeamCarouselSync(track);
}
function brTeamCarouselStep(dir){
  const track=document.getElementById("brTpCarousel");
  if(!track) return;
  const count=track.children.length;
  const width=Math.max(1,track.clientWidth);
  const current=Number.isFinite(Number(track.dataset.index))?Number(track.dataset.index):Math.round(track.scrollLeft/width);
  brTeamCarouselGo(Math.max(0,Math.min(count-1,current+dir)));
}
function renderBrTeamPopup(){
  const el=document.getElementById("brTeamModal"); if(!el) return;
  if(!brTeamPopup){ el.classList.remove("open"); el.innerHTML=""; brSyncModalBodyLock(); return; }
  /* O placar ao vivo re-renderiza o popup aberto (render → renderBrTeamPopup). O
     frame é PRESERVADO entre renders do mesmo clube: recriá-lo replayaria o
     brxPopIn a cada tick do robô (a família de flicker do ce5595f) e zeraria o
     swipe do carrossel no meio do gesto. */
  let frame=el.querySelector(".brx-modal-frame");
  const sameTeam=Boolean(frame&&frame.dataset.team===brTeamPopup);
  const prevTrack=sameTeam?frame.querySelector("#brTpCarousel"):null;
  const prevScroll=prevTrack?prevTrack.scrollLeft:null;
  if(!frame){
    el.innerHTML='<div class="brx-modal-backdrop" onclick="brCloseTeamPopup()"></div>'+
      '<div class="brx-modal-frame" role="dialog" aria-modal="true"></div>';
    frame=el.querySelector(".brx-modal-frame");
  }
  frame.className="brx-modal-frame brx-team-frame"+brTeamThemeClass(brTeamPopup);
  frame.dataset.team=brTeamPopup;
  frame.setAttribute("aria-label","Estatísticas e confrontos do "+brTeamPopup);
  frame.style.setProperty("--club",brTeamAccent(brTeamPopup));
  frame.innerHTML='<button class="brx-modal-close" onclick="brCloseTeamPopup()" aria-label="Fechar">×</button>'+
    brTeamPopupHTML(brTeamPopup);
  el.classList.add("open"); brSyncModalBodyLock();
  const track=document.getElementById("brTpCarousel");
  if(track){
    requestAnimationFrame(()=>{
      if(prevScroll!=null) track.scrollLeft=prevScroll;
      else{
        const initial=Math.max(0,Number(track.dataset.initial)||0);
        track.scrollLeft=initial*Math.max(1,track.clientWidth);
      }
      brTeamCarouselSync(track);
    });
  }
}
function brTeamPopupHTML(team){
  const fixtures=brTeamFixtures(team);
  const now=Date.now();
  const pi=myParticipantIndex();
  const official=brTableRows(false);
  const offIdx=official.findIndex(t=>t.name===team);
  const offRow=offIdx>=0?official[offIdx]:null;
  let myPts=0;
  if(pi!=null) fixtures.forEach(f=>{

    const res=brScoringResult(f); if(!res) return;
    const p=S_BR.palpites[brPredKey(pi,f.id)];

      '<div class="brx-tp-inline-stat"><strong>'+(offRow?offRow.pts:'—')+'</strong><span>pts clube</span></div>'+
      (pi!=null?'<div class="brx-tp-inline-stat" title="Seus pontos nos jogos deste clube"><strong>'+myPts+'</strong><span>seus pts</span></div>':'')+
    '</div>';
  const groups=brTeamConfrontations(team,now);
  const initial=brTeamInitialConfrontation(groups);
  const bolaoIds=new Set(fixtures.map(f=>f.id));
  const sequence=groups.map((group,index)=>{
    const venue=brTeamConfrontationVenue(group,team);
    const active=index===initial;
    const label="Ver confrontos de "+team+" com "+group.opponent+", "+brTeamVenueText(venue);

      brLogo(group.opponent)+

    '</button>';
  }).join('');
  const slides=groups.map(group=>{
    const games=group.games.slice(0,2).map((f,index)=>{
      const isActive=group.activeGame&&group.activeGame.id===f.id;
      return '<div class="brx-tp-slot'+(isActive?' brx-tp-next':'')+'">'+
        '<div class="brx-tp-leg">'+(index===0?'1º confronto':'2º confronto')+'</div>'+
        brMatchHTML(f,{interactive:bolaoIds.has(f.id),ns:BRX_TP_NS,showRound:true,focusTeam:team})+
      '</div>';

    return '<section class="brx-tp-slide" data-opponent="'+esc(group.opponent)+'" aria-label="Confrontos com '+esc(group.opponent)+'">'+
      '<div class="brx-tp-slide-games">'+games+'</div>'+

  }).join('');
  const carousel=groups.length?'<div class="brx-tp-carousel-shell">'+

function predictionProgress(){
  const expected=S.participants.length*GAMES.length;
  const filled=S.participants.reduce((total,_,pi)=>{
    return total+GAMES.filter(game=>isPredictionComplete(game,S.palpites[`${pi}_${game.id}`])).length;
  },0);
  return {filled,expected,pct:expected?Math.round(filled*100/expected):0};
}
function hasScore(entry){
  return Boolean(entry&&entry.s1!=null&&entry.s2!=null);
}
function isPredictionComplete(game,pal){
  if(!hasScore(pal)) return false;
  if(!game?.ko||+pal.s1!==+pal.s2) return true;
  return koAdvancerComplete(game,pal);
}
function fixtureDateList(){
  const set=new Set();
  GAMES.forEach(g=>{ if(g.date) set.add(g.date); });
  return Array.from(set).sort();
}
function adjacentFixtureDate(currentKey,dir){
  const list=fixtureDateList();
  if(!list.length||!currentKey) return null;
  const idx=list.indexOf(currentKey);
  if(idx<0){
    if(dir>0) return list.find(d=>d>currentKey)||null;
    const past=list.filter(d=>d<currentKey);
    return past.length?past[past.length-1]:null;
  }
  return list[idx+dir]||null;
}
function defaultHomeFixtureDate(){
  const today=todayKey();
  // Jogo ao vivo manda no foco, mesmo que tenha começado no dia anterior
  // (ex.: 23:00 que entra pela madrugada) — segue "ao vivo" até acabar.
  const live=GAMES.filter(g=>!S.results[g.id]&&copaLiveIsActive(copaLiveForGame(g.id))).sort(compareGameSchedule);
  if(live.length) return live[0].date;
  if(GAMES.some(g=>g.date===today)) return today;
  const pending=GAMES.filter(g=>!S.results[g.id]).sort(compareGameSchedule);
  const future=pending.filter(g=>g.date>=today);
  const source=future.length?future:pending;
  if(source.length) return source[0].date;
  const all=fixtureDateList();
  return all.length?all[all.length-1]:null;
}
function homeFixtureWindow(){
  const today=todayKey();
  const fallback=defaultHomeFixtureDate();
  const targetKey=homeFixtureDateKey||fallback;
  if(!targetKey){
    return {title:"Copa encerrada",headline:"Todos os jogos oficiais foram apurados.",detail:"",games:[],dateKey:null,prevKey:null,nextKey:null,isToday:false,canResetToday:false};
  }
  const dayGames=GAMES.filter(g=>g.date===targetKey).sort(compareGameSchedule);
  const isToday=targetKey===today;
  const isPast=targetKey<today;
  // "Ao vivo" não depende do calendário: um jogo que vira o dia segue ao vivo
  // até terminar, então contamos/ordenamos pelo estado real em qualquer data.
  const liveCount=dayGames.filter(g=>!S.results[g.id]&&copaLiveIsActive(copaLiveForGame(g.id))).length;
  const sorted=dayGames.slice().sort((a,b)=>{
    const la=!S.results[a.id]&&copaLiveIsActive(copaLiveForGame(a.id))?1:0;
    const lb=!S.results[b.id]&&copaLiveIsActive(copaLiveForGame(b.id))?1:0;
    if(la!==lb) return lb-la;
    return compareGameSchedule(a,b);
  });
  const games=sorted.slice(0,6);
  const parts=formatGameDateParts(targetKey);
  const total=`${games.length} ${games.length===1?"partida":"partidas"}`;
  let title;
  if(liveCount) title="Ao vivo agora";
  else if(isToday) title="Jogos do dia";
  else if(isPast) title="Resultados";
  else title="Próximos jogos";
  const detail=liveCount?`${liveCount} ao vivo · ${total} no dia`:total;
  return {
    title,
    headline:`${parts.weekdayLong}, ${parts.dayMonth}`,
    detail,
    games,
    showDates:new Set(games.map(game=>game.date)).size>1,
    live:liveCount>0,
    dateKey:targetKey,
    prevKey:adjacentFixtureDate(targetKey,-1),
    nextKey:adjacentFixtureDate(targetKey,1),
    isToday,
    canResetToday:homeFixtureDateKey!==null&&fallback!==null&&homeFixtureDateKey!==fallback
  };
}

function renderBrazilKnockout(){
  const flagFor=name=>teamFlag(name)?`<span class="flag">${teamFlag(name)}</span>`:"";
  const statusCard=(emoji,title,sub,cls="")=>`<div class="brazil-ko"><div class="brazil-ko-status ${cls}">

      <div><strong>${esc(title)}</strong><span>${esc(sub)}</span></div>

  const brGames=koGames().filter(g=>{
    const t=gameTeams(g);
    return t.t1==="Brasil"||t.t2==="Brasil";
  }).sort(compareGameSchedule);

  if(!brGames.length){
    return statusCard("😔","O Brasil não avançou ao mata-mata","A campanha terminou na fase de grupos.");
  }

  const next=brGames.find(g=>!S.results[g.id]);

  if(!next){
    // Todos os jogos do Brasil já têm resultado oficial: fim de linha.
    const last=brGames[brGames.length-1];
    const lastTeams=gameTeams(last);
    const opp=lastTeams.t1==="Brasil"?lastTeams.t2:lastTeams.t1;
    const won=winnerOf(last.id)==="Brasil";
    if(last.phaseKey==="final"){
      return won
        ? statusCard("🏆","Brasil HEXACAMPEÃO!","Acabou a espera — é o sexto título.","is-champ")
        : statusCard("🥈","Brasil vice-campeão",`Derrota na final${opp&&opp!=="Brasil"?` para ${opp}`:""}.`);
    }
    if(last.phaseKey==="p3"){
      return won
        ? statusCard("🥉","Brasil em 3º lugar","Fechou o pódio da Copa.")
        : statusCard("😔","Brasil em 4º lugar",`Ficou fora do pódio${opp&&opp!=="Brasil"?` (derrota para ${opp})`:""}.`);
    }
    const phase=KO_PHASES.find(p=>p.k===last.phaseKey)?.full||"mata-mata";
    return statusCard("😢","O Brasil foi eliminado",`${phase}${opp&&opp!=="Brasil"?` · derrota para ${opp}`:""}.`);
  }

  // Próximo jogo do Brasil.
  const teams=gameTeams(next);
  const oppSlot=teams.t1==="Brasil"?1:0;
  const phase=KO_PHASES.find(p=>p.k===next.phaseKey)?.full||next.phase;
  const possibles=koSlotPossibleTeams(next,oppSlot);
  const decided=possibles.length===1;
  const oppName=decided?possibles[0]:null;

  const matchHTML=`<div class="bk-next-match">
        <span class="bk-team bk-br">${flagFor("Brasil")}Brasil</span>
        <span class="bk-vs">×</span>
        ${decided
          ? `<span class="bk-team">${flagFor(oppName)}${esc(oppName)}</span>`
          : `<span class="bk-opp-tbd">A definir</span>`}
      </div>`;

  let possiblesHTML="";
  if(!decided){
    const feederNo=next.phaseKey!=="r32"?next.sources?.[oppSlot]:null;
    const feeder=feederNo?gameById(matchId(feederNo)):null;
    const list=possibles.length
      ? possibles.map(t=>`<span class="bk-poss">${flagFor(t)}${esc(t)}</span>`).join(`<span class="bk-poss-sep">ou</span>`)
      : `<span class="bk-poss">A definir</span>`;
    const feederPhase=feeder?(KO_PHASES.find(p=>p.k===feeder.phaseKey)?.full||feeder.phase):"";
    const srcLine=feeder?`<div class="bk-poss-src">Sai de ${esc(feederPhase)} · ${esc(formatGameDate(feeder.date))}</div>`:"";
    possiblesHTML=`<div class="bk-possibles">
      <div class="bk-possibles-label">Possíveis adversários</div>
      <div class="bk-poss-list">${list}</div>
      ${srcLine}
    </div>`;
  }

  return `<div class="brazil-ko">
    <div class="bk-next">
      <div class="bk-next-top">
        <span class="bk-next-phase">⚔️ ${esc(phase)}</span>
        <span class="bk-next-when">${esc(formatGameDate(next.date))} · ${esc(next.time)}</span>
      </div>
      ${matchHTML}
    </div>
    ${possiblesHTML}
  </div>`;
}

// Eventos de pontuação da Copa em ordem cronológica:
// - cada mudança de placar registrada pelo robô (live_score_history) vira um evento;
// - o fechamento de cada jogo é SEMPRE o resultado oficial (`results`), então
//   correções manuais do admin mandam mesmo quando a API registrou bobagem;
// - jogo em andamento entra como parcial (estado "live", traço tracejado).
// O eixo usa o horário em que o robô OBSERVOU a mudança (recorded_at), preso à
// janela do jogo — o minuto reportado pela API atrasa/erra demais pra ordenar.
//
// Carência do empate (só no gráfico; Palpites/Jogos não mudam): 0x0 antes do
// fim do 1º tempo não pontua — senão todo empatista "pontua" no apito inicial.
// Se o 1º tempo acaba 0x0, o empate parcial entra no intervalo. Um 0x0 DEPOIS
// de gol (anulado) no 1º tempo derruba a curva sem premiar empate (zeroGate).
function rankingGameEvents(){
  const events=[];
  const histWindowMs=5*3600000;
  // 45min + acréscimos típicos; usado quando o status da linha não diz o tempo.
  const halfEndOffsetMs=49*60000;
  const pastFirstHalf=(statusShort,ms,halfEndMs)=>{
    const st=String(statusShort||"").toUpperCase();
    if(st==="1H"||st==="NS") return false;
    if(["HT","2H","ET","BT","P","FT","AET","PEN","FINISHED","AWARDED","AWD"].includes(st)) return true;
    return ms>=halfEndMs;
  };
  GAMES.forEach(game=>{
    const official=S.results[game.id]||null;
    const liveRes=official?null:liveProvisionalResult(game);
    if(!official&&!liveRes) return;
    const kickoffMs=game.utc?new Date(game.utc).getTime():(game.date?parseDateKey(game.date).getTime():Date.now());
    const halfEndMs=kickoffMs+halfEndOffsetMs;
    const mapped=(copaLiveHistory[game.id]||[]).map(row=>{
      const raw=new Date(row.recorded_at||"").getTime();
      const ms=Number.isFinite(raw)?Math.min(Math.max(raw,kickoffMs),kickoffMs+histWindowMs):kickoffMs;
      const zero=!(+row.goals_home||0)&&!(+row.goals_away||0);
      return {ms,game,res:{s1:+row.goals_home,s2:+row.goals_away,provisional:true},
        state:official?"detail":"live",zero,firstHalf:!pastFirstHalf(row.status_short,ms,halfEndMs)};
    });
    let goalSeen=false;
    const hist=[];
    mapped.forEach(ev=>{
      if(!ev.zero) goalSeen=true;
      else if(ev.firstHalf){
        if(!goalSeen) return; // 0x0 do apito inicial: fora do gráfico
        ev.zeroGate=true;     // gol anulado no 1º tempo: evento zerado pra todos
      }
      hist.push(ev);
    });
    // 1º tempo terminou 0x0? O empate parcial entra no apito do intervalo.
    const closing=official||liveRes;
    const closingZero=!(+closing.s1||0)&&!(+closing.s2||0);
    const firstGoal=hist.find(ev=>!ev.zero);
    const liveStatus=official?null:(copaLiveForGame(game.id)||{}).status_short;
    let syntheticMs=null;
    if(firstGoal&&!firstGoal.firstHalf){
      syntheticMs=Math.max(kickoffMs+1,Math.min(halfEndMs,firstGoal.ms-1000));
    }else if(!firstGoal&&closingZero&&(official||pastFirstHalf(liveStatus,Date.now(),halfEndMs))){
      syntheticMs=halfEndMs;
    }
    const countedZeroEarly=hist.some(ev=>ev.zero&&!ev.zeroGate&&(!firstGoal||ev.ms<firstGoal.ms));
    if(syntheticMs!=null&&!countedZeroEarly){
      hist.push({ms:syntheticMs,game,res:{s1:0,s2:0,provisional:true},state:official?"detail":"live",zero:true,synthetic:true});
      hist.sort((a,b)=>a.ms-b.ms);
    }
    // Jogo ao vivo ainda 0x0 no 1º tempo e sem lances aproveitáveis: nada a mostrar.
    if(!hist.length&&!official&&closingZero) return;
    hist.forEach(ev=>events.push(ev));
    const closingState=official?"final":"live";
    const lastHist=hist.length?hist[hist.length-1]:null;
    const sameAsLast=lastHist&&+lastHist.res.s1===+closing.s1&&+lastHist.res.s2===+closing.s2;
    if(sameAsLast){
      // O último lance já tem o placar de fechamento: vira o próprio fechamento
      // (com o resultado oficial completo, incluindo prorrogação/pênaltis no mata-mata).
      lastHist.res=closing;
      lastHist.state=closingState;
      if(official) lastHist.zeroGate=false; // resultado oficial sempre pontua
    }else{
      const fallbackMs=official?kickoffMs:Math.min(Math.max(Date.now(),kickoffMs),kickoffMs+histWindowMs);
      events.push({ms:lastHist?lastHist.ms+1:fallbackMs,game,res:closing,state:closingState});
    }
  });
  events.sort((a,b)=>a.ms-b.ms||compareGameSchedule(a.game,b.game));
  return events;
}
function rankingTimeline(rows){
  const events=rankingGameEvents();
  const actual=S.actualPodio||{};
  const includePodio=["p1","p2","p3","p4"].some(k=>norm(actual[k]));
  const totals={};
  const perGame={};
  const series=rows.map((p,idx)=>{
    totals[p.i]=0;
    perGame[p.i]={};
    return {i:p.i,name:p.name,color:RANKING_SERIES_COLORS[idx%RANKING_SERIES_COLORS.length],values:[0]};
  });
  const positions=[{label:"Início",state:"start",event:null}];
  const resolvedIds=new Set(),liveIds=new Set(),dateSet=new Set();
  let detailEventCount=0;
  events.forEach(ev=>{
    series.forEach(line=>{
      const pal=S.palpites[`${line.i}_${ev.game.id}`];
      // zeroGate: 0x0 pós-anulação no 1º tempo zera o jogo pra todos.
      const v=ev.zeroGate?0:score(pal,ev.res,ev.game);
      const cur=v==null?0:v;
      // Só a diferença em relação ao último placar conhecido DESTE jogo entra,
      // então gol anulado/virada sobe e desce a curva como aconteceu ao vivo.
      totals[line.i]+=cur-(perGame[line.i][ev.game.id]||0);
      perGame[line.i][ev.game.id]=cur;
      line.values.push(totals[line.i]);
    });
    if(ev.state==="final") resolvedIds.add(ev.game.id);
    if(ev.state==="live") liveIds.add(ev.game.id);
    if(ev.state==="detail") detailEventCount++;
    if(ev.game.date) dateSet.add(ev.game.date);
    positions.push({label:"",state:ev.state,dateKey:ev.game.date||"",event:ev});
  });
  if(includePodio){
    positions.push({label:"Pódio",state:"podio",event:null});
    series.forEach(line=>{
      totals[line.i]+=podioScore(S.podio[line.i]||{},actual);
      line.values.push(totals[line.i]);
    });
  }
  // Rótulo de data apenas no primeiro evento de cada dia, pro eixo não poluir.
  let prevDate=null;
  positions.forEach(p=>{
    if(!p.event||!p.dateKey) return;
    if(p.dateKey!==prevDate){p.label=chartFormatDateKey(p.dateKey);prevDate=p.dateKey;}
  });
  const labels=positions.map(p=>p.label);
  const states=positions.map(p=>p.state);
  const eventsMeta=positions.map(p=>p.event);
  const axisCandidates=positions.map((p,idx)=>p.label?idx:-1).filter(i=>i>=0);
  const xRel=positions.map((_,i)=>positions.length>1?i/(positions.length-1):0);
  const allValues=series.flatMap(line=>line.values);
  const maxVal=Math.max(3,...allValues);
  const minVal=Math.min(0,...allValues);
  return {labels,states,xRel,series,maxVal,minVal,events:eventsMeta,axisCandidates,
    resolvedCount:resolvedIds.size,liveGameCount:liveIds.size,detailEventCount,
    dateCount:dateSet.size,includePodio};
}
function rankingRoundDescriptorForGame(game){

    return {id:`group-r${round}`,title:"Essa rodada",subtitle:`Rodada ${round} dos grupos`,games,emptyText:`Sem placares na rodada ${round} ainda.`};
  }
  const phase=KO_PHASES.find(p=>p.k===game.phaseKey);

  const games=koGames().filter(g=>g.phaseKey===game.phaseKey).sort(compareGameSchedule);

function rankingCurrentRoundDescriptor(){
  const today=todayKey();
  for(const round of [1,2,3]){
    const games=groupGames().filter(g=>g.round===round&&g.date).sort(compareGameSchedule);
    if(!games.length) continue;
    const first=games[0].date;
    const last=games[games.length-1].date;
    if(today>=first&&today<=last) return rankingRoundDescriptorForGame(games[0]);
  }
  for(const phase of KO_PHASES){
    const games=koGames().filter(g=>g.phaseKey===phase.k&&g.date).sort(compareGameSchedule);
    if(!games.length) continue;
    const first=games[0].date;
    const last=games[games.length-1].date;
    if(today>=first&&today<=last) return rankingRoundDescriptorForGame(games[0]);
  }
  const ordered=GAMES.filter(g=>g.date).sort(compareGameSchedule);
  const context=ordered.find(g=>g.date>=today)||ordered.slice().reverse().find(g=>g.date<=today)||null;
  return rankingRoundDescriptorForGame(context);
}

function rankingFinalWhistleTimeline(rows,games=null,baseline=null){
  const fixtures=(games||GAMES).slice().sort(compareGameSchedule);
  // Um ponto por jogo: o resultado oficial fecha o jogo (estado "final"); o jogo
  // em andamento entra como parcial (estado "live", tracejado), igual ao gol a gol.
  // O oficial sempre manda — o ao vivo só vale enquanto não há resultado fechado.
  const playedGames=fixtures.map(game=>{
    const official=S.results[game.id]||null;
    const res=official||liveProvisionalResult(game);
    if(!res) return null;
    return {game,res,state:official?"final":"live"};
  }).filter(Boolean).sort((a,b)=>compareGameSchedule(a.game,b.game));
  const totals={};
  const series=rows.map((p,idx)=>{
    const seed=baseline?(baseline[p.i]||0):0;
    totals[p.i]=seed;
    return {i:p.i,name:p.name,color:RANKING_SERIES_COLORS[idx%RANKING_SERIES_COLORS.length],values:[seed]};
  });
  const positions=[{label:"Início",state:"start",dateKey:"",event:null}];
  const dateSet=new Set();
  const liveIds=new Set();
  playedGames.forEach(({game,res,state})=>{
    series.forEach(line=>{
      const pal=S.palpites[`${line.i}_${game.id}`];
      const v=score(pal,res,game);
      totals[line.i]+=v==null?0:v;
      line.values.push(totals[line.i]);
    });
    if(state==="live") liveIds.add(game.id);
    if(game.date) dateSet.add(game.date);
    positions.push({label:"",state,dateKey:game.date||"",event:{game,res,state}});
  });
  let prevDate=null;
  positions.forEach(p=>{
    if(!p.event||!p.dateKey) return;
    if(p.dateKey!==prevDate){p.label=chartFormatDateKey(p.dateKey);prevDate=p.dateKey;}
  });
  const labels=positions.map(p=>p.label);
  const states=positions.map(p=>p.state);
  const eventsMeta=positions.map(p=>p.event);
  const axisCandidates=positions.map((p,idx)=>p.label?idx:-1).filter(i=>i>=0);
  const xRel=positions.map((_,i)=>positions.length>1?i/(positions.length-1):0);
  const allValues=series.flatMap(line=>line.values);
  const maxVal=Math.max(3,...allValues);
  const minVal=baseline?Math.min(...allValues):Math.min(0,...allValues);
  return {labels,states,xRel,series,maxVal,minVal,events:eventsMeta,axisCandidates,
    fixtureCount:fixtures.length,scoredCount:playedGames.length,
    resolvedCount:playedGames.length-liveIds.size,
    liveGameCount:liveIds.size,detailEventCount:0,dateCount:dateSet.size};
}

// Divisórias verticais de fase no gráfico. Em "Desde o início" (all): uma linha em cada
// virada de rodada de grupos (1ª|2ª|3ª) e na entrada do mata-mata, com o nome dos três
// trechos de grupos centralizado no topo (o mata-mata fica só com a linha, sem rótulo).
// Na visão "Mata-mata" (ko): uma linha entre cada fase (16-avos|oitavas|quartas|semis|3º|
// final) e o nome de cada trecho no topo. Devolve índices na timeline; o x é calculado no
// render (meio dos dois pontos da virada).
function rankingChartPhaseDividers(chart,period){
  const evs=chart.events||[];
  const koLabel=pk=>{const ph=KO_PHASES.find(p=>p.k===pk);return ph?ph.l:"Mata-mata";};
  const lines=[],segLabels=[];
  if(period.id==="all"){
    // Linha em cada virada (1ª→2ª, 2ª→3ª, grupos→mata-mata). Rótulo centralizado só nos
    // três trechos de grupos; o mata-mata recebe só a linha separadora, sem nome.
    let maxRound=0,koDone=false,segStart=-1,segRound=0,lastGroupIdx=-1;
    const flushSeg=end=>{if(segRound>0&&segStart>=0&&end>=segStart)segLabels.push({from:segStart,to:end,text:`${segRound}ª rodada`});};
    for(let i=0;i<evs.length;i++){
      const g=evs[i]&&evs[i].game;if(!g)continue;
      if(!g.ko){
        lastGroupIdx=i;
        const r=g.round||0;
        if(r>maxRound){
          if(maxRound>0){lines.push({index:i,label:""});flushSeg(i-1);}
          maxRound=r;segStart=i;segRound=r;
        }
      }else if(!koDone){
        lines.push({index:i,label:""});flushSeg(i-1);
        koDone=true;segRound=0;
      }
    }
    if(segRound>0)flushSeg(lastGroupIdx);
  }else if(period.id==="ko"){
    let segStart=-1,curPhase=null;
    const flush=end=>{if(segStart>=0&&curPhase!=null&&end>=segStart)segLabels.push({from:segStart,to:end,text:koLabel(curPhase)});};
    for(let i=0;i<evs.length;i++){
      const g=evs[i]&&evs[i].game;if(!g||!g.ko)continue;
      if(g.phaseKey!==curPhase){
        if(curPhase!=null){lines.push({index:i,label:""});flush(i-1);}
        curPhase=g.phaseKey;segStart=i;
      }
    }
    let lastKo=-1;for(let i=evs.length-1;i>=0;i--){const g=evs[i]&&evs[i].game;if(g&&g.ko){lastKo=i;break;}}
    if(lastKo>=0)flush(lastKo);
  }
  return {lines,segLabels};
}

// Pontos que cada participante já tinha ANTES da janela escolhida (ex.: o total
// acumulado até a véspera quando o período é "Hoje"). Usa só resultados oficiais
// dos jogos anteriores à janela, pra a curva do recorte começar de onde a pessoa
// realmente estava — e não do zero.
function rankingChartBaselineBefore(rows,games){
  const base={};
  rows.forEach(p=>{base[p.i]=0;});
  const windowGames=(games||[]).filter(Boolean);
  if(!windowGames.length) return base;
  const windowIds=new Set(windowGames.map(g=>g.id));
  const ordered=GAMES.slice().sort(compareGameSchedule);
  let firstIdx=Infinity;
  ordered.forEach((g,idx)=>{ if(windowIds.has(g.id)&&idx<firstIdx) firstIdx=idx; });
  if(!isFinite(firstIdx)) return base;
  for(let idx=0;idx<firstIdx;idx++){
    const game=ordered[idx];
    if(windowIds.has(game.id)) continue;
    const res=S.results[game.id];
    if(!res) continue;
    rows.forEach(p=>{
      const pal=S.palpites[`${p.i}_${game.id}`];
      const v=score(pal,res,game);
      base[p.i]+=(v==null?0:v);
    });
  }
  return base;
}

function rankingLinePath(values,width,height,padX,padY,minVal,maxVal){
  const usableWidth=width-padX*2;
  const usableHeight=height-padY*2;
  const steps=Math.max(1,values.length-1);
  const range=Math.max(1,maxVal-minVal);
  return values.map((value,index)=>{
    const x=padX+(usableWidth*(index/steps));
    const y=height-padY-(usableHeight*((value-minVal)/range));
    return `${index===0?"M":"L"} ${x.toFixed(2)} ${y.toFixed(2)}`;
  }).join(" ");
}
function rankingLinePathSegmented(values,states,width,height,padX,padY,minVal,maxVal){
  const usableWidth=width-padX*2;
  const usableHeight=height-padY*2;
  const steps=Math.max(1,values.length-1);
  const range=Math.max(1,maxVal-minVal);
  const pt=(value,index)=>{
    const x=padX+(usableWidth*(index/steps));
    const y=height-padY-(usableHeight*((value-minVal)/range));
    return `${x.toFixed(2)} ${y.toFixed(2)}`;
  };
  const solid=[],dashed=[];
  for(let i=1;i<values.length;i++){
    const seg=`M ${pt(values[i-1],i-1)} L ${pt(values[i],i)}`;
    if(states[i]==="live") dashed.push(seg); else solid.push(seg);
  }
  return {solid:solid.join(" "),dashed:dashed.join(" ")};
}
function rankingLinePathFlex(values,xFor,yFor){
  return values.map((value,index)=>`${index===0?"M":"L"} ${xFor(index).toFixed(2)} ${yFor(value).toFixed(2)}`).join(" ");
}
function rankingLinePathSegmentedFlex(values,states,xFor,yFor){
  const pt=(value,index)=>`${xFor(index).toFixed(2)} ${yFor(value).toFixed(2)}`;
  const solid=[],dashed=[];
  for(let i=1;i<values.length;i++){
    const seg=`M ${pt(values[i-1],i-1)} L ${pt(values[i],i)}`;
    if(states[i]==="live") dashed.push(seg); else solid.push(seg);
  }
  return {solid:solid.join(" "),dashed:dashed.join(" ")};
}
function rankingPointDot(value,index,totalPoints,width,height,padX,padY,minVal,maxVal,color){
  const usableWidth=width-padX*2;
  const usableHeight=height-padY*2;
  const steps=Math.max(1,totalPoints-1);
  const range=Math.max(1,maxVal-minVal);
  const x=padX+(usableWidth*(index/steps));
  const y=height-padY-(usableHeight*((value-minVal)/range));
  return `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="3.5" fill="${color}" stroke="#fff" stroke-width="2"></circle>`;
}

function renderRankingChart(rows,isExpanded=false){
  if(!rankingChartTouched&&!rankingChartSelection.length) rankingChartSelection=rankingChartDefaultSelection(rows);
  const selected=rows.filter(p=>rankingChartSelection.includes(p.i));
  const top3Ids=rows.slice(0,3).map(p=>p.i);
  const allIds=rows.map(p=>p.i);
  const top3Active=top3Ids.length>0&&rankingChartSelection.length===top3Ids.length&&top3Ids.every(id=>rankingChartSelection.includes(id));
  const allActive=allIds.length>0&&allIds.every(id=>rankingChartSelection.includes(id));
  const periods=rankingChartPeriodOptions();
  const steps=rankingChartStepOptions();
  const activePeriod=periods.find(period=>period.id===rankingChartPeriod)||periods[0];
  const activeStep=steps.find(step=>step.id===rankingChartStep)||steps[0];
  const baselineModes=rankingChartBaselineOptions();
  const activeBaseline=baselineModes.find(mode=>mode.id===rankingChartBaseline)||baselineModes[0];
  const showBaseline=activePeriod.id!=="all";
  const isFullOriginal=activePeriod.id==="all"&&activeStep.id==="goals";
  const chart=rankingChartForMode(rows,activePeriod,activeStep);
  const padX=42;
  const padY=22;
  const padRight=isExpanded?160:124;
  const lineWidth=760;
  const usableWidth=lineWidth-padX-padRight;
  const points=chart.labels.length;
  const eventCount=chart.events?chart.events.filter(Boolean).length:0;
  // Frame (eixos, grade, datas) sempre desenha quando há dados; sem ninguém selecionado, só somem as linhas.
  const drawChart=(isFullOriginal&&activePeriod.drawWhenEmpty)||eventCount>0;
  // Marcadores de lance sob o eixo X: o rótulo encolhe conforme a Copa acumula
  // eventos (bandeiras+placar -> só placar -> só tracinho com tooltip), pra
  // continuar legível dos primeiros jogos até a final.
  const stepPx=usableWidth/Math.max(1,points-1);
  const goalTier=!eventCount?"tick":stepPx>=24?"full":stepPx>=11?"score":"tick";
  const goalBand=goalTier==="full"?40:goalTier==="score"?22:0;
  const padBottom=(isExpanded?50:44)+goalBand;
  const lineHeight=(isExpanded?400:360)+goalBand;
  const usableHeight=lineHeight-padY-padBottom;
  const tickValues=chartIntegerTicks(chart.minVal,chart.maxVal,isExpanded?14:11);
  const range=Math.max(1,chart.maxVal-chart.minVal);
  const xFor=index=>padX+(usableWidth*(chart.xRel?.[index]??(index/Math.max(1,points-1))));
  const yFor=value=>padY+usableHeight-(usableHeight*((value-chart.minVal)/range));
  const activePeriodSummary=activePeriod.subtitle&&activePeriod.subtitle!==activePeriod.label
    ?`${activePeriod.label} · ${activePeriod.subtitle}`
    :activePeriod.label;
  const summary=(isFullOriginal?[
      chart.dateCount?`${chart.dateCount} ${chart.dateCount===1?"dia":"dias"} com jogo`:"Sem jogos apurados ainda",
      chart.resolvedCount?`${chart.resolvedCount} ${chart.resolvedCount===1?"jogo":"jogos"} apurados`:"",
      chart.liveGameCount?`${chart.liveGameCount} ao vivo · tracejado = parcial`:"",
      chart.detailEventCount?"Inclui a oscilação gol a gol":"",
      eventCount&&goalTier!=="tick"?"Placar de cada lance no eixo":"",
      eventCount&&goalTier==="tick"?"Lances marcados como traços no eixo (toque para ver)":"",
      chart.includePodio?"Pódio oficial incluído":"",
      selected.length?`${selected.length} de ${rows.length} no gráfico`:""
    ]:[
      activePeriodSummary,
      activeStep.subtitle,
      showBaseline&&activeBaseline.id==="carry"?"Começa do total anterior":"",
      chart.fixtureCount?`${chart.fixtureCount} ${chart.fixtureCount===1?"jogo":"jogos"}`:"",
      chart.scoredCount?`${chart.scoredCount} com placar`:"",
      chart.liveGameCount?`${chart.liveGameCount} ao vivo · tracejado = parcial`:"",
      chart.detailEventCount?"Inclui a oscilação gol a gol":"",
      eventCount&&goalTier!=="tick"?"Placar de cada lance no eixo":"",
      eventCount&&goalTier==="tick"?"Lances marcados como traços no eixo (toque para ver)":"",
      selected.length?`${selected.length} de ${rows.length} no gráfico`:""
    ]).filter(Boolean);
  const axisMax=isExpanded?14:9;
  const axisIdx=chart.axisCandidates&&chart.axisCandidates.length
    ?chartAxisIndexesFromCandidates(chart.axisCandidates,axisMax)
    :chartAxisIndexes(points,axisMax);
  // Em gráficos muito cheios, as oscilações intra-jogo ficam só na linha (sem bolinha).
  const dense=points>90;
  const eventTip=(index,name,value)=>{
    const st=chart.states[index];
    const recorteTip=activePeriod.id==="all"?"":" no recorte";
    if(st==="start") return `Início — ${name}: 0 pts${recorteTip}`;
    if(st==="podio") return `Pódio — ${name}: ${value} pts`;
    const ev=chart.events?.[index];
    if(!ev) return "";
    const flag=ev.synthetic?" · 0x0 no intervalo":st==="live"?" · ao vivo (parcial)":st==="detail"?" · parcial durante o jogo":"";
    return `${ev.game.t1} ${ev.res.s1}x${ev.res.s2} ${ev.game.t2}${flag} — ${name}: ${value} pts${recorteTip}`;
  };
  const uniqueLabels=chartUniqueLabels(selected.map(l=>l.name));
  const endpointItems=selected.map((line,idx)=>{
    const s=chart.series.find(ss=>ss.i===line.i);
    const values=s?.values||[0];
    const v=values[values.length-1]||0;
    return {color:s?.color||"#002776",name:uniqueLabels[idx],value:v,y:yFor(v),i:line.i,focused:rankingChartFocus===line.i};
  });
  const endpointLabels=chartEndpointLabelsSvg(endpointItems,{
    baseX:xFor(points-1),
    lineHeight:14,
    groupGap:isExpanded?18:16,
    topBound:padY+4,
    bottomBound:padY+usableHeight-2,
    maxChars:isExpanded?24:18,
    fontSize:11.5,
    dy:4
  });
  const axisBaseY=padY+usableHeight;
  const goalMarkers=(chart.events||[]).map((ev,i)=>{
    if(!ev) return "";
    const st=chart.states[i];
    const x=xFor(i);
    const color=st==="live"?"#d83a34":st==="final"?"#002776":"#8492ab";
    const scoreTxt=`${ev.res.s1}x${ev.res.s2}`;
    const tip=`${ev.game.t1} ${scoreTxt} ${ev.game.t2}${ev.synthetic?" · 0x0 no intervalo":st==="live"?" · ao vivo (parcial)":""}`;
    const tickEnd=axisBaseY+(st==="detail"?4:5.5);
    let label="";
    if(goalTier!=="tick"){
      const txt=goalTier==="full"?`${TEAM_FLAGS[ev.game.t1]||""} ${scoreTxt} ${TEAM_FLAGS[ev.game.t2]||""}`.trim():scoreTxt;
      const ty=axisBaseY+15;
      label=`<text x="${x.toFixed(2)}" y="${ty.toFixed(2)}" text-anchor="end" font-size="9" font-weight="800" fill="${color}" transform="rotate(-45 ${x.toFixed(2)} ${ty.toFixed(2)})">${esc(txt)}</text>`;
    }
    return `<g class="chart-goal-marker${st==="live"?" is-live":""}">
      <title>${esc(tip)}</title>
      <line x1="${x.toFixed(2)}" y1="${axisBaseY.toFixed(2)}" x2="${x.toFixed(2)}" y2="${tickEnd.toFixed(2)}" stroke="${color}" stroke-width="${st==="detail"?1.1:1.7}"></line>
      ${label}
    </g>`;
  }).join("");
  return `<section class="chart-shell">
    <div class="chart-toolbar">
      <div class="chart-toolbar-head">
        <div class="section-kicker">Evolução dos pontos</div>
        <h3 style="margin-top:4px">Compare um ou vários participantes ao mesmo tempo</h3>
      </div>
      ${!isExpanded?`<button class="chart-expand-btn" onclick="openChartModal('ranking')" aria-label="Expandir gráfico">⤢ Expandir</button>`:""}
    </div>
    <div class="chart-controls">
      <div class="chart-control">
        <span class="chart-control-label">Período</span>
        <div class="chart-seg" role="group" aria-label="Período do gráfico">
          ${periods.map(period=>`<button type="button" class="chart-seg-btn ${period.id===activePeriod.id?"active":""}" onclick="setRankingChartPeriod('${period.id}')" aria-pressed="${period.id===activePeriod.id?"true":"false"}">${esc(period.label)}</button>`).join("")}
        </div>
      </div>
      <div class="chart-control">
        <span class="chart-control-label">Detalhe</span>
        <div class="chart-seg" role="group" aria-label="Tipo de evolução do gráfico">
          ${steps.map(step=>`<button type="button" class="chart-seg-btn ${step.id===activeStep.id?"active":""}" onclick="setRankingChartStep('${step.id}')" aria-pressed="${step.id===activeStep.id?"true":"false"}">${esc(step.label)}</button>`).join("")}
        </div>
      </div>
      ${showBaseline?`<div class="chart-control">
        <span class="chart-control-label">Base</span>
        <div class="chart-seg" role="group" aria-label="Base do gráfico">
          ${baselineModes.map(mode=>`<button type="button" class="chart-seg-btn ${mode.id===activeBaseline.id?"active":""}" onclick="setRankingChartBaseline('${mode.id}')" aria-pressed="${mode.id===activeBaseline.id?"true":"false"}" title="${esc(mode.subtitle)}">${esc(mode.label)}</button>`).join("")}
        </div>
      </div>`:""}
    </div>
    ${drawChart?`<div class="chart-stage">
      <svg viewBox="0 0 ${lineWidth} ${lineHeight}" preserveAspectRatio="xMidYMid meet" class="${rankingChartFocus!=null&&selected.some(p=>p.i===rankingChartFocus)?"chart-focus":""}" role="img" aria-label="Gráfico de evolução da pontuação do ranking: ${esc(`${activePeriod.label} - ${activeStep.label}`)}">
        <line x1="${padX}" y1="${padY}" x2="${padX}" y2="${padY+usableHeight}" stroke="rgba(0,39,118,.2)" stroke-width="1"></line>
        ${tickValues.map(value=>{
          const y=yFor(value);
          const isZero=value===0;
          return `<g>
            <line x1="${padX}" y1="${y.toFixed(2)}" x2="${(padX+usableWidth).toFixed(2)}" y2="${y.toFixed(2)}" stroke="rgba(0,39,118,${isZero?".22":".12"})" stroke-width="1"></line>
            <text x="${(padX-8).toFixed(2)}" y="${(y+4).toFixed(2)}" text-anchor="end" font-size="12" fill="#5a6a82" font-weight="800">${value}</text>
          </g>`;
        }).join("")}
        ${(()=>{
          // Divisórias de fase (grupos->KO em "all"; entre fases em "ko"). Desenha atrás das
          // curvas (vem antes das séries no SVG). Some sozinho quando não há jogo de KO.
          const dv=rankingChartPhaseDividers(chart,activePeriod);
          if(!dv.lines.length&&!dv.segLabels.length) return "";
          const topY=padY,botY=padY+usableHeight;
          const lineSvg=dv.lines.map(d=>{
            const x=(xFor(d.index-1)+xFor(d.index))/2;
            return `<line x1="${x.toFixed(2)}" y1="${topY}" x2="${x.toFixed(2)}" y2="${botY.toFixed(2)}" stroke="rgba(0,39,118,.3)" stroke-width="1" stroke-dasharray="4 4"></line>`
              +(d.label?`<text x="${(x+3).toFixed(2)}" y="${(topY+11).toFixed(2)}" font-size="9.5" fill="#5a6a82" font-weight="800" text-anchor="start">${esc(d.label)}</text>`:"");
          }).join("");
          const segSvg=dv.segLabels.map(s=>{
            const cx=(xFor(s.from)+xFor(s.to))/2;
            return `<text x="${cx.toFixed(2)}" y="${(topY+11).toFixed(2)}" font-size="9.5" fill="#41516d" font-weight="850" text-anchor="middle">${esc(s.text)}</text>`;
          }).join("");
          return lineSvg+segSvg;
        })()}
        ${axisIdx.map(i=>{
          const x=xFor(i);
          const lbl=chart.labels[i]||"";
          const isStart=i===0;
          const isPodio=chart.includePodio&&i===points-1;
          // Datas descem uma faixa quando os placares dos lances ocupam o rodapé;
          // aí ficam na horizontal pra não invadir a diagonal dos placares, e a
          // primeira data se afasta do "Início" pra não sobrepor.
          const tx=isStart?x+4:(goalBand?Math.max(x,padX+64):x);
          const ty=padY+usableHeight+goalBand+(isStart?15:17);
          const anchor=isStart?"start":"middle";
          const rot=isStart||goalBand?0:-32;
          return `<g>
            <line x1="${x.toFixed(2)}" y1="${(padY+usableHeight).toFixed(2)}" x2="${x.toFixed(2)}" y2="${(padY+usableHeight+5).toFixed(2)}" stroke="rgba(0,39,118,.25)" stroke-width="1"></line>
            <text class="chart-axis-tick ${isStart?"is-start":""} ${isPodio?"is-podio":""}" x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" text-anchor="${anchor}" font-size="11" fill="#41516d" font-weight="850"${rot?` transform="rotate(${rot} ${tx.toFixed(2)} ${ty.toFixed(2)})"`:""}>${esc(lbl)}</text>
          </g>`;
        }).join("")}
        ${goalMarkers}
        ${selected.map(line=>{
          const seriesLine=chart.series.find(s=>s.i===line.i);
          const color=seriesLine?.color||"#002776";
          const values=seriesLine?.values||[0];
          const name=seriesLine?.name||"";
          const paths=rankingLinePathSegmentedFlex(values,chart.states,xFor,yFor);
          return `<g class="chart-series${rankingChartFocus===line.i?" is-focused":""}" data-series="${line.i}" onmouseenter="hoverRankingSeries(this,${line.i},true)" onmouseleave="hoverRankingSeries(this,${line.i},false)" onclick="focusRankingSeries(${line.i},event)">
            ${paths.solid?`<path d="${paths.solid}" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"></path><path d="${paths.solid}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".97"></path>`:""}
            ${paths.dashed?`<path d="${paths.dashed}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" opacity=".88"></path>`:""}
            ${values.map((value,index)=>{
              const st=chart.states[index];
              const isLast=index===values.length-1;
              const isLive=st==="live";
              if(!isLast&&dense&&st==="detail") return "";
              const x=xFor(index);
              const y=yFor(value);
              const title=`<title>${esc(eventTip(index,name,value))}</title>`;
              if(isLast) return `<circle class="chart-endpoint-dot ${isLive?"is-live":""}" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="5" fill="${color}" stroke="#fff" stroke-width="2.4">${title}</circle>`;
              if(isLive) return `<circle class="chart-live-dot" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="3" fill="#fff" stroke="${color}" stroke-width="2">${title}</circle>`;
              return `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${st==="detail"?2.3:3}" fill="${color}" stroke="#fff" stroke-width="1.6">${title}</circle>`;
            }).join("")}
          </g>`;
        }).join("")}
        ${endpointLabels}
      </svg>
    </div>`:`<div class="chart-empty">${esc(rankingChartEmptyText(activePeriod,activeStep))}</div>`}
    <div class="chart-filter" role="group" aria-label="Filtrar participantes">
      <button type="button" class="chart-preset-btn ${allActive?"active":""}" onclick="setRankingChartPreset('all')" aria-pressed="${allActive?"true":"false"}">Todos</button>
      <button type="button" class="chart-preset-btn ${top3Active?"active":""}" onclick="setRankingChartPreset('top3')" aria-pressed="${top3Active?"true":"false"}">Top 3</button>
      <span class="chart-filter-sep" aria-hidden="true"></span>
      ${rows.map((p,idx)=>{
        const color=RANKING_SERIES_COLORS[idx%RANKING_SERIES_COLORS.length];
        const active=rankingChartSelection.includes(p.i);
        return `<button class="chart-chip ${active?"active":""}" onclick="toggleRankingSeries(${p.i})" style="${active?`background:${color}`:""}">
          <span class="chart-dot" style="background:${color}"></span>
          <span>${esc(p.name)}</span>
        </button>`;
      }).join("")}
    </div>
  </section>`;
}

/* ===========================================================================
   Confete de dia de jogo do Brasil
   Quando o app abre num dia em que a Seleção entra em campo, a tela inicial
   ganha uma chuva curta de confetes nas cores do Brasil (azul, verde e
   amarelo). Dispara uma única vez por abertura do app, só na Início, e
   respeita prefers-reduced-motion.
   =========================================================================== */
let brazilConfettiShown=false;
let brazilConfettiActive=false;

function brazilPlaysToday(){
  const today=todayKey();
  return GAMES.some(game=>{
    if(game.date!==today) return false;
    const {t1,t2}=gameTeams(game);
    return t1==="Brasil"||t2==="Brasil";
  });
}

function maybeCelebrateBrazilMatchday(){
  if(brazilConfettiShown||activeTab!=="home") return;
  if(!brazilPlaysToday()) return;
  brazilConfettiShown=true;
  requestAnimationFrame(launchBrazilConfetti);
}

function launchBrazilConfetti(){
  if(brazilConfettiActive||!document.body) return;
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  brazilConfettiActive=true;

  const canvas=document.createElement("canvas");
  canvas.className="brazil-confetti-canvas";
  canvas.setAttribute("aria-hidden","true");
  const ctx=canvas.getContext("2d");
  document.body.appendChild(canvas);

  const dpr=Math.min(window.devicePixelRatio||1,2);
  let width=0,height=0;
  function resize(){
    width=window.innerWidth;
    height=window.innerHeight;
    canvas.width=Math.floor(width*dpr);
    canvas.height=Math.floor(height*dpr);
    canvas.style.width=width+"px";
    canvas.style.height=height+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener("resize",resize);

  // Azul, verde e amarelo do Brasil — duas tonalidades de cada para dar volume.
  const COLORS=["#00843d","#1faa51","#ffdf00","#ffc62e","#002776","#2f6fe0"];
  const SHAPES=["rect","ribbon","circle"];
  const rand=(min,max)=>min+Math.random()*(max-min);
  const pick=arr=>arr[(Math.random()*arr.length)|0];

  // Densidade proporcional à largura (mais discreto no mobile).
  const count=Math.round(Math.min(170,Math.max(70,width/7)));
  const EMIT_MS=1250;  // janela em que as peças vão sendo lançadas
  const FADE_MS=650;   // suavização final (rede de segurança)
  const MAX_MS=6500;   // teto absoluto de duração

  const pieces=[];
  for(let i=0;i<count;i++){
    const shape=pick(SHAPES);
    const size=rand(6,12);
    pieces.push({
      shape,
      color:pick(COLORS),
      x:rand(-0.05,1.05)*width,
      y:rand(-0.3,-0.02)*height,
      w:shape==="ribbon"?size*0.42:size,
      h:shape==="ribbon"?size*2.6:size,
      delay:rand(0,EMIT_MS),
      vx:rand(-28,28),
      vy:rand(120,210),
      grav:rand(60,120),
      drift:rand(16,46),
      driftSpeed:rand(0.8,2.2),
      phase:rand(0,Math.PI*2),
      spin:rand(-3.4,3.4),
      angle:rand(0,Math.PI*2),
      flip:rand(2.6,5.2)
    });
  }

  const start=performance.now();
  let last=start,raf=0;

  function cleanup(){
    cancelAnimationFrame(raf);
    window.removeEventListener("resize",resize);
    canvas.remove();
    brazilConfettiActive=false;
  }

  function frame(now){
    const elapsed=now-start;
    let dt=(now-last)/1000;
    last=now;
    if(dt>0.05) dt=0.05; // evita saltos quando a aba volta do background

    ctx.clearRect(0,0,width,height);
    const globalFade=elapsed>MAX_MS-FADE_MS?Math.max(0,(MAX_MS-elapsed)/FADE_MS):1;

    let alive=0;
    for(const p of pieces){
      if(elapsed<p.delay){alive++;continue;}
      const t=(elapsed-p.delay)/1000;
      p.vy=Math.min(p.vy+p.grav*dt,320);
      p.y+=p.vy*dt;
      p.x+=(p.vx+Math.sin(t*p.driftSpeed+p.phase)*p.drift)*dt;
      p.angle+=p.spin*dt;
      if(p.y-p.h>height+24) continue; // já saiu por baixo
      alive++;

      ctx.save();
      ctx.globalAlpha=globalFade;
      ctx.translate(p.x,p.y);
      ctx.rotate(p.angle);
      ctx.scale(1,Math.cos(t*p.flip+p.phase)); // giro 3D
      ctx.fillStyle=p.color;
      if(p.shape==="circle"){
        ctx.beginPath();
        ctx.arc(0,0,p.w/2,0,Math.PI*2);
        ctx.fill();
      }else{
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      }
      ctx.restore();
    }

    if(alive>0&&elapsed<MAX_MS&&globalFade>0) raf=requestAnimationFrame(frame);
    else cleanup();
  }

  raf=requestAnimationFrame(frame);
}

const COPA_LIVE_ACTIVE_STATUSES=new Set(["1H","2H","HT","ET","BT","P","LIVE","IN_PLAY","PAUSED"]);
const COPA_LIVE_FINAL_STATUSES=new Set(["FT","AET","PEN","AWD","FINISHED","AWARDED"]);
function copaLiveForGame(gameId){
  return copaLive[gameId]||null;
}
function copaLiveIsActive(live){
  return Boolean(live&&COPA_LIVE_ACTIVE_STATUSES.has(String(live.status_short||"")));
}
function copaLiveIsFinal(live){
  return Boolean(live&&COPA_LIVE_FINAL_STATUSES.has(String(live.status_short||"")));
}
function copaLiveHasScore(live){
  return Boolean(live)&&live.goals_home!=null&&live.goals_away!=null;
}
// Placar ao vivo exibível para um jogo SEM resultado oficial ainda.
function copaLiveScoreForGame(game){
  if(S.results[game.id]) return null;
  const live=copaLiveForGame(game.id);
  if(!copaLiveHasScore(live)) return null;
  if(!copaLiveIsActive(live)&&!copaLiveIsFinal(live)) return null;
  return live;
}
// Resultado provisório (ao vivo) no formato de `results`, para a tabela de grupos e o ranking.
function liveProvisionalResult(game){
  const live=copaLiveScoreForGame(game);
  if(!live) return null;
  const res={
    s1:+live.goals_home,
    s2:+live.goals_away,
    yellowCards1:live.yellow_cards_home,
    yellowCards2:live.yellow_cards_away,
    yellowRedCards1:live.yellow_red_cards_home,
    yellowRedCards2:live.yellow_red_cards_away,
    redCards1:live.red_cards_home,
    redCards2:live.red_cards_away,
    provisional:true
  };
  // No mata-mata, repassa prorrogação/pênaltis ao vivo para o bônus de "quem passa" pontuar parcialmente.
  if(game?.ko){
    if(live.after_extra_goals_home!=null) res.afterEt1=+live.after_extra_goals_home;
    if(live.after_extra_goals_away!=null) res.afterEt2=+live.after_extra_goals_away;
    if(live.pens_home!=null) res.pens1=+live.pens_home;
    if(live.pens_away!=null) res.pens2=+live.pens_away;
  }
  return res;
}
// Resultado "efetivo" dos grupos: o oficial (admin/robô em `results`) sempre manda;
// o ao vivo só entra como provisório enquanto não existe resultado oficial.
function effectiveGroupResultForGame(game){
  return S.results[game.id]||liveProvisionalResult(game);
}
function copaLiveMinuteLabel(live){
  if(!live) return "";
  const st=String(live.status_short||"");
  if(st==="HT") return "Intervalo";
  if(st==="BT") return "Intervalo da prorrogação";
  if(st==="ET") return live.elapsed!=null?`Prorrogação ${live.elapsed}'`:"Prorrogação";
  if(st==="P") return "Pênaltis";
  if(["1H","2H","LIVE","IN_PLAY","PAUSED"].includes(st)) return live.elapsed!=null?`${live.elapsed}'`:"Ao vivo";
  if(COPA_LIVE_FINAL_STATUSES.has(st)) return "Encerrado";
  return "";
}
function copaLivePensSuffix(live){
  if(!live||live.pens_home==null||live.pens_away==null) return "";
  return ` · pên. ${live.pens_home}–${live.pens_away}`;
}
function copaGameState(game){
  if(S.results[game.id]) return "final";
  const live=copaLiveForGame(game.id);
  if(copaLiveIsActive(live)) return "live";
  if(copaLiveIsFinal(live)) return "closed";
  const kickoff=game.utc?new Date(game.utc).getTime():NaN;
  if(Number.isFinite(kickoff)){
    const now=Date.now();
    if(now>=kickoff&&now<kickoff+2*60*60*1000) return "live";
    if(now>=kickoff) return "closed";
  }
  return "upcoming";
}
function copaGameStateLabel(game){
  const state=copaGameState(game);
  if(state==="final") return "Final";
  if(state==="live") return "Ao vivo";
  if(state==="closed") return "Fechado";
  return "Programado";
}
function copaRoundLabel(game){
  if(game.ko) return game.matchNo?`Jogo ${game.matchNo}`:game.phase;
  return game.round?`Rodada ${game.round}`:"Fase de grupos";
}
function copaDayTitle(key){
  const d=parseDateKey(key);
  if(!d||Number.isNaN(d.getTime())) return "Sem data";
  return new Intl.DateTimeFormat("pt-BR",{weekday:"long",day:"2-digit",month:"long"}).format(d);
}
function copaScoreHTML(s1,s2){
  const waiting=s1==null||s2==null;
  return `<div class="copa-score ${waiting?"is-waiting":""}"><b>${s1!=null?s1:"-"}</b><span>×</span><b>${s2!=null?s2:"-"}</b></div>`;

function copaTeamHTML(name,side="",muted=false){

// Predicados base reaproveitados pelas duas seções (grupos e mata-mata).
function copaMatchesSearch(game,search){
  if(!search) return true;
  const teams=gameTeams(game);
  return `${game.id} ${game.phase} ${teams.t1} ${teams.t2}`.toLowerCase().includes(search);
}
function copaMatchesStatus(game){
  const state=copaGameState(game);
  if(jogosStatusFilter==="open"&&state!=="upcoming") return false;
  if(jogosStatusFilter==="live"&&state!=="live") return false;
  if(jogosStatusFilter==="finished"&&state!=="final") return false;
  if(jogosStatusFilter==="pending"&&state==="final") return false;
  return true;
}
// Jogos visíveis da seção de grupos: aplica o seletor de grupo próprio da gaveta,
// depois busca e status.
function copaGroupVisibleGames(){
  const search=jogosSearch.trim().toLowerCase();
  return GAMES.filter(g=>!g.ko)
    .filter(g=>jGroupFilter==="all"||g.phase===`Grupo ${jGroupFilter.slice(2)}`)
    .filter(g=>copaMatchesSearch(g,search))
    .filter(copaMatchesStatus)
    .sort(compareGameSchedule);
}
// Jogos visíveis da seção de mata-mata: aplica o seletor de fase próprio da gaveta,
// depois busca e status.
function copaKoVisibleGames(){
  const search=jogosSearch.trim().toLowerCase();
  return GAMES.filter(g=>g.ko)
    .filter(g=>jKoFilter==="all"||g.phaseKey===jKoFilter)
    .filter(g=>copaMatchesSearch(g,search))
    .filter(copaMatchesStatus)
    .sort(compareGameSchedule);
}
// Base dos cards de métrica: soma grupos + mata-mata respeitando os seletores de
// fase e a busca, mas SEM o filtro de status (pra os números não zerarem ao filtrar
// por status). Mata-mata só entra quando já foi montado.
function copaMetricsGames(){
  const search=jogosSearch.trim().toLowerCase();
  const grp=GAMES.filter(g=>!g.ko)
    .filter(g=>jGroupFilter==="all"||g.phase===`Grupo ${jGroupFilter.slice(2)}`)
    .filter(g=>copaMatchesSearch(g,search));
  const ko=groupPhaseComplete()?GAMES.filter(g=>g.ko)
    .filter(g=>jKoFilter==="all"||g.phaseKey===jKoFilter)
    .filter(g=>copaMatchesSearch(g,search)):[];
  return [...ko,...grp];
}
function setJogosStatus(value){
  jogosStatusFilter=jogosStatusFilter===value?"all":value;
  renderJogos();
}
// Cards de métrica são clicáveis e funcionam como filtro rápido de status.
// Os números vêm da lista filtrada por fase+busca (sem o filtro de status),
// pra não zerarem quando um status é selecionado.
function renderCopaMetrics(games){
  const total=games.length;
  const live=games.filter(game=>copaGameState(game)==="live").length;
  const finished=games.filter(game=>copaGameState(game)==="final").length;
  const pending=games.filter(game=>copaGameState(game)!=="final").length;
  const cards=[
    ["all",total,"Na tela"],
    ["live",live,"Ao vivo"],
    ["finished",finished,"Apurados"],
    ["pending",pending,"Pendentes"]
  ];
  return `<div class="copa-games-metrics">
    ${cards.map(([key,value,label])=>`<button type="button" class="copa-games-metric ${jogosStatusFilter===key&&key!=="all"?"is-active":""}" onclick="setJogosStatus('${key}')" title="Filtrar: ${label}"><strong>${value}</strong><span>${label}</span></button>`).join("")}
  </div>`;
}
// Dia "atual" da lista visível: hoje se tiver jogo; senão o próximo dia com
// jogo. Null quando só restam dias passados (fim da Copa / filtro retroativo).
function copaCurrentDayKey(games){
  const keys=[...new Set(games.map(g=>g.date).filter(Boolean))].sort();
  if(!keys.length) return null;
  const today=todayKey();
  if(keys.includes(today)) return today;
  return keys.find(k=>k>today)||null;
}
// Renderiza uma lista de jogos agrupada por dia (cada dia vira uma seção).
// currentKey marca qual dia leva o destaque "Hoje/Próximos"; passe null nos
// blocos que nunca devem ser "atuais" (ex.: o arquivo recolhido dos grupos).
function copaDaySections(list,currentKey){
  const today=todayKey();
  const groups=list.reduce((acc,game)=>{
    const key=game.date||"sem-data";
    if(!acc[key]) acc[key]=[];
    acc[key].push(game);
    return acc;
  },{});
  return Object.entries(groups).sort(([a],[b])=>a.localeCompare(b)).map(([key,dayGames])=>{
    const isCurrent=key===currentKey;
    const todayPill=isCurrent?`<span class="copa-games-day-now">${key===today?"Hoje":"Próximos"}</span>`:"";
    return `
    <section class="copa-games-day ${isCurrent?"is-current":""}" data-datekey="${esc(key)}">
      <div class="copa-games-day-head">
        <div class="copa-games-day-title">${esc(copaDayTitle(key))}${todayPill}</div>
        <div class="copa-games-day-count">${dayGames.length} ${dayGames.length===1?"jogo":"jogos"}</div>
      </div>
      <div class="copa-games-day-games">
        ${dayGames.map(game=>renderGameRow(game)).join("")}
      </div>
    </section>`;}).join("");
}
// Faixa de chips de fase que vive DENTRO de uma gaveta (no corpo, não no summary,
// pra clicar num chip não fechar o <details>).

// Uma gaveta de fase (grupos ou mata-mata): cabeçalho clicável + corpo com o
// seletor próprio e a lista de jogos (ou aviso de vazio).
function copaPhaseSectionHTML(o){

      <summary class="copa-group-archive-head">

        ${o.selector}

// A lista da aba Jogos vira duas gavetas independentes, cada uma com o seu seletor:
// "Mata-mata" (aberta por padrão, quando já foi montado) no topo e "Fase de grupos"
// embaixo (recolhida quando o mata-mata existe; aberta quando é a única seção).
function renderCopaGamesList(){
  const searchActive=!!jogosSearch.trim();
  const koAvailable=groupPhaseComplete();
  const groupChips=[{k:"all",l:"Todos"},...GROUP_KEYS.map(g=>({k:`g-${g}`,l:g}))];
  const koChips=[{k:"all",l:"Todos"},...KO_PHASES.map(p=>({k:p.k,l:p.l}))];
  const sections=[];

  if(koAvailable){
    const koGames=copaKoVisibleGames();
    const koOpen=copaKoStageOpen||searchActive||jKoFilter!=="all";
    const n=koGames.length;
    sections.push(copaPhaseSectionHTML({
      cls:"is-ko",
      ic:"🏆",
      title:"Mata-mata",
      meta:`${n} ${n===1?"jogo":"jogos"}`,
      selector:copaPhaseSelectorHTML(koChips,jKoFilter,"setJKoFilter"),
      body:n?copaDaySections(koGames,copaCurrentDayKey(koGames)):`<div class="copa-empty">Nenhum jogo do mata-mata bate com esse filtro.</div>`,
      open:koOpen,
      toggleVar:"copaKoStageOpen"
    }));
  }

  const groupGames=copaGroupVisibleGames();
  // Recolhida por padrão quando o mata-mata existe; aberta quando é a única seção,
  // quando há busca ativa ou quando um grupo específico está selecionado.
  const groupOpen=(!koAvailable)||copaGroupStageOpen||searchActive||jGroupFilter!=="all";
  const gn=groupGames.length;
  sections.push(copaPhaseSectionHTML({
    cls:"",
    ic:"📁",
    title:"Fase de grupos",
    badge:koAvailable?`<span class="copa-group-archive-badge">encerrada</span>`:"",
    meta:`${gn} ${gn===1?"jogo":"jogos"}`,
    selector:copaPhaseSelectorHTML(groupChips,jGroupFilter,"setJGroupFilter"),
    // Como arquivo (mata-mata em cena), nenhum dia leva o destaque "Hoje"; como
    // única seção, o dia atual destaca normalmente.
    body:gn?copaDaySections(groupGames,koAvailable?null:copaCurrentDayKey(groupGames)):`<div class="copa-empty">Nenhum jogo de grupo bate com esse filtro.</div>`,
    open:groupOpen,
    toggleVar:"copaGroupStageOpen"
  }));

  return `<div class="copa-games-list">${sections.join("")}</div>`;
}
function scrollCopaToCurrent(smooth=true){
